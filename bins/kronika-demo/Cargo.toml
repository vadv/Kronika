[package]
name = "kronika-demo"
description = "Runs the collector for a bounded window and reports segment size, RSS, and CPU"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
kronika-format = { version = "0.0.0", path = "../../crates/kronika-format" }
kronika-registry = { version = "0.0.0", path = "../../crates/kronika-registry" }
nix = { version = "0.29", features = ["signal"] }
rand = "0.8"
rustix = { version = "1", features = ["param"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"

[lints]
workspace = true
