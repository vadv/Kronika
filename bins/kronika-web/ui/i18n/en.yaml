pg.badge: "PG"
pg.pid.label: "PostgreSQL PID"
pg.pid.help: "Backend process ID. It matches the selected Linux PID exactly."
pg.leader_pid.label: "Leader PID"
pg.leader_pid.help: "Leader PID for a parallel worker group. Inspect Backend type and Query."
pg.datname.label: "Database"
pg.datname.help: "Database name for this backend. Background processes can have no database."
pg.usename.label: "Role"
pg.usename.help: "PostgreSQL role for this backend. Background processes can have no role."
pg.application_name.label: "Application"
pg.application_name.help: "Exact application_name reported by PostgreSQL. Inspect Client address and Backend type."
pg.client_addr.label: "Client address"
pg.client_addr.help: "Client address reported by PostgreSQL. An empty value is a local connection."
pg.backend_type.label: "Backend type"
pg.backend_type.help: "Exact backend_type reported by PostgreSQL. Inspect State and Wait event."
pg.state.label: "State"
pg.state.help: "Current PostgreSQL backend state. Inspect Wait event and Query beside it."
pg.wait_event_type.label: "Wait class"
pg.wait_event_type.help: "PostgreSQL wait-event class while the backend is waiting. Inspect Wait event and State."
pg.wait_event.label: "Wait event"
pg.wait_event.help: "PostgreSQL wait-event name while the backend is waiting. Inspect Wait class, State, and Query."
pg.query.label: "Query"
pg.query.help: "Exact query text from pg_stat_activity. Inspect State, Wait event, and Query started."
pg.query_id.label: "Query ID"
pg.query_id.help: "PostgreSQL query identifier, shown exactly without digit grouping. Inspect Query and Query started."
pg.backend_xid_age.label: "XID age"
pg.backend_xid_age.help: "Age of the backend transaction ID, in transactions. Inspect Transaction started and State."
pg.backend_xmin_age.label: "Xmin age"
pg.backend_xmin_age.help: "Age of the backend xmin horizon, in transactions. Inspect Transaction started and State."
pg.backend_start.label: "Backend started"
pg.backend_start.help: "Backend start time in UTC. Inspect Transaction started and Query started."
pg.xact_start.label: "Transaction started"
pg.xact_start.help: "Start time of the current transaction. Inspect State, XID age, and Query."
pg.query_start.label: "Query started"
pg.query_start.help: "Start time of the current query. Inspect State, Wait event, and Query."
pg.state_change.label: "State changed"
pg.state_change.help: "Time of the latest backend state change. Inspect State and Query started."
