system.group.cpu: "CPU and scheduler"
system.group.cpu.help: "CPU use and scheduler activity at the cursor. Inspect load and PSI when runnable or blocked work rises."
system.group.load: "Load"
system.group.load.help: "Runnable work over one, five, and fifteen minutes. Compare it with CPU use and CPU PSI."
system.group.memory: "Memory and swap"
system.group.memory.help: "Available memory, cache, swap, and OOM activity at the cursor. Inspect memory PSI beside these values."
system.group.pressure: "Pressure"
system.group.pressure.help: "Linux PSI over ten seconds for CPU, memory, and I/O. Compare each line with the matching resource metrics."
system.metric.health.label: "OS health"
system.metric.health.help: "Kronika OS health at the cursor. Compare its changes with CPU, load, memory, and PSI."
system.metric.cpu_busy.label: "CPU busy"
system.metric.cpu_busy.help: "Share of CPU time spent outside idle. Inspect runnable tasks, blocked tasks, and load beside it."
system.metric.procs_running.label: "Runnable processes"
system.metric.procs_running.help: "Processes ready to run according to /proc/stat. Inspect CPU busy and one-minute load."
system.metric.procs_blocked.label: "I/O-blocked processes"
system.metric.procs_blocked.help: "Processes waiting for I/O according to /proc/stat. Inspect I/O PSI and device activity."
system.metric.context_switches.label: "Context switches"
system.metric.context_switches.help: "Cumulative context switches since boot. Inspect its slope with runnable processes and CPU busy."
system.metric.load1.label: "Load 1m"
system.metric.load1.help: "One-minute load average. Compare it with runnable tasks and CPU busy near the cursor."
system.metric.load5.label: "Load 5m"
system.metric.load5.help: "Five-minute load average. Compare it with the one- and fifteen-minute values."
system.metric.load15.label: "Load 15m"
system.metric.load15.help: "Fifteen-minute load average. Compare it with the shorter load windows."
system.metric.runnable.label: "Runnable tasks"
system.metric.runnable.help: "Runnable tasks reported by /proc/loadavg. Inspect total tasks, CPU busy, and CPU PSI."
system.metric.tasks.label: "Total tasks"
system.metric.tasks.help: "Total tasks reported by /proc/loadavg. Compare it with runnable tasks and the process table."
system.metric.mem_available_percent.label: "Memory available"
system.metric.mem_available_percent.help: "Kernel estimate of memory available for new work as a percentage of total memory. Inspect memory PSI and swap."
system.metric.mem_available.label: "Available memory"
system.metric.mem_available.help: "Kernel estimate of memory available for new work. Inspect cache, swap, and memory PSI."
system.metric.mem_total.label: "Total memory"
system.metric.mem_total.help: "Total usable memory reported by the kernel. Use it as the baseline for available memory."
system.metric.cached.label: "Page cache"
system.metric.cached.help: "Memory used by the kernel page cache. Inspect available memory and device activity beside it."
system.metric.swap_free.label: "Free swap"
system.metric.swap_free.help: "Unused swap space. Compare it with total swap, available memory, and memory PSI."
system.metric.swap_total.label: "Total swap"
system.metric.swap_total.help: "Configured swap space. Compare it with free swap and process swap use."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Cumulative out-of-memory kills since boot. Inspect available memory, swap, and memory PSI around an increase."
system.metric.cpu_pressure.label: "CPU PSI 10s"
system.metric.cpu_pressure.help: "Ten-second average time when at least one task waited for CPU. Inspect CPU busy and runnable work."
system.metric.memory_pressure.label: "Memory PSI 10s"
system.metric.memory_pressure.help: "Ten-second average time when at least one task waited on memory. Inspect available memory and swap."
system.metric.io_pressure.label: "I/O PSI 10s"
system.metric.io_pressure.help: "Ten-second average time when at least one task waited on I/O. Inspect device and process I/O metrics."
