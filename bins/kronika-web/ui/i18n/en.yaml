pg.field.rows_per_call.label: "Rows/call"
pg.field.rows_per_call.help: "Interval rows/s divided by calls/s. Compare it with execution time and the query text."
pg.field.blocks_per_call.label: "Blocks/call"
pg.field.blocks_per_call.help: "Shared and local buffer hits and reads per call. Inspect cache hit ratio and read time beside it."
pg.field.hit_pct.label: "Cache hit"
pg.field.hit_pct.help: "Share of shared-buffer accesses served without a read. Inspect shared hits, reads and read time."
pg.field.wal_per_call.label: "WAL/call"
pg.field.wal_per_call.help: "Interval WAL bytes divided by calls/s. Inspect WAL bytes, records and calls together."
pg.field.plan_time_pct.label: "Planning share"
pg.field.plan_time_pct.help: "Planning time as a share of planning plus execution demand. Inspect planning, execution and calls together."
pg.field.cv.label: "CV"
pg.field.cv.help: "Execution-time standard deviation divided by the mean. Inspect minimum, maximum and call count beside it."
pg.field.min_exec_time_ms.label: "Min ms"
pg.field.min_exec_time_ms.help: "Shortest execution stored for this statistics period. Compare it with the mean, maximum and calls."
pg.field.max_exec_time_ms.label: "Max ms"
pg.field.max_exec_time_ms.help: "Longest execution stored for this statistics period. Compare it with the mean, minimum and calls."
pg.field.mean_exec_time_ms.label: "Mean ms"
pg.field.mean_exec_time_ms.help: "Mean execution time stored for this statistics period. Compare it with the interval mean, range and calls."
pg.field.stddev_exec_time_ms.label: "Stddev ms"
pg.field.stddev_exec_time_ms.help: "Execution-time standard deviation stored for this statistics period. Compare it with the mean, range and calls."
pg.field.first_call.label: "First call"
pg.field.first_call.help: "First call time recorded for this plan by the extension. Compare it with the last call and selected hour."
pg.field.last_call.label: "Last call"
pg.field.last_call.help: "Last call time recorded for this plan by the extension. Compare it with the first call and selected hour."
pg.field.rows_per_second.label: "Rows/s"
pg.field.rows_per_second.help: "Exact increase in rows divided by elapsed seconds. Compare it with calls/s and execution demand; a dash means the interval cannot be derived."
pg.field.planning_ms_per_second.label: "Planning ms/s"
pg.field.planning_ms_per_second.help: "Exact increase in planning milliseconds divided by elapsed seconds. Compare it with execution demand, calls/s, and plan count."
pg.field.shared_blk_read_ms_per_second.label: "Shared read ms/s"
pg.field.shared_blk_read_ms_per_second.help: "Shared-block read milliseconds per elapsed second, or aggregate block reads where that layout only exposes one timing. Compare it with read blocks and calls/s."
pg.field.shared_blk_write_ms_per_second.label: "Shared write ms/s"
pg.field.shared_blk_write_ms_per_second.help: "Shared-block write milliseconds per elapsed second, or aggregate block writes where that layout only exposes one timing. Compare it with written blocks and calls/s."
pg.field.local_blk_read_ms_per_second.label: "Local read ms/s"
pg.field.local_blk_read_ms_per_second.help: "Local-block read milliseconds per elapsed second when the physical layout exposes them. Compare it with local blocks and calls/s."
pg.field.local_blk_write_ms_per_second.label: "Local write ms/s"
pg.field.local_blk_write_ms_per_second.help: "Local-block write milliseconds per elapsed second when the physical layout exposes them. Compare it with local blocks and calls/s."
pg.field.temp_blk_read_ms_per_second.label: "Temp read ms/s"
pg.field.temp_blk_read_ms_per_second.help: "Temporary-block read milliseconds per elapsed second when the physical layout exposes them. Compare it with temporary blocks and calls/s."
pg.field.temp_blk_write_ms_per_second.label: "Temp write ms/s"
pg.field.temp_blk_write_ms_per_second.help: "Temporary-block write milliseconds per elapsed second when the physical layout exposes them. Compare it with temporary blocks and calls/s."
pg.field.total_exec_time.label: "Total execution time"
pg.field.total_exec_time.help: "Total time spent executing the statement. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.mean_exec_time.label: "Mean execution time"
pg.field.mean_exec_time.help: "Mean time spent executing one call of the statement. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.max_exec_time.label: "Maximum execution time"
pg.field.max_exec_time.help: "Longest recorded execution time for one call. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.rows.label: "Rows"
pg.field.rows.help: "Rows retrieved or affected by the statement or plan; the table shows the exact interval rate. Compare rows with calls and execution demand."
pg.field.shared_blks_hit.label: "Shared block hits"
pg.field.shared_blks_hit.help: "Shared-buffer blocks found in cache for the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.shared_blks_read.label: "Shared blocks read"
pg.field.shared_blks_read.help: "Shared-buffer blocks read for the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.shared_blks_written.label: "Shared blocks written"
pg.field.shared_blks_written.help: "Shared-buffer blocks written by the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.shared_blks_dirtied.label: "Shared blocks dirtied"
pg.field.shared_blks_dirtied.help: "Shared-buffer blocks dirtied by the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.local_blks_hit.label: "Local block hits"
pg.field.local_blks_hit.help: "Local-buffer blocks found in cache for the statement or plan. Compare the neighboring shared, local, and temporary-file counters."
pg.field.local_blks_read.label: "Local blocks read"
pg.field.local_blks_read.help: "Local-buffer blocks read for the statement or plan. Compare the neighboring shared, local, and temporary-file counters."
pg.field.local_blks_dirtied.label: "Local blocks dirtied"
pg.field.local_blks_dirtied.help: "Local-buffer blocks dirtied by the statement or plan. Compare the neighboring shared, local, and temporary-file counters."
pg.field.local_blks_written.label: "Local blocks written"
pg.field.local_blks_written.help: "Local-buffer blocks written by the statement or plan. Compare the neighboring shared, local, and temporary-file counters."
pg.field.temp_blks_read.label: "Temporary blocks read"
pg.field.temp_blks_read.help: "Temporary-file blocks read by the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.temp_blks_written.label: "Temporary blocks written"
pg.field.temp_blks_written.help: "Temporary-file blocks written by the statement or plan. Compare the neighboring shared, local, temporary-file, and WAL counters."
pg.field.wal_bytes.label: "WAL bytes"
pg.field.wal_bytes.help: "WAL volume generated by the statement. Compare the neighboring buffer, temporary-file, and WAL counters."
pg.field.wal_records.label: "WAL records"
pg.field.wal_records.help: "Number of WAL records generated by the statement. Compare the neighboring buffer, temporary-file, and WAL counters."
pg.field.wal_fpi.label: "WAL full-page images"
pg.field.wal_fpi.help: "WAL full-page images generated by the statement. Compare the neighboring WAL volume, record, and buffer counters."
pg.field.wal_buffers_full.label: "WAL buffers full"
pg.field.wal_buffers_full.help: "Times WAL buffers filled while the statement generated WAL. Compare this interval rate with WAL bytes, records, and full-page images."
pg.field.plans.label: "Plans"
pg.field.plans.help: "Number of times the statement was planned. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.total_plan_time.label: "Total planning time"
pg.field.total_plan_time.help: "Total time spent planning the statement. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.stats_since.label: "Statistics since"
pg.field.stats_since.help: "Time from which these statement statistics were accumulated. Compare calls, execution time, rows, plans, and the statistics start time."
pg.field.queryid_stat_statements.label: "Last statement Query ID"
pg.field.queryid_stat_statements.help: "vadv-only pg_stat_statements Query ID last attributed to this plan; it is not an exact join key. Inspect plan identity and interval before relating rows."
pg.field.slow_log_calls.label: "Slow-log calls"
pg.field.slow_log_calls.help: "Executions recorded through the vadv slow-statement threshold. Compare this interval rate with all plan calls and execution demand."
pg.field.relids.label: "Relation IDs"
pg.field.relids.help: "Relation OIDs attached to this Datasentinel plan in PostgreSQL array text. Inspect them with the command type, plan text, and stable IDs."
pg.field.cmd_type.label: "Command type"
pg.field.cmd_type.help: "Command type reported for this Datasentinel plan. Inspect it with relation IDs, plan text, calls, and execution demand."
pg.field.dealloc.label: "Plan evictions"
pg.field.dealloc.help: "Least-executed plan entries evicted after the plan store filled. Compare the interval rate with calls and the statistics reset time."
pg.field.stats_reset.label: "Statistics reset"
pg.field.stats_reset.help: "Time when all stored-plan statistics were last reset. Compare it with the selected hour and the first available interval."
pg.field.pid.label: "PID"
pg.field.pid.help: "Process ID of the PostgreSQL backend. Inspect PID, application, state, wait event, and blocker together."
pg.field.query_duration_ms.label: "Query time"
pg.field.query_duration_ms.help: "Active query time. Inspect state and wait."
pg.field.transaction_duration_ms.label: "Transaction time"
pg.field.transaction_duration_ms.help: "Current transaction age at this sample. Inspect state, query, and xmin age."
pg.field.application_name.label: "Application"
pg.field.application_name.help: "Application name supplied by the connected client. Inspect PID, application, state, wait event, and blocker together."
pg.field.state.label: "State"
pg.field.state.help: "Current state of the PostgreSQL backend. Inspect PID, application, state, wait event, and blocker together."
pg.field.wait_event_type.label: "Wait class"
pg.field.wait_event_type.help: "Class of the event the backend is waiting for. Inspect PID, application, state, wait event, and blocker together."
pg.field.wait_event.label: "Wait event"
pg.field.wait_event.help: "Name of the event the backend is waiting for. Inspect PID, application, state, wait event, and blocker together."
pg.field.blocked_by.label: "Blocked by"
pg.field.blocked_by.help: "Backend PIDs currently blocking this backend. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_locktype.label: "Lock type"
pg.field.lock_locktype.help: "Type of lockable object. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_mode.label: "Lock mode"
pg.field.lock_mode.help: "PostgreSQL lock mode held or awaited by the backend. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_target.label: "Lock target"
pg.field.lock_target.help: "Text representation of the lock target. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_relname.label: "Relation"
pg.field.lock_relname.help: "Name of the relation targeted by the lock. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_relation.label: "Relation ID"
pg.field.lock_relation.help: "OID of the relation targeted by the lock. Inspect PID, mode, target, blocker, and wait start together."
pg.field.lock_transactionid.label: "Transaction ID"
pg.field.lock_transactionid.help: "Transaction ID targeted by the lock. Inspect PID, mode, target, blocker, and wait start together."
pg.field.waitstart.label: "Wait started"
pg.field.waitstart.help: "Time when the backend began waiting for the lock. Inspect PID, mode, target, blocker, and wait start together."
pg.field.datid.label: "Database ID"
pg.field.datid.help: "OID of the database. Inspect the database name and the other counters in this row."
pg.field.numbackends.label: "Backends"
pg.field.numbackends.help: "Number of backends currently connected to the database. Compare it with sessions, transactions, and current backend activity."
pg.field.xact_commit.label: "Commits/s"
pg.field.xact_commit.help: "Cumulative committed transactions in the database. Compare commits with rollbacks, sessions, and conflicts."
pg.field.xact_rollback.label: "Rollbacks/s"
pg.field.xact_rollback.help: "Cumulative rolled-back transactions in the database. Compare commits with rollbacks, sessions, and conflicts."
pg.field.blks_hit.label: "Block hits"
pg.field.blks_hit.help: "Cumulative database block requests served from PostgreSQL buffers. Compare block hits, reads, and I/O time."
pg.field.blks_read.label: "Blocks read"
pg.field.blks_read.help: "Cumulative database blocks read from storage. Compare block hits, reads, and I/O time."
pg.field.tup_returned.label: "Rows returned"
pg.field.tup_returned.help: "Rows from sequential scans plus index entries returned by index scans. Compare the neighboring row counters."
pg.field.tup_fetched.label: "Rows fetched"
pg.field.tup_fetched.help: "Cumulative rows fetched by index scans. Compare the neighboring row counters."
pg.field.tup_inserted.label: "Rows inserted"
pg.field.tup_inserted.help: "Cumulative rows inserted in the database. Compare the neighboring row counters."
pg.field.tup_updated.label: "Rows updated"
pg.field.tup_updated.help: "Cumulative rows updated in the database. Compare the neighboring row counters."
pg.field.tup_deleted.label: "Rows deleted"
pg.field.tup_deleted.help: "Cumulative rows deleted from the database. Compare the neighboring row counters."
pg.field.deadlocks.label: "Deadlocks"
pg.field.deadlocks.help: "Cumulative deadlocks detected in the database. Inspect locks, transactions, and active backends at the same time."
pg.field.conflicts.label: "Recovery conflicts"
pg.field.conflicts.help: "Cumulative queries cancelled because of recovery conflicts. Inspect locks, transactions, and active backends at the same time."
pg.field.temp_files.label: "Temporary files"
pg.field.temp_files.help: "Cumulative temporary files created by queries in the database. Compare temporary files, bytes, and statement activity."
pg.field.temp_bytes.label: "Temporary bytes"
pg.field.temp_bytes.help: "Cumulative data written to temporary files by queries in the database. Compare temporary files, bytes, and statement activity."
pg.field.blk_read_time.label: "Block read time"
pg.field.blk_read_time.help: "Cumulative time spent reading database blocks when I/O timing is enabled. Compare read and write time with block hits and reads."
pg.field.blk_write_time.label: "Block write time"
pg.field.blk_write_time.help: "Cumulative time spent writing database blocks when I/O timing is enabled. Compare read and write time with block hits and reads."
pg.field.sessions.label: "Sessions"
pg.field.sessions.help: "Cumulative sessions established with the database. Compare it with sessions, transactions, and current backend activity."
pg.field.frozen_xid_age.label: "Frozen XID age"
pg.field.frozen_xid_age.help: "Age of the database frozen transaction ID, measured in transactions. Compare it with transactions and active backends."
