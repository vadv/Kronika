pg.help.relation.index_state_count: "Member indexes for which the named pg_index state is true at the cursor, in indexes."
pg.help.relation.tuple_throughput: "Sequentially read plus index-fetched row deltas / interval duration, in rows/s."
pg.help.relation.sequential_share: "Sequential-scan delta / total scan delta, in percent; rollups sum operands. Unavailable without scans."
pg.help.relation.dml_total: "Sum of reset-safe insert, update, and delete increases divided by interval duration, in rows/s."
pg.help.relation.hot_share: "HOT-update increase divided by all update increases in the interval, in percent. Unavailable with no updates."
pg.help.relation.new_page_share: "Other-page update delta / update delta, in percent; PostgreSQL 16+."
pg.help.relation.dead_share: "PostgreSQL's dead-row estimate divided by live plus dead estimates at the cursor, in percent; rollups use summed estimates."
pg.help.relation.displayed_storage: "Table main-fork bytes plus total TOAST relation bytes at the cursor. Ordinary indexes and other table forks are excluded."
pg.help.relation.table_data: "Size of the table's main fork from pg_relation_size at the cursor, in bytes."
pg.help.relation.index_data: "Size of the index's main fork from pg_relation_size at the cursor, in bytes."
pg.help.relation.toast_share: "TOAST bytes divided by table-main-fork plus TOAST bytes at the cursor, in percent."
pg.help.relation.reltuples: "pg_class.reltuples planner estimate at the cursor, in rows; -1 means no estimate is available."
pg.help.relation.toast_dead_share: "PostgreSQL's TOAST dead-row estimate divided by live plus dead TOAST estimates at the cursor, in percent."
pg.help.relation.xid_age: "Age of relfrozenxid at the cursor, in transactions; rollups show the maximum. Partitioned parents are unavailable."
pg.help.relation.mxid_age: "Age of relminmxid at the cursor, in multixacts; rollups show the maximum. Partitioned parents are unavailable."
pg.help.relation.no_scans: "Whether the exact index-scan increase is zero in the interval. An unavailable interval is not classified as zero."
