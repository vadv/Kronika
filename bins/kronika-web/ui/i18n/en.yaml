system.field.device.label: "Device"
system.field.device.help: "Kernel name of the block device. Inspect the other device counters and I/O PSI at the same time."
system.field.io_in_progress.label: "I/O in progress"
system.field.io_in_progress.help: "Number of I/O requests currently issued to the device. Inspect the other device counters and I/O PSI at the same time."
system.field.reads.label: "Reads"
system.field.reads.help: "Cumulative number of completed read requests. Inspect the other device counters and I/O PSI at the same time."
system.field.writes.label: "Writes"
system.field.writes.help: "Cumulative number of completed write requests. Inspect the other device counters and I/O PSI at the same time."
system.field.read_sectors.label: "Sectors read"
system.field.read_sectors.help: "Cumulative number of sectors read from the device. Inspect the other device counters and I/O PSI at the same time."
system.field.write_sectors.label: "Sectors written"
system.field.write_sectors.help: "Cumulative number of sectors written to the device. Inspect the other device counters and I/O PSI at the same time."
system.field.read_time_ms.label: "Read time"
system.field.read_time_ms.help: "Cumulative time spent completing read requests. Inspect the other device counters and I/O PSI at the same time."
system.field.write_time_ms.label: "Write time"
system.field.write_time_ms.help: "Cumulative time spent completing write requests. Inspect the other device counters and I/O PSI at the same time."
system.field.discards.label: "Discard operations"
system.field.discards.help: "Cumulative number of completed discard requests. Inspect the other device counters and I/O PSI at the same time."
system.field.flushes.label: "Flush operations"
system.field.flushes.help: "Cumulative number of completed flush requests. Inspect the other device counters and I/O PSI at the same time."
system.field.mount_point.label: "Mount point"
system.field.mount_point.help: "Path at which the filesystem is mounted. Compare it with the mount source, filesystem type, and free capacity."
system.field.fstype.label: "Filesystem"
system.field.fstype.help: "Filesystem type reported by the kernel. Compare it with the mount source, filesystem type, and free capacity."
system.field.source.label: "Source"
system.field.source.help: "Device or source backing the mount. Compare it with the mount source, filesystem type, and free capacity."
system.field.major.label: "Major ID"
system.field.major.help: "Major component of the Linux device identifier. Compare it with the mount source, filesystem type, and free capacity."
system.field.minor.label: "Minor ID"
system.field.minor.help: "Minor component of the Linux device identifier. Compare it with the mount source, filesystem type, and free capacity."
system.field.total_bytes.label: "Total bytes"
system.field.total_bytes.help: "Total filesystem capacity in bytes. Compare it with the mount source, filesystem type, and free capacity."
system.field.free_bytes.label: "Free bytes"
system.field.free_bytes.help: "Filesystem capacity available in bytes. Compare it with the mount source, filesystem type, and free capacity."
system.field.is_k8s_infra.label: "Kubernetes infrastructure"
system.field.is_k8s_infra.help: "Identifies a Kubernetes infrastructure mount. Compare it with the mount source, filesystem type, and free capacity."
system.field.iface.label: "Interface"
system.field.iface.help: "Kernel name of the network interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.rx_bytes.label: "Received bytes"
system.field.rx_bytes.help: "Cumulative bytes received by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.rx_packets.label: "Received packets"
system.field.rx_packets.help: "Cumulative packets received by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.rx_errs.label: "Receive errors"
system.field.rx_errs.help: "Cumulative receive errors reported by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.rx_drop.label: "Receive drops"
system.field.rx_drop.help: "Cumulative received packets dropped by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.tx_bytes.label: "Transmitted bytes"
system.field.tx_bytes.help: "Cumulative bytes transmitted by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.tx_packets.label: "Transmitted packets"
system.field.tx_packets.help: "Cumulative packets transmitted by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.tx_errs.label: "Transmit errors"
system.field.tx_errs.help: "Cumulative transmit errors reported by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.tx_drop.label: "Transmit drops"
system.field.tx_drop.help: "Cumulative outgoing packets dropped by the interface. Inspect receive, transmit, errors, drops, and link properties together."
system.field.speed_mbit.label: "Link speed"
system.field.speed_mbit.help: "Nominal interface link speed in megabits per second. Inspect receive, transmit, errors, drops, and link properties together."
system.field.duplex.label: "Duplex mode"
system.field.duplex.help: "Data-transfer mode of the network interface. Inspect it with link speed, traffic, errors, and drops."
system.field.cpu_id.label: "CPU ID"
system.field.cpu_id.help: "Identifier of the logical CPU. Compare it with the neighboring CPU, core, socket, and NUMA fields."
system.field.model_name.label: "CPU model"
system.field.model_name.help: "Processor model name reported by the kernel. Compare it with the neighboring CPU, core, socket, and NUMA fields."
system.field.mhz_max.label: "Maximum frequency"
system.field.mhz_max.help: "Maximum reported frequency of the logical CPU in megahertz. Compare it with the neighboring CPU, core, socket, and NUMA fields."
system.field.core_id.label: "Core ID"
system.field.core_id.help: "Identifier of the physical CPU core. Compare it with the neighboring CPU, core, socket, and NUMA fields."
system.field.socket_id.label: "Socket ID"
system.field.socket_id.help: "Identifier of the processor socket. Compare it with the neighboring CPU, core, socket, and NUMA fields."
system.field.numa_node.label: "NUMA node"
system.field.numa_node.help: "Identifier of the NUMA node containing the logical CPU. Compare it with the neighboring CPU, core, socket, and NUMA fields."
