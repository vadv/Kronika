table.processes: "Processes at cursor"
table.activate: "Select process {pid}"
table.empty: "No process data near the cursor"
table.no_rows: "No rows at the cursor"
col.pid.label: "PID"
col.pid.help: "Linux process ID. Use Started to distinguish a reused PID."
col.command.label: "Command"
col.command.help: "Full /proc/PID/cmdline; when it is empty, Kronika shows /proc/PID/comm. Inspect PID and Started with it."
col.state.label: "State"
col.state.help: "Linux process state such as R, S, D, or Z. Inspect CPU and I/O metrics for the selected process."
col.starttime.label: "Started"
col.starttime.help: "Process start time in UTC. Together with PID, it identifies one Linux process."
col.ppid.label: "PPID"
col.ppid.help: "Parent process ID. Inspect PID and Command to place the process in its parent relationship."
col.uid.label: "UID"
col.uid.help: "Real user ID. Compare it with EUID when checking which identity started the process."
col.euid.label: "EUID"
col.euid.help: "Effective user ID used for permission checks. Compare it with UID."
col.gid.label: "GID"
col.gid.help: "Real group ID. Compare it with EGID for the process identity."
col.egid.label: "EGID"
col.egid.help: "Effective group ID used for permission checks. Compare it with GID."
col.threads.label: "Threads"
col.threads.help: "Number of threads in the process. Inspect its one-hour history and CPU metrics."
col.tty.label: "TTY"
col.tty.help: "Controlling terminal ID reported for the process. Inspect Command and PPID for context."
col.nice.label: "Nice"
col.nice.help: "Linux nice value that influences normal scheduler priority. Inspect Priority and Policy beside it."
col.prio.label: "Priority"
col.prio.help: "Scheduler priority reported by Linux. Inspect Nice, RT priority, and Policy."
col.rtprio.label: "RT priority"
col.rtprio.help: "Real-time scheduler priority. Inspect Policy and Priority beside it."
col.policy.label: "Policy"
col.policy.help: "Numeric Linux scheduler policy. Inspect Priority, RT priority, and CPU use."
col.curcpu.label: "CPU"
col.curcpu.help: "Last or current logical CPU reported for the process. Inspect CPU topology and process CPU time."
col.utime.label: "User jiffies"
col.utime.help: "Cumulative CPU time in user mode, in scheduler jiffies. Inspect its one-hour slope with System jiffies."
col.stime.label: "System jiffies"
col.stime.help: "Cumulative CPU time in kernel mode, in scheduler jiffies. Inspect its one-hour slope with User jiffies."
col.rundelay.label: "Run delay"
col.rundelay.help: "Cumulative time waiting on the run queue, in nanoseconds. Inspect CPU PSI and runnable work."
col.blkdelay.label: "Block delay"
col.blkdelay.help: "Cumulative block-I/O delay, in scheduler ticks. Inspect read/write activity and I/O PSI."
col.nvcsw.label: "Voluntary CS"
col.nvcsw.help: "Cumulative voluntary context switches. Inspect waits, I/O, and the process state."
col.nivcsw.label: "Involuntary CS"
col.nivcsw.help: "Cumulative involuntary context switches. Inspect CPU pressure, run delay, and priority."
col.minflt.label: "Minor faults"
col.minflt.help: "Cumulative page faults resolved without storage I/O. Inspect resident memory and Major faults."
col.majflt.label: "Major faults"
col.majflt.help: "Cumulative page faults that required storage I/O. Inspect resident memory and process reads."
col.vmem.label: "Virtual memory"
col.vmem.help: "Virtual address-space size. Compare it with Resident memory and Swap."
col.rmem.label: "Resident memory"
col.rmem.help: "Physical memory currently resident for the process. Inspect its one-hour history, Virtual memory, and Swap."
col.vswap.label: "Swap"
col.vswap.help: "Swap used by the process. Inspect Resident memory, available memory, and memory PSI."
col.syscr.label: "Read calls"
col.syscr.help: "Cumulative read system calls. A dash means no value; zero is shown as 0."
col.syscw.label: "Write calls"
col.syscw.help: "Cumulative write system calls. A dash means no value; zero is shown as 0."
col.rchar.label: "Read chars"
col.rchar.help: "Cumulative characters passed through read calls, including page-cache hits. Inspect Read bytes beside it."
col.wchar.label: "Written chars"
col.wchar.help: "Cumulative characters passed through write calls, including page-cache writes. Inspect Written bytes beside it."
col.read_bytes.label: "Read bytes"
col.read_bytes.help: "Cumulative bytes fetched from the storage layer. Inspect Read calls and I/O PSI."
col.write_bytes.label: "Written bytes"
col.write_bytes.help: "Cumulative bytes sent to the storage layer. Inspect Write calls and I/O PSI."
col.cancelled_write.label: "Cancelled writes"
col.cancelled_write.help: "Cumulative write bytes cancelled before reaching storage. Inspect Written bytes and process state."
col.exit_signal.label: "Exit signal"
col.exit_signal.help: "Signal sent to the parent when the process exits. Inspect PPID and process state."
col.scope.label: "Scope"
col.scope.help: "Numeric OS collection scope for this process row. Inspect the process identity beside it."
detail.process.title: "Process identity"
detail.process.help: "PID and start time identify one Linux process. Inspect the command line and the active lens metrics."
detail.cmdline.label: "Command line"
detail.cmdline.help: "Exact /proc/PID/cmdline text; when empty, Kronika shows /proc/PID/comm."
detail.pg.title: "PostgreSQL activity"
detail.pg_pid: "PostgreSQL PID {pid}"
detail.pg.help: "PostgreSQL backend with the same PID at the nearest pg_stat_activity collection time. Inspect state, wait, query, and timestamps."
detail.pg_none: "No PostgreSQL backend with this PID at the nearest collection time"
