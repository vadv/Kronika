system.metric.swap_total.help: "Total configured swap space."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Cumulative number of processes killed by the out-of-memory killer since boot."
system.metric.cpu_pressure.label: "CPU PSI, 10s"
system.metric.cpu_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for CPU."
system.metric.memory_pressure.label: "Memory PSI, 10s"
system.metric.memory_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for memory."
system.metric.io_pressure.label: "I/O PSI, 10s"
system.metric.io_pressure.help: "Host-wide PSI share over the last ten seconds when at least one task waited for I/O; this is not device latency."
system.metric.filesystem_free_min.label: "Minimum filesystem free"
system.metric.filesystem_free_min.help: "Lowest free-space percentage among the collected local filesystems."
