system.metric.tasks.label: "Tasks"
system.metric.tasks.help: "Total number of tasks known to the kernel scheduler."
system.metric.mem_available.label: "MemAvailable"
system.metric.mem_available.help: "Kernel estimate of host memory available for new work without swapping; it overlaps reclaimable categories and is not added to them."
system.metric.mem_total.label: "MemTotal"
system.metric.mem_total.help: "Total usable host physical memory; this is not a container limit."
system.metric.mem_anon.label: "AnonPages"
system.metric.mem_anon.help: "Host memory used by anonymous pages, including application heaps and stacks."
system.metric.mem_file_cache.label: "Page cache"
system.metric.mem_file_cache.help: "Host file cache plus block-device buffers; this category does not include slab."
system.metric.mem_s_reclaimable.label: "Reclaimable slab"
system.metric.mem_s_reclaimable.help: "Host slab memory the kernel can reclaim."
system.metric.mem_s_unreclaim.label: "Unreclaimable slab"
system.metric.mem_s_unreclaim.help: "Host slab memory the kernel cannot currently reclaim."
system.metric.mem_free.label: "MemFree"
system.metric.mem_free.help: "Host physical memory that is completely unused."
system.metric.mem_other.label: "Other memory"
system.metric.mem_other.help: "Residual host memory after anonymous, file-cache-plus-buffers, slab, and free memory are subtracted from total."
system.metric.swap_free.label: "Free swap"
system.metric.swap_free.help: "Unused swap space."
