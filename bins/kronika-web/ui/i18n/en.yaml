system.field.device.label: "Device"
system.field.device_id.label: "Major:minor"
system.field.io_in_progress.label: "I/O in progress"
system.field.io_in_progress.help: "I/O requests currently issued to the device at the cursor, in requests."
system.field.reads.label: "Reads"
system.field.reads.help: "How many read requests the device completes per second. Together with read throughput it shows the workload shape: many operations moving few bytes mean small scattered reads."
system.field.writes.label: "Writes"
system.field.writes.help: "How many write requests the device completes per second. Together with write throughput it shows the workload shape: many operations moving few bytes point to small synchronous writes."
system.field.read_bytes.label: "Read rate"
system.field.read_bytes.help: "Bytes per second physically read from the device; requests served by the in-memory cache never get here. Sustained values near the drive's limit mean reading has become the bottleneck."
system.field.write_bytes.label: "Write rate"
system.field.write_bytes.help: "Bytes per second physically written to the device. The kernel batches writes in memory and flushes them later, so peaks may lag behind the programs that produced them."
system.field.read_latency_ms.label: "Read latency"
system.field.read_latency_ms.help: "How many milliseconds one read takes on average, including time queued at the device. Growth under unchanged load points to an overloaded or degrading drive; unavailable when no read completed."
system.field.write_latency_ms.label: "Write latency"
system.field.write_latency_ms.help: "How many milliseconds one write takes on average, including time queued at the device. Growth means the device is falling behind the write stream; unavailable when no write completed."
system.field.device_busy.label: "Device busy"
system.field.device_busy.help: "Share of interval time with I/O in progress on this host device; this is not operation latency."
system.field.average_queue.label: "Avg queue"
system.field.average_queue.help: "How many requests were on average in flight or waiting for this device at once. A persistently long queue means the drive cannot keep up and every operation waits longer."
system.field.cgroup_path.label: "Cgroup"
system.field.cgroup_used_cores.label: "CPU used, cores"
system.field.cgroup_used_cores.help: "Processor time received by the control group the collector runs in, in core equivalents: 1 means one fully busy core. A value pressing against the quota means the kernel will start throttling the group."
system.field.cgroup_user_cores.label: "User CPU, cores"
system.field.cgroup_user_cores.help: "The share of the collector group's processor time spent in the programs' own code, in core equivalents. Usually the dominant part: computation and data processing."
system.field.cgroup_system_cores.label: "System CPU, cores"
system.field.cgroup_system_cores.help: "The share of the collector group's processor time spent inside the Linux kernel — system calls and I/O housekeeping. A large kernel share next to a modest user share means time goes to kernel requests rather than useful work."
system.field.cgroup_other_cores.label: "Other CPU, cores"
system.field.cgroup_other_cores.help: "Processor time of the collector group left after the program-code and kernel parts. Usually near zero; a visible amount is an accounting quirk of this kernel version."
system.field.cgroup_capacity.label: "CPU available, cores"
system.field.cgroup_capacity.help: "Tightest finite CPU quota across the collector's exact cgroup hierarchy, capped by its effective cpuset. An unknown hierarchy, or an unlimited hierarchy without a finite cpuset, is shown as an em dash."
system.field.cgroup_quota.label: "CPU quota, cores"
system.field.cgroup_quota.help: "The processor-time cap written directly on the group the collector belongs to, in core equivalents. It is the leaf's own setting — the effective limit can be stricter because of parent groups; unlimited or unavailable is shown as an em dash."
system.field.cpuset_cpus.label: "Effective cpuset"
system.field.cpuset_cpus.help: "Logical CPUs in the collector cgroup's effective cpuset."
system.field.current.label: "Memory used"
system.field.current.help: "Current memory charged to the collector cgroup, in bytes."
system.field.effective_memory_max.label: "Effective memory limit"
system.field.effective_memory_max.help: "Tightest finite memory limit across the collector's exact cgroup hierarchy, in bytes; an unlimited or unreadable hierarchy is shown as an em dash."
system.field.max.label: "Local memory limit"
system.field.max.help: "Finite memory limit stored on the collector's exact membership cgroup. This leaf setting is factual and can be higher than an effective ancestor limit; unlimited or unavailable is shown as an em dash."
system.field.anon.label: "AnonPages"
system.field.anon.help: "Anonymous memory charged to the collector cgroup, in bytes."
system.field.file.label: "File memory"
system.field.file.help: "File-backed memory charged to the collector cgroup, in bytes."
system.field.slab.label: "Slab"
system.field.slab.help: "Slab memory inside the collector cgroup's kernel-memory total, in bytes."
system.field.kernel_other.label: "Other kernel memory"
system.field.kernel_other.help: "Collector cgroup kernel memory minus slab, in bytes."
system.field.memory_unclassified.label: "Unclassified memory"
system.field.memory_unclassified.help: "Collector cgroup current memory minus anonymous, file, and kernel memory, in bytes."
system.field.rbytes.label: "Read rate"
system.field.rbytes.help: "Bytes per second the collector's group read from this device. Only physical I/O counts: reads served by the in-memory cache never get here."
system.field.wbytes.label: "Write rate"
system.field.wbytes.help: "Bytes per second the collector's group wrote to this device. Writes deferred by the kernel reach the device after the program did its work, so peaks can lag."
system.field.rios.label: "Read ops"
system.field.rios.help: "How many reads from this device the collector's group performs per second. Compared with read throughput it gives the average operation size: a stream of small reads strains the device more than the same volume in large ones."
system.field.wios.label: "Write ops"
system.field.wios.help: "How many writes to this device the collector's group performs per second. Together with write throughput it shows the average operation size: many small writes are the hardest load on a drive."
system.field.mount_point.label: "Mount point"
system.field.fstype.label: "Filesystem"
system.field.source.label: "Source"
system.field.total_bytes.label: "Total bytes"
system.field.total_bytes.help: "Total filesystem capacity at the cursor, in bytes."
system.field.free_bytes.label: "Free bytes"
system.field.free_bytes.help: "Filesystem capacity available to unprivileged writers at the cursor, in bytes."
system.field.is_k8s_infra.label: "Kubernetes infra mount"
system.field.is_k8s_infra.help: "Whether the mount is classified as Kubernetes infrastructure at the cursor."
system.field.iface.label: "Interface"
system.field.rx_bytes.label: "RX bytes"
system.field.rx_bytes.help: "Incoming traffic through the interface, in bytes per second. Values pinned at the link speed mean the network path has become the bottleneck."
system.field.rx_packets.label: "RX packets"
system.field.rx_packets.help: "How many packets per second arrive on the interface. A dense stream of small packets loads the processor with per-packet handling even when the byte volume is modest."
system.field.rx_errs.label: "RX errors"
system.field.rx_errs.help: "Packets that arrived damaged — usually a cable, interference, or mismatched link settings. A healthy network has none; a sustained stream points to trouble on the physical path."
system.field.rx_drop.label: "RX drops"
system.field.rx_drop.help: "Incoming packets the kernel discarded without processing — usually overflowing buffers. Sustained drops mean the system cannot keep up with the incoming stream and data gets retransmitted."
system.field.tx_bytes.label: "TX bytes"
system.field.tx_bytes.help: "Outgoing traffic through the interface, in bytes per second. Values pinned at the link speed mean sending is limited by the network path."
system.field.tx_packets.label: "TX packets"
system.field.tx_packets.help: "How many packets per second the interface sends. A dense stream of small packets is real processor work regardless of the byte volume."
system.field.tx_errs.label: "TX errors"
system.field.tx_errs.help: "Failures while sending packets, on the interface or driver side. A healthy network has none; their appearance points to hardware or driver trouble."
system.field.tx_drop.label: "TX drops"
system.field.tx_drop.help: "Outgoing packets discarded before they were sent — usually an overflowing interface queue. They appear when the stream exceeds what the link can take; connections respond with retransmissions and delays."
system.field.speed_mbit.label: "Link speed"
system.field.speed_mbit.help: "Nominal interface link speed at the cursor, in Mbit/s."
system.field.duplex.label: "Duplex"
system.field.duplex.help: "Interface duplex mode reported at the cursor."
system.field.cpu_id.label: "CPU ID"
system.field.model_name.label: "CPU model"
system.field.mhz_max.label: "Max frequency"
system.field.mhz_max.help: "Maximum frequency reported for the logical CPU at the cursor, in MHz."
system.field.core_id.label: "Core ID"
system.field.core_id.help: "Physical-core identifier at the cursor; -1 means unavailable."
system.field.socket_id.label: "Socket ID"
system.field.socket_id.help: "Processor-socket identifier at the cursor; -1 means unavailable."
system.field.numa_node.label: "NUMA node"
system.field.numa_node.help: "NUMA-node identifier for the logical CPU at the cursor; -1 means unavailable."
