lane.health.label: "Health"
lane.health.help: "Kronika OS health over the selected hour. Intervals without points stay blank."
lane.load.label: "Load"
lane.load.help: "One-minute load average over the selected hour. Its vertical scale follows this hour's values."
lane.memory.label: "Memory"
lane.memory.help: "Available memory over the selected hour. Its vertical scale follows this hour's values."
lane.pressure.label: "PSI"
lane.pressure.help: "Ten-second CPU, memory, and I/O pressure over the selected hour. Inspect the matching resource metrics at the cursor."
