col.pid.label: "PID"
col.pid.help: "Linux process identifier; start time reveals PID reuse. Compare it with start time, command, and parent PID."
col.command.label: "Command"
col.command.help: "Full process command line, including arguments. Compare it with PID, start time, and the parent process."
col.state.label: "State"
col.state.help: "Linux process state, such as R, S, D, or Z. Inspect the process identity, command, state, and active lens values."
col.starttime.label: "Started"
col.starttime.help: "Process start time in UTC; with PID, it identifies one process lifetime. Compare it with command and parent PID."
col.ppid.label: "PPID"
col.ppid.help: "Process ID of the parent process. Inspect PID, start time, command, and parent PID together."
col.uid.label: "UID"
col.uid.help: "Real user ID of the process. Compare the real and effective user and group IDs."
col.euid.label: "EUID"
col.euid.help: "Effective user ID used for permission checks. Compare the real and effective user and group IDs."
col.gid.label: "GID"
col.gid.help: "Real group ID of the process. Compare the real and effective user and group IDs."
col.egid.label: "EGID"
col.egid.help: "Effective group ID used for permission checks. Compare the real and effective user and group IDs."
col.threads.label: "Threads"
col.threads.help: "Number of threads in the process. Inspect the process identity, command, state, and active lens values."
col.tty.label: "TTY"
col.tty.help: "ID of the process's controlling terminal. Inspect the process identity, command, state, and active lens values."
col.nice.label: "Nice"
col.nice.help: "Linux nice value used to adjust normal scheduler priority. Compare it with process state, CPU time, run delay, and scheduler fields."
col.prio.label: "Priority"
col.prio.help: "Current scheduler priority assigned by Linux. Compare it with process state, CPU time, run delay, and scheduler fields."
col.rtprio.label: "RT priority"
col.rtprio.help: "Real-time scheduler priority. Compare it with process state, CPU time, run delay, and scheduler fields."
col.policy.label: "Policy"
col.policy.help: "Numeric identifier of the Linux scheduler policy. Compare it with process state, CPU time, run delay, and scheduler fields."
col.curcpu.label: "CPU"
col.curcpu.help: "Logical CPU on which the process last ran or is currently running. Compare it with process state, CPU time, run delay, and scheduler fields."
col.utime.label: "User CPU time"
col.utime.help: "Cumulative CPU time spent in user mode, measured in clock ticks. Compare it with process state, CPU time, run delay, and scheduler fields."
col.stime.label: "System CPU time"
col.stime.help: "Cumulative CPU time spent in kernel mode, measured in clock ticks. Compare it with process state, CPU time, run delay, and scheduler fields."
col.rundelay.label: "Run delay"
col.rundelay.help: "Cumulative time spent waiting on the run queue, in nanoseconds. Compare it with process state, CPU time, run delay, and scheduler fields."
col.blkdelay.label: "Block delay"
col.blkdelay.help: "Cumulative block-I/O delay, measured in clock ticks. Compare it with process state, CPU time, run delay, and scheduler fields."
col.nvcsw.label: "Voluntary switches"
col.nvcsw.help: "Cumulative context switches made when the process yielded the CPU voluntarily. Compare it with process state, CPU time, run delay, and scheduler fields."
col.nivcsw.label: "Involuntary switches"
col.nivcsw.help: "Cumulative context switches made when the scheduler preempted the process. Compare it with process state, CPU time, run delay, and scheduler fields."
col.minflt.label: "Minor faults"
col.minflt.help: "Cumulative page faults resolved without storage I/O. Compare it with resident memory, virtual memory, swap, and page faults."
col.majflt.label: "Major faults"
col.majflt.help: "Cumulative page faults that required storage I/O. Compare it with resident memory, virtual memory, swap, and page faults."
col.vmem.label: "Virtual memory"
col.vmem.help: "Size of the process's virtual address space. Compare it with resident memory, virtual memory, swap, and page faults."
col.rmem.label: "Resident memory"
col.rmem.help: "Physical memory currently resident for the process. Compare it with resident memory, virtual memory, swap, and page faults."
col.vswap.label: "Swap"
col.vswap.help: "Swap space used by the process. Compare it with resident memory, virtual memory, swap, and page faults."
col.syscr.label: "Read calls"
col.syscr.help: "Cumulative number of read system calls. Compare it with the neighboring read, write, and I/O-delay counters."
col.syscw.label: "Write calls"
col.syscw.help: "Cumulative number of write system calls. Compare it with the neighboring read, write, and I/O-delay counters."
col.rchar.label: "Read incl. cache"
col.rchar.help: "Cumulative bytes passed through read calls, including page-cache hits. Compare it with the neighboring read, write, and I/O-delay counters."
col.wchar.label: "Written incl. cache"
col.wchar.help: "Cumulative bytes passed through write calls, including page-cache writes. Compare it with the neighboring read, write, and I/O-delay counters."
col.read_bytes.label: "Read from storage"
col.read_bytes.help: "Cumulative bytes the process caused the kernel to fetch from storage. Compare it with the neighboring read, write, and I/O-delay counters."
col.write_bytes.label: "Written to storage"
col.write_bytes.help: "Cumulative bytes the process caused the kernel to send to storage. Compare it with the neighboring read, write, and I/O-delay counters."
col.cancelled_write.label: "Cancelled writes"
col.cancelled_write.help: "Cumulative bytes whose pending writes were cancelled, for example by truncation. Compare it with the neighboring read, write, and I/O-delay counters."
col.exit_signal.label: "Exit signal"
col.exit_signal.help: "Signal sent to the parent when the process exits. Inspect the process identity, command, state, and active lens values."
detail.process.title: "Process identity"
detail.process.help: "PID and start time identify one Linux process. Inspect the command line and the active lens values."
detail.cmdline.label: "Command line"
detail.cmdline.help: "Full process command line, including arguments. Inspect it with PID, start time, and parent PID."
detail.pg.title: "PostgreSQL activity"
detail.pg_pid: "PostgreSQL PID {pid}"
detail.pg.help: "PostgreSQL backend with the same PID in the activity sample nearest the cursor. Inspect its state, wait event, query, and timestamps."
detail.pg_snapshot.label: "Activity sampled"
detail.pg_snapshot.help: "Time of the activity sample used to match the PID. Compare it with the cursor and the Linux process start time."
