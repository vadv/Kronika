process.summary.title: "Process totals"
process.summary.loading: "Loading process totals…"
process.summary.error: "Could not load process totals"
process.summary.processes: "Processes"
process.summary.processes.help: "Number of Linux processes in the complete snapshot at the selected sample."
process.summary.threads: "Threads"
process.summary.threads.help: "Total Linux threads reported by all processes in the complete snapshot."
process.summary.running: "Runnable"
process.summary.running.help: "Processes in the runnable state in the complete snapshot."
process.summary.postgresql: "PostgreSQL backends"
process.summary.postgresql.help: "Process PIDs also present in PostgreSQL Activity at the selected sample."
process.summary.user_time: "User CPU, cores"
process.summary.user_time.help: "How much processor time all processes together spent in their own program code, in core equivalents. A value near the number of available cores means the processors have nothing left to give."
process.summary.system_time: "System CPU, cores"
process.summary.system_time.help: "How much processor time all processes together spent inside the Linux kernel — system calls and I/O housekeeping. A large share next to user time means the machine works on kernel requests rather than the programs themselves."
process.summary.run_delay: "Run queue wait"
process.summary.run_delay.help: "Total time runnable processes spent queued for a free processor, per second. Growth means the cores are oversubscribed: tasks are ready to run but get no time."
process.summary.context_switches: "Context switches"
process.summary.context_switches.help: "How often processes hand the processor to one another, in total per second. A very high rate means too many active threads or lots of tiny exchanges; the switching itself costs processor time too."
process.summary.resident: "RSS"
process.summary.resident.help: "Physical memory summed across every process in the snapshot — how much RAM running programs hold."
process.summary.virtual: "VSZ"
process.summary.virtual.help: "Reserved address space summed across every process; a reference figure that normally dwarfs resident memory."
process.summary.swap: "Swap"
process.summary.swap.help: "Swap space used by all processes in the complete snapshot."
process.summary.major_faults: "Major faults"
process.summary.major_faults.help: "Memory accesses that forced a read from disk, summed over all processes per second. A steady stream is a sign of memory shortage: the system evicts pages and immediately reads them back."
process.summary.read: "Read from storage"
process.summary.read.help: "Bytes all processes together physically read from storage per second. Reads served by the in-memory cache are not counted."
process.summary.written: "Written to storage"
process.summary.written.help: "Bytes all processes together sent to storage per second. Peaks can lag behind the programs: the kernel batches writes in memory and flushes them later."
process.summary.read_calls: "Read syscalls"
process.summary.read_calls.help: "Read requests summed across every process in the snapshot — the overall rate of asking the kernel for data."
process.summary.write_calls: "Write syscalls"
process.summary.write_calls.help: "Write requests summed across every process in the snapshot — the overall rate of asking the kernel to store data."
system.metric.health.label: "OS health"
system.metric.health.help: "OS Health = 100 × (1 − max(CPU PSI some, memory PSI some, I/O PSI some)). Each resource share is the delta of the total stall-time counter on its PSI some line divided by elapsed wall time between adjacent snapshots. Lower Health means tasks spent more time waiting for the worst resource."
system.metric.cpu_busy.label: "CPU usage"
system.metric.cpu_busy.help: "Share of the host's whole CPU capacity that was busy between snapshots; idle and I/O wait are not busy."
system.metric.cpu_used_cores.label: "CPU used, cores"
system.metric.cpu_used_cores.help: "Average host CPU use between snapshots, in core equivalents; idle and I/O wait are excluded."
system.metric.cpu_capacity.label: "CPU cores"
system.metric.cpu_capacity.help: "Online host logical CPUs recorded at the cursor; this is not a container quota."
system.metric.cpu_actual_frequency.label: "Actual frequency"
system.metric.cpu_actual_frequency.help: "Online-CPU-weighted hardware frequency across CPUFreq policies. The chart keeps one series per policy and stays unavailable when the kernel exposes no hardware-derived frequency."
system.metric.cpu_scaling_frequency.label: "Scaling frequency"
system.metric.cpu_scaling_frequency.help: "Online-CPU-weighted CPUFreq scaling_cur_freq across policies: a separately named reported or requested operating point, not hardware-measured actual frequency."
system.metric.cpu_user.label: "User CPU"
system.metric.cpu_user.help: "Share of host CPU time in user and nice modes between snapshots."
system.metric.cpu_system.label: "System CPU"
system.metric.cpu_system.help: "Share of host CPU time in kernel system mode between snapshots."
system.metric.cpu_irq.label: "IRQ"
system.metric.cpu_irq.help: "Share of host CPU time handling hardware and software interrupts between snapshots."
system.metric.cpu_iowait.label: "I/O wait"
system.metric.cpu_iowait.help: "Share of host CPU time reported as I/O wait; it is shown separately and is not counted as CPU work."
system.metric.cpu_steal.label: "Steal"
system.metric.cpu_steal.help: "Share of host CPU time taken by the hypervisor between snapshots."
system.metric.cpu_idle.label: "Idle"
system.metric.cpu_idle.help: "Share of host CPU time reported idle between snapshots."
system.metric.procs_running.label: "Procs running"
system.metric.procs_running.help: "Number of processes ready to run."
system.metric.procs_blocked.label: "Procs blocked"
system.metric.procs_blocked.help: "Number of processes blocked while waiting for I/O."
system.metric.context_switches.label: "Context switches"
system.metric.context_switches.help: "Cumulative number of context switches since boot."
system.metric.load1.label: "Load 1m"
system.metric.load1.help: "One-minute average of runnable and uninterruptible tasks."
system.metric.load5.label: "Load 5m"
system.metric.load5.help: "Five-minute average of runnable and uninterruptible tasks."
system.metric.load15.label: "Load 15m"
system.metric.load15.help: "Fifteen-minute average of runnable and uninterruptible tasks."
system.metric.runnable.label: "Runnable tasks"
system.metric.runnable.help: "Number of tasks currently ready to run."
system.metric.tasks.label: "Tasks"
system.metric.tasks.help: "Total number of tasks known to the kernel scheduler."
system.metric.mem_available.label: "MemAvailable"
system.metric.mem_available.help: "Kernel estimate of host memory available for new work without swapping; it overlaps reclaimable categories and is not added to them."
system.metric.mem_total.label: "MemTotal"
system.metric.mem_total.help: "Total usable host physical memory; this is not a container limit."
system.metric.mem_anon.label: "AnonPages"
system.metric.mem_anon.help: "Host memory used by anonymous pages, including application heaps and stacks."
system.metric.mem_file_cache.label: "Page cache"
system.metric.mem_file_cache.help: "Host file cache plus block-device buffers; this category does not include slab."
system.metric.mem_s_reclaimable.label: "Reclaimable slab"
system.metric.mem_s_reclaimable.help: "Host slab memory the kernel can reclaim."
system.metric.mem_s_unreclaim.label: "Unreclaimable slab"
system.metric.mem_s_unreclaim.help: "Host slab memory the kernel cannot currently reclaim."
system.metric.mem_free.label: "MemFree"
system.metric.mem_free.help: "Host physical memory that is completely unused."
system.metric.mem_other.label: "Other memory"
system.metric.mem_other.help: "Residual host memory after anonymous, file-cache-plus-buffers, slab, and free memory are subtracted from total."
system.metric.swap_free.label: "Free swap"
system.metric.swap_free.help: "Unused swap space."
system.metric.swap_total.label: "Total swap"
system.metric.swap_total.help: "Total configured swap space."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Cumulative number of processes killed by the out-of-memory killer since boot."
system.metric.cpu_pressure.label: "CPU PSI, 10s"
system.metric.cpu_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for CPU."
system.metric.memory_pressure.label: "Memory PSI, 10s"
system.metric.memory_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for memory."
system.metric.io_pressure.label: "I/O PSI, 10s"
system.metric.io_pressure.help: "Host-wide PSI share over the last ten seconds when at least one task waited for I/O; this is not device latency."
system.metric.device_busy.label: "Device busy"
system.metric.device_busy.help: "Highest busy share among block devices: how much of the time the busiest disk spent serving requests. A high value means that device is the bottleneck."
system.metric.device_average_queue.label: "Queue depth"
system.metric.device_average_queue.help: "Longest request queue among block devices. A queue that stays above one means requests wait before the device serves them."
system.metric.filesystem_free_min.label: "Minimum filesystem free"
system.metric.filesystem_free_min.help: "Lowest free-space percentage among the collected local filesystems."
system.metric.device_count.label: "Block devices"
system.metric.device_count.help: "Block devices present at the selected time."
system.metric.device_active_io.label: "Active I/O"
system.metric.device_active_io.help: "I/O requests currently active across block devices."
system.metric.filesystem_count.label: "Filesystems"
system.metric.filesystem_count.help: "Mounted filesystems present at the selected time."
system.metric.interface_count.label: "Interfaces"
system.metric.interface_count.help: "Network interfaces present at the selected time."
system.metric.network_rx.label: "RX"
system.metric.network_rx.help: "Bytes received across network interfaces."
system.metric.network_tx.label: "TX"
system.metric.network_tx.help: "Bytes transmitted across network interfaces."
system.metric.network_errors.label: "Net errors"
system.metric.network_errors.help: "Receive and transmit errors across network interfaces."
system.metric.network_drops.label: "Drops"
system.metric.network_drops.help: "Received and transmitted packets dropped across interfaces."
