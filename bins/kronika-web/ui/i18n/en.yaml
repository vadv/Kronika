pg.datname.help: "Database associated with this backend at the cursor."
pg.usename.label: "Role"
pg.usename.help: "PostgreSQL role associated with this backend at the cursor."
pg.application_name.label: "Application"
pg.application_name.help: "Application name supplied by the connected client at the cursor."
pg.client_addr.label: "Client address"
pg.client_addr.help: "Client IP address at the cursor; local connections have no address."
pg.backend_type.label: "Backend type"
pg.backend_type.help: "PostgreSQL process type at the cursor, such as client backend or autovacuum worker."
pg.activity.system: "System"
pg.activity.idle: "Idle"
pg.state.label: "State"
pg.state.help: "PostgreSQL backend state at the cursor."
pg.wait_event_type.label: "Wait event type"
pg.wait_event_type.help: "Class of the wait event active at the cursor; null means no wait event was reported."
pg.wait_event.label: "Wait event"
pg.wait_event.help: "Wait event active at the cursor; null means the backend was not reporting a wait."
pg.query.label: "Query"
pg.query.help: "Current query for an active backend at the cursor, or its most recent query when inactive."
pg.query_id.label: "Query ID"
pg.query_id.help: "PostgreSQL query identifier at the cursor when query ID calculation is enabled; otherwise unavailable."
pg.vacuum.pid.label: "PID"
pg.vacuum.datname.label: "Database"
pg.vacuum.datname.help: "Database containing the table being vacuumed at the cursor."
pg.vacuum.is_autovacuum.label: "Autovacuum"
pg.vacuum.is_autovacuum.help: "Whether the work is running in an autovacuum worker at the cursor."
pg.vacuum.heap_blks_scanned.label: "Heap blocks scanned"
pg.vacuum.heap_blks_scanned.help: "Heap blocks scanned so far by this VACUUM at the cursor, in blocks."
pg.vacuum.heap_blks_total.label: "Heap blocks total"
pg.vacuum.heap_blks_total.help: "Heap blocks in the table when this VACUUM began scanning, in blocks."
pg.vacuum.heap_blks_vacuumed.label: "Heap blocks vacuumed"
pg.vacuum.heap_blks_vacuumed.help: "Heap blocks vacuumed so far by this VACUUM at the cursor, in blocks."
pg.vacuum.index_vacuum_count.label: "Index vacuum cycles"
pg.vacuum.index_vacuum_count.help: "Completed index-vacuum cycles for this VACUUM at the cursor, in cycles."
pg.vacuum.indexes_processed.label: "Indexes processed"
pg.vacuum.indexes_processed.help: "Indexes processed in the current cycle at the cursor, in indexes; available on PostgreSQL 17 or later."
pg.vacuum.indexes_total.label: "Indexes total"
pg.vacuum.indexes_total.help: "Indexes to process in the current cycle at the cursor, in indexes; available on PostgreSQL 17 or later."
pg.vacuum.num_dead_tuples.label: "Dead tuples collected"
pg.vacuum.num_dead_tuples.help: "Dead tuples collected in the current cycle at the cursor, in tuples; used by PostgreSQL 10 through 16 layouts."
pg.vacuum.max_dead_tuples.label: "Dead tuple capacity"
pg.vacuum.max_dead_tuples.help: "Dead-tuple capacity of the current cycle at the cursor, in tuples; used by PostgreSQL 10 through 16 layouts."
pg.vacuum.num_dead_item_ids.label: "Dead item IDs"
pg.vacuum.num_dead_item_ids.help: "Dead item identifiers collected in the current cycle at the cursor, in items; available on PostgreSQL 17 or later."
pg.vacuum.dead_tuple_bytes.label: "Dead item memory"
pg.vacuum.dead_tuple_bytes.help: "Memory used by the dead-item identifier store at the cursor, in bytes; available on PostgreSQL 17 or later."
pg.vacuum.max_dead_tuple_bytes.label: "Dead item memory capacity"
pg.vacuum.max_dead_tuple_bytes.help: "Capacity of the dead-item identifier store at the cursor, in bytes; available on PostgreSQL 17 or later."
pg.vacuum.delay_time.label: "Cost delay"
pg.vacuum.delay_time.help: "Time this VACUUM has spent sleeping at cost-based delay points, in milliseconds; available on PostgreSQL 18 or later."
pg.vacuum.phase.label: "Phase"
pg.vacuum.phase.help: "Current VACUUM phase reported at the cursor."
pg.backend_xid_age.label: "XID age"
pg.backend_xid_age.help: "Age of the backend's current transaction ID at the cursor, in transactions; unavailable without a current transaction ID."
pg.backend_xmin_age.label: "xmin age"
pg.backend_xmin_age.help: "Age of the backend xmin horizon at the cursor, in transactions; unavailable without an xmin horizon."
pg.backend_start.label: "Backend started"
pg.backend_start.help: "Time when the PostgreSQL backend started."
pg.xact_start.label: "Xact started"
pg.xact_start.help: "Start time of the backend's current transaction; unavailable outside a transaction."
pg.query_start.label: "Query started"
pg.query_start.help: "Start time of the current query, or of the most recent query when the backend is inactive."
pg.state_change.label: "State changed"
pg.state_change.help: "Time of the latest backend state change."
pg.field.queryid.label: "Query ID"
pg.field.queryid.help: "Query identifier stored with this physical statement or plan entry; vadv uses the extension's own identifier."
pg.field.planid.label: "Plan ID"
pg.field.planid.help: "Plan identifier assigned to this physical entry by pg_store_plans on the PostgreSQL server."
pg.field.toplevel.label: "Top level"
pg.field.toplevel.help: "Whether this physical statement entry represents top-level execution rather than execution inside another statement."
pg.field.datname.label: "Database"
pg.field.statement_database.help: "Database associated with this physical statement entry."
pg.field.plan_database.help: "Database associated with this physical plan entry."
pg.field.usename.label: "Role"
pg.field.usename.help: "PostgreSQL role associated with this physical statement or plan entry."
pg.field.query.label: "Query"
pg.field.query.help: "Statement text recorded for this physical pg_stat_statements entry."
pg.field.plan.label: "Plan"
pg.field.plan.help: "Plan text recorded for this physical pg_store_plans entry."
pg.field.calls.label: "Calls"
pg.field.calls.help: "Executions accumulated for the statement or plan; the table shows the exact interval rate."
pg.field.calls_per_second.label: "Calls/s"
pg.field.calls_per_second.help: "How many times per second this statement ran. Together with the mean time it shows where the load comes from: call frequency or the weight of each call."
pg.field.execution_ms_per_second.label: "Exec time, ms/s"
pg.field.execution_ms_per_second.help: "Accumulated execution milliseconds in the interval per wall-clock second. The value may exceed 1000 ms/s because executions overlap."
pg.field.mean_exec_ms_per_call.label: "Mean, ms/call"
pg.field.mean_exec_ms_per_call.help: "How many milliseconds one execution took on average in this interval; unavailable without calls. Growth at an unchanged rate means the statement got heavier: a different plan, more data, or new contention."
pg.table.cursor: "Cursor: {time}"
pg.table.interval: "Calculation interval: {from} → {to}"
pg.table.interval_unavailable: "Calculation interval: unavailable"
pg.table.filter: "Filter: {pattern}"
pg.table.no_filter: "Filter: none"
pg.table.order: "Server sort: {semantic} ({physical}), {direction}"
pg.table.order_default: "Server sort: not set"
pg.table.desc: "descending"
pg.table.asc: "ascending"
pg.table.shown: "Loaded {returned} of {eligible}"
pg.table.focus_loading: "Exact focused result; the filtered page is loading"
pg.table.focus_outside: "Exact focused result outside the current page"
pg.table.focus_exact: "Exact focused result"
pg.field.rows_per_call.label: "Rows/call"
pg.field.rows_per_call.help: "How many rows one execution returns or affects on average; unavailable without calls. A jump means the statement started moving more data than before — the conditions or the data changed."
pg.field.blocks_per_call.label: "Blocks/call"
pg.field.blocks_per_call.help: "How many data pages one execution touches on average — buffer hits and outside reads combined; unavailable without calls. Growth with an unchanged result means the plan started sifting through more data."
pg.field.hit_pct.label: "Cache hit ratio"
pg.field.hit_pct.help: "The share of page requests answered from PostgreSQL buffers. The rest was read from outside — not necessarily the disk, often the operating system's cache."
pg.field.wal_per_call.label: "WAL/call"
pg.field.wal_per_call.help: "How many write-ahead log bytes one execution produces; unavailable without calls. Large values mean bulky data changes — read-only statements barely grow the log."
pg.field.plan_time_pct.label: "Plan time, %"
pg.field.plan_time_pct.help: "How much of the statement's total time went into building the plan rather than running it. A high share on fast frequent statements argues for prepared statements, so the plan is not rebuilt every time."
pg.field.cv.label: "CV"
pg.field.cv.help: "How much execution time wanders around its mean: zero means identical runs, near one and above means spread comparable to the mean; unavailable when the mean is zero. A wide spread means the statement behaves differently run to run: parameters, plans, or contention."
pg.field.min_exec_time_ms.label: "Min, ms"
pg.field.min_exec_time_ms.help: "Shortest execution recorded in the statistics period, in milliseconds."
pg.field.max_exec_time_ms.label: "Max, ms"
pg.field.max_exec_time_ms.help: "Longest execution recorded in the statistics period, in milliseconds."
pg.field.mean_exec_time_ms.label: "Mean, ms"
pg.field.mean_exec_time_ms.help: "Mean execution time recorded in the statistics period, in milliseconds."
pg.field.stddev_exec_time_ms.label: "Stddev, ms"
pg.field.stddev_exec_time_ms.help: "Execution-time standard deviation recorded in the statistics period, in milliseconds."
pg.field.first_call.label: "First call"
pg.field.first_call.help: "Time of the first call recorded for this plan by the extension."
pg.field.last_call.label: "Last call"
pg.field.last_call.help: "Time of the last call recorded for this plan by the extension."
pg.field.rows_per_second.label: "Rows/s"
pg.field.rows_per_second.help: "How many rows per second the statement returns or affects — which of the two depends on what it does. Shows the statement's weight in the overall data flow."
pg.field.planning_ms_per_second.label: "Planning, ms/s"
pg.field.planning_ms_per_second.help: "How many milliseconds each second go into building this statement's plans. Visible values at a high call rate argue for prepared statements."
pg.field.shared_blk_read_ms_per_second.label: "Shared read, ms/s"
pg.field.shared_blk_read_ms_per_second.help: "Shared-block read milliseconds per elapsed second, or aggregate block reads where that layout only exposes one timing."
pg.field.shared_blk_write_ms_per_second.label: "Shared write, ms/s"
pg.field.shared_blk_write_ms_per_second.help: "Shared-block write milliseconds per elapsed second, or aggregate block writes where that layout only exposes one timing."
pg.field.local_blk_read_ms_per_second.label: "Local read, ms/s"
pg.field.local_blk_read_ms_per_second.help: "Local-block read milliseconds per elapsed second when the physical layout exposes them."
pg.field.local_blk_write_ms_per_second.label: "Local write, ms/s"
pg.field.local_blk_write_ms_per_second.help: "Local-block write milliseconds per elapsed second when the physical layout exposes them."
pg.field.temp_blk_read_ms_per_second.label: "Temp read, ms/s"
pg.field.temp_blk_read_ms_per_second.help: "Temporary-block read milliseconds per elapsed second when the physical layout exposes them."
pg.field.temp_blk_write_ms_per_second.label: "Temp write, ms/s"
pg.field.temp_blk_write_ms_per_second.help: "Temporary-block write milliseconds per elapsed second when the physical layout exposes them."
pg.field.total_exec_time.label: "Total exec time"
pg.field.total_exec_time.help: "Total time spent executing the statement."
pg.field.mean_exec_time.label: "Mean exec time"
pg.field.mean_exec_time.help: "Mean time spent executing one call of the statement."
pg.field.max_exec_time.label: "Max exec time"
pg.field.max_exec_time.help: "Longest recorded execution time for one call."
pg.field.rows.label: "Rows"
pg.field.rows.help: "Rows retrieved or affected by the statement or plan; the table shows the exact interval rate."
pg.field.shared_blks_hit.label: "Shared block hits"
pg.field.shared_blks_hit.help: "Shared data pages per second the statement found already in PostgreSQL buffers. The higher next to reads, the less the statement depends on the disks."
pg.field.shared_blks_read.label: "Shared blocks read"
pg.field.shared_blks_read.help: "Shared data pages per second that were missing from PostgreSQL buffers and had to be read from outside. Not necessarily the disk — the operating system's cache serves part; a steady stream means the statement's data does not live in the buffers."
pg.field.shared_blks_written.label: "Shared blocks written"
pg.field.shared_blks_written.help: "Shared data pages per second written out by the statement itself. Normally background processes do the writing; visible values mean the statement has to flush changed pages on its own."
pg.field.shared_blks_dirtied.label: "Shared blocks dirtied"
pg.field.shared_blks_dirtied.help: "Shared data pages per second the statement marked as changed. Each will sooner or later travel to disk; many changed pages from a reading statement usually mean row-visibility bookkeeping done in passing."
pg.field.local_blks_hit.label: "Local block hits"
pg.field.local_blks_hit.help: "Local-buffer blocks found in cache for the statement or plan."
pg.field.local_blks_read.label: "Local blocks read"
pg.field.local_blks_read.help: "Temporary-table pages per second that were missing from the process's buffers and had to be read. They appear only for statements whose temporary tables outgrew their buffers."
pg.field.local_blks_dirtied.label: "Local blocks dirtied"
pg.field.local_blks_dirtied.help: "Local-buffer blocks dirtied by the statement or plan."
pg.field.local_blks_written.label: "Local blocks written"
pg.field.local_blks_written.help: "Local-buffer blocks written by the statement or plan."
pg.field.temp_blks_read.label: "Temp blocks read"
pg.field.temp_blks_read.help: "Working-file pages per second the statement reads back from disk — the life of sorts and joins that did not fit in memory. A steady stream argues for more per-operation memory or a simpler query."
pg.field.temp_blks_written.label: "Temp blocks written"
pg.field.temp_blks_written.help: "Pages per second the statement spilled into working files on disk: its sorts and joins ran out of their memory allowance. Such a statement shuttles intermediate data through the disk and leans on it."
pg.field.wal_bytes.label: "WAL bytes"
pg.field.wal_bytes.help: "How many write-ahead log bytes this statement produces per second. This is the main price of changes: the log stream is written to disk, shipped to replicas, and sets the recovery volume."
pg.field.wal_records.label: "WAL records"
pg.field.wal_records.help: "Number of WAL records generated by the statement."
pg.field.wal_fpi.label: "WAL FPI"
pg.field.wal_fpi.help: "WAL full-page images generated by the statement."
pg.field.wal_buffers_full.label: "WAL buffers full"
pg.field.wal_buffers_full.help: "Times WAL buffers filled while the statement generated WAL."
pg.field.plans.label: "Plans"
pg.field.plans.help: "Number of times the statement was planned."
pg.field.total_plan_time.label: "Total plan time"
pg.field.total_plan_time.help: "Total time spent planning the statement."
pg.field.stats_since.label: "Stats since"
pg.field.stats_since.help: "Time from which these statement statistics were accumulated."
pg.field.queryid_stat_statements.label: "Last query ID"
pg.field.queryid_stat_statements.help: "vadv-only pg_stat_statements Query ID last attributed to this plan. It is not an exact join key."
pg.field.slow_log_calls.label: "Slow calls"
pg.field.slow_log_calls.help: "Executions recorded through the vadv slow-statement threshold."
pg.field.cmd_type.label: "Command type"
pg.field.cmd_type.help: "SQL command type recorded for this physical Datasentinel plan entry."
pg.field.dealloc.label: "Plan evictions"
pg.field.dealloc.help: "Least-executed plan entries evicted after the plan store filled."
pg.field.stats_reset.label: "Stats reset"
pg.field.stats_reset.help: "Time when all stored-plan statistics were last reset."
pg.field.pid.label: "PID"
pg.field.backend_age_ms.label: "Backend age"
pg.field.backend_age_ms.help: "Elapsed wall time from backend_start to the selected sample."
pg.field.query_duration_ms.label: "Query time"
pg.field.query_duration_ms.help: "Elapsed wall time from query_start to the selected sample. Shown only while state is active."
pg.field.transaction_duration_ms.label: "Xact time"
pg.field.transaction_duration_ms.help: "Elapsed wall time from xact_start to the selected sample. Shown only while a transaction is in progress."
pg.field.state_duration_ms.label: "Time in state"
pg.field.state_duration_ms.help: "Elapsed wall time from state_change to the selected sample."
pg.field.application_name.label: "Application"
pg.field.application_name.help: "Application name supplied by the connected client at the cursor."
pg.field.state.label: "State"
pg.field.state.help: "Current state of the PostgreSQL backend at the cursor."
pg.field.wait_event_type.label: "Wait event type"
pg.field.wait_event_type.help: "Class of the wait event active at the cursor; unavailable when no wait event is reported."
pg.field.wait_event.label: "Wait event"
pg.field.wait_event.help: "Wait event active at the cursor; unavailable when the backend is not reporting a wait."
pg.field.blocked_by.label: "Blocked by"
pg.field.blocked_by.help: "Backend PIDs blocking this backend at the cursor."
pg.field.lock_locktype.label: "Lock type"
pg.field.lock_locktype.help: "Type of lockable object represented by this lock row."
pg.field.lock_mode.label: "Lock mode"
pg.field.lock_mode.help: "PostgreSQL lock mode held or awaited by the backend at the cursor."
pg.field.lock_target.label: "Lock target"
pg.field.lock_target.help: "Text representation of the object or transaction targeted by the lock."
pg.field.lock_relname.label: "Relation"
pg.field.lock_relname.help: "Name of the relation targeted by the lock; unavailable for non-relation locks."
pg.field.waitstart.label: "Wait started"
pg.field.waitstart.help: "Time when the backend began waiting for the lock; unavailable when it is not waiting."
pg.field.numbackends.label: "Backends"
pg.field.numbackends.help: "Backends connected to the database at the cursor, in backends."
pg.field.xact_commit.label: "Commits/s"
pg.field.xact_commit.help: "How many transactions per second finish successfully in the database. The pulse of the workload: a sharp fall while clients are alive signals a jam — transactions are stuck, not gone."
pg.field.xact_rollback.label: "Rollbacks/s"
pg.field.xact_rollback.help: "How many transactions per second get rolled back. Occasional rollbacks are normal; a constant visible share next to commits points to application errors, conflicts, or timeouts."
pg.field.blks_hit.label: "Block hits"
pg.field.blks_hit.help: "Data-page requests per second answered from PostgreSQL buffers. The higher next to reads, the less often the database has to go outside for data."
pg.field.blks_read.label: "Blocks read"
pg.field.blks_read.help: "Data pages per second that were missing from PostgreSQL buffers. The operating system's cache serves part of these reads, so it is not necessarily the disk; steady growth means the data stopped fitting in the buffers."
pg.field.tup_returned.label: "Tuples returned"
pg.field.tup_returned.help: "How many rows and index entries per second the database churns through while running queries. This is what was read, not what clients received: huge values with modest results mean queries plow through excess data."
pg.field.tup_fetched.label: "Tuples fetched"
pg.field.tup_fetched.help: "Live table rows per second obtained through index lookups. A wide gap versus the rows churned through means broad passes for few useful rows."
pg.field.tup_inserted.label: "Tuples inserted"
pg.field.tup_inserted.help: "How many rows per second get added to the database's tables. A sustained high rate means growing volume and steady work for vacuum and checkpoints."
pg.field.tup_updated.label: "Tuples updated"
pg.field.tup_updated.help: "How many rows per second change in the database's tables. Every update leaves the old row version behind: a high rate feeds vacuum, and when it falls behind, tables bloat."
pg.field.tup_deleted.label: "Tuples deleted"
pg.field.tup_deleted.help: "How many rows per second get removed from the database's tables. Deleted versions keep lying around until vacuum: mass deletes free no space on their own."
pg.field.deadlocks.label: "Deadlocks"
pg.field.deadlocks.help: "How often transactions lock each other dead and PostgreSQL kills one of them. Each case is an aborted transaction and redone work; a steady stream means transactions grab the same rows in different orders."
pg.field.conflicts.label: "Recovery conflicts"
pg.field.conflicts.help: "Queries on the replica cut short by collisions with replaying the primary's changes. They grow when long reads on the replica hold on to data the primary has already changed or cleaned away."
pg.field.temp_files.label: "Temp files"
pg.field.temp_files.help: "How many working files per second queries create when their sorts and joins run out of memory. A constant stream signals tight per-operation memory or heavy queries shuttling data through the disk."
pg.field.temp_bytes.label: "Temp bytes"
pg.field.temp_bytes.help: "Volume per second queries spill into working files after failing to fit intermediate data in memory. A high stream leans on the disks and means per-operation memory is chronically short."
pg.field.blk_read_time.label: "Block read time"
pg.field.blk_read_time.help: "Accumulated database block-read milliseconds per wall-clock second in the interval, in ms/s, when track_io_timing is enabled. It may exceed 1000 because backends overlap."
pg.field.blk_write_time.label: "Block write time"
pg.field.blk_write_time.help: "Accumulated database block-write milliseconds per wall-clock second in the interval, in ms/s, when track_io_timing is enabled. It may exceed 1000 because backends overlap."
pg.field.sessions.label: "Sessions"
pg.field.sessions.help: "How many new connections to the database appear per second. A high rate signals work without a connection pool: every connection costs starting a separate process."
pg.field.frozen_xid_age.label: "Frozen XID age"
pg.field.frozen_xid_age.help: "Age of the database's datfrozenxid at the cursor, in transactions."
