pg.query.help: "Current query for an active backend; otherwise the most recent query. Inspect state and query time."
pg.query_id.label: "Query ID"
pg.query_id.help: "PostgreSQL query identifier when query ID calculation is enabled. Inspect the query text."
pg.backend_xid_age.label: "XID age"
pg.backend_xid_age.help: "Age of the backend transaction ID, measured in transactions. Inspect transaction time and state."
pg.backend_xmin_age.label: "Xmin age"
pg.backend_xmin_age.help: "Age of the backend xmin horizon, measured in transactions. Inspect long transactions and vacuum."
pg.backend_start.label: "Backend started"
pg.backend_start.help: "Time when the PostgreSQL backend started. Inspect state and transaction start."
pg.xact_start.label: "Transaction started"
pg.xact_start.help: "Start time of the current transaction. Inspect state, query, and xmin age."
pg.query_start.label: "Query started"
pg.query_start.help: "Start of the current query, or the most recent query when inactive. Inspect state and query time."
pg.state_change.label: "State changed"
pg.state_change.help: "Time of the latest backend state change. Inspect the current state and wait."
pg.field.queryid.label: "Query ID"
pg.field.queryid.help: "Query ID recorded for this plan. In vadv, this is the extension's own identifier. Inspect it with the plan ID and plan text."
pg.field.planid.label: "Plan ID"
pg.field.planid.help: "Plan ID assigned by pg_store_plans on this PostgreSQL server. Inspect it with query ID, database, role, and plan text."
pg.field.dbid.label: "Database ID"
pg.field.dbid.help: "OID of the database in which the statement or plan ran. Inspect calls, execution time, and rows for the same identity."
pg.field.userid.label: "Role ID"
pg.field.userid.help: "OID of the role that ran the statement or plan. Inspect calls, execution time, and rows for the same identity."
pg.field.toplevel.label: "Top level"
pg.field.toplevel.help: "Whether the statement ran at the top level rather than inside another statement. Inspect calls, execution time, and rows for the same statement."
pg.field.datname.label: "Database"
pg.field.datname.help: "Database associated with the statement or plan. Inspect its IDs, calls, execution time, and rows."
pg.field.usename.label: "Role"
pg.field.usename.help: "PostgreSQL role associated with the statement or plan. Inspect its IDs, calls, execution time, and rows."
pg.field.query.label: "Query"
pg.field.query.help: "Statement text recorded by PostgreSQL. Inspect calls, execution time, and rows for the same statement."
pg.field.plan.label: "Plan"
pg.field.plan.help: "Plan text recorded by pg_store_plans. Inspect it with plan ID, query ID, calls, and execution time."
pg.field.calls.label: "Calls"
pg.field.calls.help: "Executions accumulated for the statement or plan; the table shows the exact interval rate. Compare calls with execution time and rows."
pg.field.calls_per_second.label: "Calls/s"
pg.field.calls_per_second.help: "Exact increase in calls divided by elapsed seconds. Compare it with execution time and rows/s; a dash means the interval cannot be derived."
pg.field.execution_ms_per_second.label: "Execution time, ms/s"
pg.field.execution_ms_per_second.help: "Execution wall time summed across PostgreSQL calls per wall second, not CPU time. Compare it with calls/s and mean ms/call."
pg.field.mean_exec_ms_per_call.label: "Mean ms/call"
pg.field.mean_exec_ms_per_call.help: "Mean execution time per call over the selected interval. Compare it with calls/s and execution time, ms/s."
pg.table.cursor: "Cursor: {time}"
pg.table.interval: "Calculation interval: {from} → {to}"
pg.table.interval_unavailable: "Calculation interval: unavailable"
pg.table.filter: "Filter: {pattern}"
