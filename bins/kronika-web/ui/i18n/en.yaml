system.metric.health.label: "OS health"
system.metric.health.help: "0–100 score derived from CPU, memory, and I/O PSI; higher means less time waiting. Compare it with CPU utilization, load, memory, and PSI."
system.metric.cpu_busy.label: "CPU utilization"
system.metric.cpu_busy.help: "Share of aggregate CPU time spent outside idle and I/O wait. Compare it with runnable processes, load, and CPU PSI."
system.metric.process_count.label: "Processes"
system.metric.process_count.help: "Processes present at the selected time. Compare with runnable and D-state processes and total threads."
system.metric.process_running.label: "Runnable processes"
system.metric.process_running.help: "Processes in Linux R state. Compare with CPU utilization, load, and run delay."
system.metric.process_blocked.label: "D-state processes"
system.metric.process_blocked.help: "Processes in uninterruptible D state. Inspect I/O PSI, block delay, and device activity."
system.metric.process_threads.label: "Process threads"
system.metric.process_threads.help: "Threads across the visible processes. Compare with process count, load, and context switches."
system.metric.process_context_switches.label: "Process context switches"
system.metric.process_context_switches.help: "Voluntary and involuntary context switches across the visible processes. Inspect run delay, state, and CPU PSI."
system.metric.process_run_delay.label: "Process run delay"
system.metric.process_run_delay.help: "Time the visible processes accumulated while waiting on the run queue. Compare with runnable processes and CPU PSI."
system.metric.procs_running.label: "Runnable processes"
system.metric.procs_running.help: "Number of processes ready to run. Compare it with CPU utilization, load, runnable work, and CPU PSI."
system.metric.procs_blocked.label: "I/O-blocked processes"
system.metric.procs_blocked.help: "Number of processes blocked while waiting for I/O. Inspect I/O PSI, process block delay, and device activity."
system.metric.context_switches.label: "Context switches"
system.metric.context_switches.help: "Cumulative number of context switches since boot. Compare it with CPU utilization, load, runnable work, and CPU PSI."
system.metric.load1.label: "Load 1m"
system.metric.load1.help: "One-minute average of runnable and uninterruptible tasks. Compare it with the other load windows, runnable processes, and CPU utilization."
system.metric.load5.label: "Load 5m"
system.metric.load5.help: "Five-minute average of runnable and uninterruptible tasks. Compare it with the one- and fifteen-minute values."
system.metric.load15.label: "Load 15m"
system.metric.load15.help: "Fifteen-minute average of runnable and uninterruptible tasks. Compare it with the shorter load windows."
system.metric.runnable.label: "Runnable tasks"
system.metric.runnable.help: "Number of tasks currently ready to run. Compare it with the other load windows, runnable processes, and CPU utilization."
system.metric.tasks.label: "Total tasks"
system.metric.tasks.help: "Total number of tasks known to the kernel scheduler. Compare it with the other load windows, runnable processes, and CPU utilization."
system.metric.mem_available_percent.label: "Memory available"
system.metric.mem_available_percent.help: "Kernel estimate of memory available for new work, as a percentage of total memory. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.mem_available.label: "Available memory"
system.metric.mem_available.help: "Kernel estimate of memory available for new work without swapping. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.mem_total.label: "Total memory"
system.metric.mem_total.help: "Total usable physical memory. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.cached.label: "Page cache"
system.metric.cached.help: "Memory used by the file page cache. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.swap_free.label: "Free swap"
system.metric.swap_free.help: "Unused swap space. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.swap_total.label: "Total swap"
system.metric.swap_total.help: "Total configured swap space. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.process_resident.label: "Process RSS"
system.metric.process_resident.help: "Resident memory across the visible processes. Compare with available memory, process virtual memory, and memory PSI."
system.metric.process_virtual.label: "Process virtual memory"
system.metric.process_virtual.help: "Virtual address space across the visible processes. Compare with process RSS and process swap."
system.metric.process_swap.label: "Process swap"
system.metric.process_swap.help: "Swap used by the visible processes. Compare with free swap, process RSS, and memory PSI."
system.metric.process_minor_faults.label: "Process minor faults"
system.metric.process_minor_faults.help: "Minor faults across the visible processes. Compare with process RSS and major faults."
system.metric.process_major_faults.label: "Process major faults"
system.metric.process_major_faults.help: "Major faults across the visible processes. Compare with process RSS, device reads, and memory PSI."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Cumulative number of processes killed by the out-of-memory killer since boot. Compare it with available memory, swap, major faults, and memory PSI."
system.metric.cpu_pressure.label: "CPU PSI 10s"
system.metric.cpu_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for CPU. Compare it with CPU utilization, runnable processes, and run delay."
system.metric.memory_pressure.label: "Memory PSI 10s"
system.metric.memory_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for memory. Compare it with available memory, swap, and major faults."
system.metric.io_pressure.label: "I/O PSI 10s"
system.metric.io_pressure.help: "Percentage of wall-clock time over the last ten seconds when at least one task waited for I/O. Compare it with blocked processes, process I/O, and device activity."
system.metric.filesystem_free_min.label: "Minimum filesystem free"
system.metric.filesystem_free_min.help: "Lowest free-space percentage among the collected local filesystems. Inspect free space, process I/O, device activity, and I/O PSI together."
system.metric.process_read.label: "Process reads"
system.metric.process_read.help: "Bytes read from storage by the visible processes. Compare with block delay, I/O PSI, and device reads."
system.metric.process_write.label: "Process writes"
system.metric.process_write.help: "Bytes written to storage by the visible processes. Compare with block delay, I/O PSI, and device writes."
system.metric.process_block_delay.label: "Process block delay"
system.metric.process_block_delay.help: "Block-I/O delay across the visible processes. Compare with process reads and writes, I/O PSI, and active device I/O."
system.metric.device_count.label: "Block devices"
system.metric.device_count.help: "Block devices present at the selected time. Inspect active I/O and the device table."
system.metric.device_active_io.label: "Active device I/O"
system.metric.device_active_io.help: "I/O requests currently active across block devices. Inspect device reads, writes, and I/O PSI."
system.metric.filesystem_count.label: "Filesystems"
system.metric.filesystem_count.help: "Mounted filesystems present at the selected time. Inspect minimum free space and the mounts table."
system.metric.interface_count.label: "Interfaces"
system.metric.interface_count.help: "Network interfaces present at the selected time. Inspect receive, transmit, errors, and drops."
system.metric.network_rx.label: "Received"
system.metric.network_rx.help: "Bytes received across network interfaces. Compare with transmitted bytes, errors, and drops."
system.metric.network_tx.label: "Transmitted"
system.metric.network_tx.help: "Bytes transmitted across network interfaces. Compare with received bytes, errors, and drops."
system.metric.network_errors.label: "Network errors"
system.metric.network_errors.help: "Receive and transmit errors across network interfaces. Inspect traffic and dropped packets by interface."
system.metric.network_drops.label: "Network drops"
system.metric.network_drops.help: "Received and transmitted packets dropped across interfaces. Inspect traffic, errors, and the interface table."
