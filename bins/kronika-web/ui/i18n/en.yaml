process.summary.processes: "Processes"
process.summary.processes.help: "Number of Linux processes in the complete snapshot at the selected sample."
process.summary.threads: "Threads"
process.summary.threads.help: "Total Linux threads reported by all processes in the complete snapshot."
process.summary.running: "Runnable"
process.summary.running.help: "Processes in the runnable state in the complete snapshot."
process.summary.postgresql: "PostgreSQL backends"
process.summary.postgresql.help: "Process PIDs also present in PostgreSQL Activity at the selected sample."
process.summary.user_time: "User CPU"
process.summary.user_time.help: "How much processor time all processes together spent in their own program code, in core equivalents. A value near the number of available cores means the processors have nothing left to give."
process.summary.system_time: "System CPU"
process.summary.system_time.help: "How much processor time all processes together spent inside the Linux kernel — system calls and I/O housekeeping. A large share next to user time means the machine works on kernel requests rather than the programs themselves."
process.summary.run_delay: "Run queue wait"
process.summary.run_delay.help: "Total time runnable processes spent queued for a free processor, per second. Growth means the cores are oversubscribed: tasks are ready to run but get no time."
process.summary.context_switches: "Context switches"
process.summary.context_switches.help: "How often processes hand the processor to one another, in total per second. A very high rate means too many active threads or lots of tiny exchanges; the switching itself costs processor time too."
process.summary.resident: "RSS"
process.summary.resident.help: "Physical memory summed across every process in the snapshot — how much RAM running programs hold."
process.summary.virtual: "VSZ"
process.summary.virtual.help: "Reserved address space summed across every process; a reference figure that normally dwarfs resident memory."
process.summary.swap: "Swap"
process.summary.swap.help: "Swap space used by all processes in the complete snapshot."
process.summary.major_faults: "Major faults"
process.summary.major_faults.help: "Memory accesses that forced a read from disk, summed over all processes per second. A steady stream is a sign of memory shortage: the system evicts pages and immediately reads them back."
process.summary.read: "Read from storage"
process.summary.read.help: "Bytes all processes together physically read from storage per second. Reads served by the in-memory cache are not counted."
process.summary.written: "Written to storage"
process.summary.written.help: "Bytes all processes together sent to storage per second. Peaks can lag behind the programs: the kernel batches writes in memory and flushes them later."
process.summary.read_calls: "Read syscalls"
process.summary.read_calls.help: "Read requests summed across every process in the snapshot — the overall rate of asking the kernel for data."
process.summary.write_calls: "Write syscalls"
process.summary.write_calls.help: "Write requests summed across every process in the snapshot — the overall rate of asking the kernel to store data."
