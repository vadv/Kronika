pg.overview.field.buffers_alloc: "Buffers allocated"
pg.overview.field.buffers_alloc.help: "How many times backends needed a buffer for a new page of data. A high rate means heavy reading of data not already buffered: the working set exceeds the memory set aside for it."
pg.overview.field.buffers_backend: "Buffers written by backends"
pg.overview.field.buffers_backend.help: "Pages that query-serving processes had to write out themselves instead of leaving it to the background machinery. A visible share means background writing cannot keep up and page flushing slows the queries themselves."
pg.overview.field.buffers_backend_fsync: "Backend fsyncs"
pg.overview.field.buffers_backend_fsync.help: "Times a query-serving process had to wait for files to be forced to disk itself. Normally background processes do this; nonzero values signal serious write overload."
pg.overview.field.buffers_checkpoint: "Checkpoint buffers"
pg.overview.field.buffers_checkpoint.help: "Pages written to disk during checkpoints. This is the main intended path for flushing changed data; bursts line up with checkpoints and can lean on the disks."
pg.overview.field.buffers_clean: "Bgwriter buffers"
pg.overview.field.buffers_clean.help: "Pages written ahead of time by the background process so buffers are clean when needed. A healthy sign: writing happens in the background instead of slowing queries."
pg.overview.field.checkpoint_sync_time: "Checkpoint sync time"
pg.overview.field.checkpoint_sync_time.help: "Time checkpoints spent waiting for what they wrote to actually settle on disk. Growth means the disks are not keeping up with the write stream."
pg.overview.field.checkpoint_write_time: "Checkpoint write time"
pg.overview.field.checkpoint_write_time.help: "Time checkpoints spent writing changed pages; it is deliberately stretched out so the disks are not slammed at once. Growth reflects a growing volume of changes between checkpoints."
pg.overview.field.checkpoints_req: "Requested checkpoints"
pg.overview.field.checkpoints_req.help: "Checkpoints started early — the write-ahead log grew to its limit or one was requested by hand. When they outnumber scheduled ones, writing is outrunning the schedule: heavy changes or a tight log configuration."
pg.overview.field.checkpoints_timed: "Timed checkpoints"
pg.overview.field.checkpoints_timed.help: "Checkpoints started on schedule. In a healthy system they are the majority: changes get flushed at a steady rhythm with no emergency bursts."
pg.overview.field.maxwritten_clean: "Bgwriter maxwritten stops"
pg.overview.field.maxwritten_clean.help: "Times the background writer cut a pass short after hitting its per-round page limit. Frequent stops mean more changes than it is allowed to flush, and the limit has become the bottleneck."
pg.overview.field.stats_reset: "Stats reset"
pg.overview.field.stats_reset.help: "Time when statistics for this PostgreSQL view were last reset."
pg.overview.field.buffers_written: "Buffers written"
pg.overview.field.buffers_written.help: "Pages written to disk by completed checkpoints. Shows how much changed data each checkpoint has to push out."
pg.overview.field.num_done: "Checkpoints done"
pg.overview.field.num_done.help: "How many checkpoints ran to completion. Each one settles changes on disk and trims the amount of log that would have to be replayed after a crash."
pg.overview.field.num_requested: "Requested checkpoints"
pg.overview.field.num_requested.help: "Checkpoints started early — by write-ahead log growth or by hand. When they outnumber scheduled ones, checkpoints come more often than intended: writing is outrunning the schedule."
pg.overview.field.num_timed: "Timed checkpoints"
pg.overview.field.num_timed.help: "Checkpoints started on schedule. When they are the majority, changes get flushed at an even rhythm without unplanned spikes."
pg.overview.field.restartpoints_done: "Restartpoints done"
pg.overview.field.restartpoints_done.help: "How many restartpoints the replica completed while replaying the log. They act as the replica's checkpoints: they cap how much would have to be replayed again after it restarts."
pg.overview.field.restartpoints_req: "Requested restartpoints"
pg.overview.field.restartpoints_req.help: "Restartpoints requested early on the replica — usually driven by the volume of replayed log. Frequent requests mean a dense stream of changes from the primary."
pg.overview.field.restartpoints_timed: "Timed restartpoints"
pg.overview.field.restartpoints_timed.help: "Restartpoints started on the replica by schedule. A steady scheduled rhythm is a sign the replica keeps up with the change stream comfortably."
pg.overview.field.slru_written: "SLRU buffers written"
pg.overview.field.slru_written.help: "Bookkeeping buffers — transaction statuses and similar system records — written during checkpoints and restartpoints. Usually a drop next to the data pages."
pg.overview.field.sync_time: "Sync time"
pg.overview.field.sync_time.help: "Time checkpoints spent waiting for the written files to actually settle on disk. Growth under unchanged load is a sign the disks stopped keeping up."
pg.overview.field.write_time: "Write time"
pg.overview.field.write_time.help: "Time checkpoints spent writing changed pages; it is stretched on purpose so the disks are not slammed at once. Growth tracks the volume of changes piling up between checkpoints."
pg.overview.field.backend_type: "Backend type"
pg.overview.field.backend_type.help: "PostgreSQL backend class represented by this I/O row."
pg.overview.field.context: "I/O context"
pg.overview.field.context.help: "PostgreSQL I/O context represented by this row, such as normal, bulk read, or vacuum."
pg.overview.field.evictions: "Evictions"
pg.overview.field.evictions.help: "How many times this scope had to push someone else's page out of a buffer to make room for its own. A constant stream means the data does not fit in the buffers and competes for space."
pg.overview.field.extend_bytes: "Extend bytes"
pg.overview.field.extend_bytes.help: "By how many bytes data files grew in this scope. Shows the pace at which tables and indexes physically grow."
pg.overview.field.extend_time: "Extend time"
pg.overview.field.extend_time.help: "Time this scope spent growing data files. Visible values mean file growth is limited by the filesystem or the disk."
pg.overview.field.extends: "Extends"
pg.overview.field.extends.help: "How many times data files in this scope got extra room carved out for new pages. They come with inserts and any object growth."
pg.overview.field.fsync_time: "fsync time"
pg.overview.field.fsync_time.help: "Time this scope spent waiting for files to actually land on disk. Growth means the drive is not keeping up with the write stream."
pg.overview.field.fsyncs: "fsyncs"
pg.overview.field.fsyncs.help: "Forced flushes of this scope's files to disk — the guarantee that what was written survives a crash. Each flush waits for physical write-out, so on overloaded disks this is where time piles up."
pg.overview.field.hits: "Buffer hits"
pg.overview.field.hits.help: "This scope's data requests answered straight from PostgreSQL buffers. The larger their share next to reads, the less often data has to be fetched from outside."
pg.overview.field.object: "I/O object"
pg.overview.field.object.help: "PostgreSQL object class represented by this I/O row, such as relation or temporary relation."
pg.overview.field.op_bytes: "Bytes per op"
pg.overview.field.op_bytes.help: "Configured or observed byte size of one I/O operation in this scope."
pg.overview.field.read_bytes: "Bytes read"
pg.overview.field.read_bytes.help: "Volume of data this scope read from beyond PostgreSQL buffers. Not necessarily the disk: some of these reads are served by the operating system's cache."
pg.overview.field.read_time: "Read time"
pg.overview.field.read_time.help: "Time this scope spent waiting on reads; recorded when track_io_timing is enabled. Growth at an unchanged read volume points to slowing disks."
pg.overview.field.reads: "Reads"
pg.overview.field.reads.help: "How many times this scope read data from beyond PostgreSQL buffers. A buffer miss does not have to mean the disk: the operating system's cache often steps in."
pg.overview.field.reuses: "Reuses"
pg.overview.field.reuses.help: "How many times the scope cycled the buffers of its private ring — this is how bulk operations such as bulk read avoid washing out the shared buffers. A usual companion of large sequential passes."
pg.overview.field.write_bytes: "Bytes written"
pg.overview.field.write_bytes.help: "Volume of data this scope wrote out of PostgreSQL buffers. The writes land in the operating system's cache and reach the disk later, when flushed."
pg.overview.field.writeback_time: "Writeback time"
pg.overview.field.writeback_time.help: "Time spent asking the kernel to start pushing already-written data to disk. Growth means the kernel is holding the write stream back: the disks are busy."
pg.overview.field.writebacks: "Writebacks"
pg.overview.field.writebacks.help: "Requests asking the kernel to start pushing already-written pages to disk without waiting for a full flush. This spreads the write volume over time instead of sharp spikes."
pg.overview.field.writes: "Writes"
pg.overview.field.writes.help: "How many times this scope wrote pages out of PostgreSQL buffers. The write itself settles in the operating system's cache and reaches the disk later, on flush."
pg.overview.field.datname: "Database"
pg.overview.field.datname.help: "Database associated with the prepared transactions represented by this row."
pg.overview.field.max_age_us: "Oldest xact age"
pg.overview.field.max_age_us.help: "Age of the oldest prepared transaction at the recorded sample."
pg.overview.field.max_xid_age_tx: "Max XID age"
pg.overview.field.max_xid_age_tx.help: "Largest transaction-ID age among prepared transactions at the recorded sample."
pg.overview.field.prepared_count: "Prepared xacts"
pg.overview.field.prepared_count.help: "Number of prepared transactions at the recorded sample."
pg.overview.field.dealloc: "Statement evictions"
pg.overview.field.dealloc.help: "Statement records dropped from the statistics when their storage filled up. Constant evictions mean there are more distinct statements than it can hold, and part of the history is being lost."
