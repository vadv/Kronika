col.rtprio.label: "RT priority"
col.rtprio.help: "Real-time scheduler priority at the cursor."
col.policy.label: "Policy"
col.policy.help: "Numeric Linux scheduler-policy code at the cursor."
col.curcpu.label: "CPU"
col.curcpu.help: "Logical CPU on which the process last ran or is running at the cursor."
col.utime.label: "User CPU time, cores"
col.utime.help: "Average user-mode CPU consumed during the selected snapshot interval, in CPU cores; 1 means one fully busy core."
col.stime.label: "System CPU time, cores"
col.stime.help: "Average kernel-mode CPU consumed during the selected snapshot interval, in CPU cores; 1 means one fully busy core."
col.rundelay.label: "Run delay"
col.rundelay.help: "How many milliseconds out of each second the process stood in the queue ready to run while the processors were busy with others. Growth means competition for the processor: the task wants to work but gets no core."
col.blkdelay.label: "Block I/O delay"
col.blkdelay.help: "Time the process spent waiting for disk I/O to finish, in kernel ticks per second. A persistently high value means the process is limited by the disk, not the processor."
col.nvcsw.label: "Voluntary ctx switches"
col.nvcsw.help: "How often the process gives up the processor on its own to wait — for data, a lock, or a timer. A high rate is typical of tasks living on short exchanges: network, disks, pipes."
col.nivcsw.label: "Involuntary ctx switches"
col.nivcsw.help: "How often the scheduler takes the processor away from the process — its time slice ran out or a higher-priority task arrived. A high rate signals a fight for the processor: more active threads than cores."
col.minflt.label: "Minor faults"
col.minflt.help: "Memory accesses the kernel resolved without the disk — the page was already in memory, only the page-table entry was missing. Every working process produces them all the time; on their own they are harmless."
col.majflt.label: "Major faults"
col.majflt.help: "Memory accesses that had to wait for a disk read: the needed page was not in RAM. They grow when memory is short and pages get pushed to swap; each one costs a disk operation, so steady growth means the process is stalling on the disk."
col.vmem.label: "VSZ"
col.vmem.help: "Every address the process has reserved, including pages it never touched and mapped files. Usually many times the resident size and not a problem in itself."
col.rmem.label: "RSS"
col.rmem.help: "Physical memory the process actually holds: pages resident in RAM right now. This is what it takes from everyone else, and what the kernel reclaims first when memory runs short."
col.vswap.label: "Swap"
col.vswap.help: "Swap space used by the process at the cursor, rendered in bytes."
col.syscr.label: "Read syscalls"
col.syscr.help: "How often per second the process asks the kernel to read something. Many small calls where a few large ones would do is inefficient reading: every call costs a trip into the kernel even when the data already sits in memory."
col.syscw.label: "Write syscalls"
col.syscw.help: "How often per second the process asks the kernel to write something. Frequent small writes cost the kernel more than rare large ones, even at the same total volume."
col.rchar.label: "Read incl. cache"
col.rchar.help: "Bytes the process read through system calls, including what came from the memory cache rather than the disk. The gap against reads from storage shows how much of the reading avoided the disk."
col.wchar.label: "Written incl. cache"
col.wchar.help: "Bytes the process wrote through system calls — most of it lands in the memory cache first, not on disk. The gap against writes to storage shows the data stayed in cache or was overwritten before it was flushed."
col.read_bytes.label: "Read from storage"
col.read_bytes.help: "Bytes the process caused to be physically read from storage — what the in-memory cache did not have. A persistently high value means the process's working data does not fit in cache and it keeps going to disk."
col.write_bytes.label: "Written to storage"
col.write_bytes.help: "Bytes physically sent to storage on the process's account. The write can reach the disk later than the calls themselves: the kernel batches it in cache and flushes in the background."
col.cancelled_write.label: "Cancelled write"
col.cancelled_write.help: "Bytes that were queued for disk but never got there — the file was deleted or truncated first, for example. Common for programs working with temporary files; this is write work saved, not data lost."
col.exit_signal.label: "Exit signal"
col.exit_signal.help: "Signal configured to be sent to the parent when the process exits, at the cursor."
col.cpu_percent.label: "%CPU"
col.cpu_percent.help: "Total scheduled CPU time divided by the time the process has existed, as a percentage of one core — the same lifetime average ps reports, not an instantaneous reading."
col.mem_percent.label: "%MEM"
col.mem_percent.help: "Resident memory (RSS) as a percentage of total host memory at the cursor."
col.starttime.label: "START"
col.starttime.help: "When the process started."
col.cpu_time.label: "TIME"
col.cpu_time.help: "Total user- and kernel-mode CPU time the process has consumed since it started."
