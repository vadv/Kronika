pg.help.relation.scan_rate: "How many times per second queries started a pass over the table or index. Frequent full passes over a big table point to a missing or unused index; for an index this measures how much it is used."
pg.help.relation.index_entries_rate: "How many entries per second queries pull out of the index itself; these are index positions, not table rows. When far above the rows actually fetched, the index is walked broadly while selecting little."
pg.help.relation.rows_fetched_rate: "How many live table rows per second plain index lookups brought back. Far below the index entries read means broad index walks for few useful rows."
pg.help.relation.maintenance_rate: "How many times per second this maintenance operation ran over the table. Frequent passes mean the table churns heavily; none at all on an active table means the automation never reaches it."
pg.help.relation.per_scan: "How many rows or entries one pass brings on average; unavailable without scans. Large values for an index mean broad selections: a pass walks a lot while filtering out little."
pg.help.relation.dml_share: "This operation's share of all row changes in the table — inserts, updates, and deletes together. Shows the workload's character: whether the table mostly grows, gets edited, or gets purged."
pg.help.relation.row_estimate: "PostgreSQL's estimated row count for the named since-maintenance condition at the cursor."
pg.help.relation.maintenance_mean: "How many milliseconds one pass of this maintenance took on average; available since PostgreSQL 18, unavailable without operations. Long passes hold resources and keep the upkeep from catching up with changes."
pg.help.relation.buffer_hit: "The share of data accesses answered from PostgreSQL buffers. The rest was read from outside — not necessarily the disk, often the operating system's cache; a persistently low share on a hot table means the buffers are too small."
pg.help.relation.last_scan: "Time of the last matching scan known at the cursor. This timestamp is available on PostgreSQL 16 or later."
pg.help.relation.last_maintenance: "Time of the last named maintenance operation known at the cursor."
pg.help.relation.oldest_timestamp: "Earliest non-null member timestamp in this rollup at the cursor."
pg.help.relation.latest_timestamp: "Latest non-null member timestamp in this rollup at the cursor."
pg.help.relation.never_count: "Applicable members with no recorded timestamp for the named operation at the cursor, in objects."
pg.help.relation.toast_never_count: "Tables with a TOAST relation but no recorded TOAST autovacuum timestamp at the cursor, in tables."
pg.help.relation.index_state_count: "Member indexes for which the named pg_index state is true at the cursor, in indexes."
pg.help.relation.tuple_throughput: "How many table rows per second flow through queries — full passes and index lookups combined. A measure of how hot the table is for reading; a jump under unchanged load hints at changed plans."
pg.help.relation.sequential_share: "The share of full-table passes among all passes over it; unavailable without scans. A high share on a big table means it is read end to end — usually no suitable index; on small tables this is normal."
pg.help.relation.dml_total: "How many rows per second change in the table — inserts, updates, and deletes combined. The main measure of write heat: this is where dead row versions and vacuum work come from."
pg.help.relation.hot_share: "The share of updates where the new row version fit on the same page and no index had to be touched; unavailable without updates. The higher it is, the cheaper updates are — otherwise every one writes to all of the table's indexes."
pg.help.relation.new_page_share: "The share of updates where the new row version did not fit on its page and moved to another; available since PostgreSQL 16. It grows when pages run out of free space; such updates cost more and write to every index."
pg.help.relation.dead_share: "The share of row versions no longer visible to anyone that still occupy space in the table. They pile up after updates and deletes and are removed by vacuum; a high share bloats the table and slows reads."
pg.help.relation.displayed_storage: "Table main-fork bytes plus total TOAST relation bytes at the cursor. Ordinary indexes and other table forks are excluded."
pg.help.relation.table_data: "Size of the table's main fork from pg_relation_size at the cursor, in bytes."
pg.help.relation.index_data: "Size of the index's main fork from pg_relation_size at the cursor, in bytes."
pg.help.relation.toast_share: "How much of the table's footprint is out-of-line long values — texts, JSON, and other wide fields PostgreSQL stores apart from the rows. A high share means the bulk comes from wide fields, not the rows themselves."
pg.help.relation.reltuples: "pg_class.reltuples planner estimate at the cursor, in rows; -1 means no estimate is available."
pg.help.relation.toast_dead_share: "The share of dead versions among the table's out-of-line long values. It builds up as rows with wide fields are updated and deleted; a high share bloats this side storage until vacuum gets to it."
pg.help.relation.xid_age: "Age of relfrozenxid at the cursor, in transactions; rollups show the maximum. Partitioned parents are unavailable."
pg.help.relation.mxid_age: "Age of relminmxid at the cursor, in multixacts; rollups show the maximum. Partitioned parents are unavailable."
pg.help.relation.no_scans: "Marks indexes that provably served no query in the selected interval. An unavailable interval does not count as zero; an index idle for long only slows writes and takes space."
pg.help.relation.no_scan_count: "How many of the group's indexes provably went without a single use in the interval. A persistently nonzero count points at removal candidates: such indexes only tax writes."
pg.help.relation.known_scan_count: "How many of the group's indexes were provably used by queries in the interval. Together with the idle count it shows how much of the index set actually works."
pg.help.relation.indisvalid: "Whether pg_index marks the index valid for use by queries at the cursor."
pg.help.relation.indisready: "Whether pg_index marks the index ready to receive new inserts at the cursor."
pg.help.relation.indisprimary: "Whether pg_index marks the index as enforcing a primary-key constraint at the cursor."
pg.help.relation.indisunique: "Whether pg_index marks the index as enforcing uniqueness at the cursor."
pg.help.relation.indisexclusion: "Whether pg_index marks the index as enforcing an exclusion constraint at the cursor."
