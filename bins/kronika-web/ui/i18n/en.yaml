lane.load.label: "Load"
lane.load.help: "One-minute average of runnable and uninterruptible tasks. Compare it with CPU utilization, runnable processes, and CPU PSI at the cursor."
lane.memory.label: "Memory"
lane.memory.help: "Share of memory held by what cannot be given back without swapping or killing something; page cache is not counted. Check the process table in its memory cut."
lane.pressure.label: "PSI"
lane.pressure.help: "Share of the last ten seconds when work waited for CPU, memory, or I/O. Compare each line with the matching resource values at the cursor."
locator.known_bad: "High value"
locator.known_bad.help: "The exact value reached a registered operating boundary. Inspect the value, boundary, and neighboring history, then open its destination."
locator.spike: "Sharp rise"
locator.spike.help: "The exact value rose sharply against its recent history. Inspect the previous and current values, then open its destination."
locator.event: "PostgreSQL log"
locator.event.help: "A concrete PostgreSQL log record at the displayed UTC time. Inspect its type and useful fields, then open the record."
