lane.cpu_busy.help: "Share of processor time burnt on everything that is not idle, measured against the CPUs available here. Compare with the CPU wait lane below."
lane.cpu_stall.help: "Share of the window in which a task waited for a processor. Compare with the CPU lane above: rising while that one is short of its ceiling means a narrow quota."
lane.io_stall.help: "Share of the window in which a task waited for storage. Check the process table in its disk cut."
lane.backends.help: "PostgreSQL client backends. Compare the running and waiting rows below."
lane.pg_running.help: "PostgreSQL backends in the active state without a wait event at this moment. Compare with waiting backends and CPU."
lane.pg_waiting.help: "PostgreSQL backends in the active state with a wait event at this moment. Open Activity to inspect the wait type and event."
lane.oldest_xact.help: "Age of the oldest open transaction; a steady climb means someone is stuck holding the horizon. Open the PostgreSQL activity table."
