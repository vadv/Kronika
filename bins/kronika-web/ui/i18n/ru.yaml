activity.cut.db_read: "Read bytes"
activity.cut.db_read.help: "Байты, прочитанные за пределами общих буферов PostgreSQL за секунду, по записанному размеру блока. Учитывает чтение из кэша страниц ОС."
activity.cut.temp_bytes: "Temp bytes"
