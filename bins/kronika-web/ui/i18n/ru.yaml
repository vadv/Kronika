system.field.device.label: "Устройство"
system.field.device_id.label: "Major:minor"
system.field.io_in_progress.label: "Выполняется операций I/O"
system.field.io_in_progress.help: "Число запросов ввода-вывода, переданных устройству и ещё не завершённых у курсора."
system.field.reads.label: "Чтения"
system.field.reads.help: "Сколько запросов чтения устройство завершает за секунду. Вместе со скоростью чтения показывает характер нагрузки: много операций при малом объёме — чтение идёт мелкими порциями."
system.field.writes.label: "Записи"
system.field.writes.help: "Сколько запросов записи устройство завершает за секунду. Вместе со скоростью записи показывает характер нагрузки: много операций при малом объёме — признак мелких синхронных записей."
system.field.read_bytes.label: "Скорость чтения"
system.field.read_bytes.help: "Сколько байт в секунду физически прочитано с устройства; обращения, обслуженные кэшем в памяти, сюда не попадают. Устойчивые значения у предела накопителя означают, что чтение стало узким местом."
system.field.write_bytes.label: "Скорость записи"
system.field.write_bytes.help: "Сколько байт в секунду физически записано на устройство. Ядро копит запись в памяти и сбрасывает её позже, поэтому пики могут не совпадать по времени с работой программ."
system.field.read_latency_ms.label: "Среднее время чтения"
system.field.read_latency_ms.help: "Сколько миллисекунд в среднем занимает одно чтение, включая ожидание в очереди устройства. Рост при прежней нагрузке — признак перегрузки или деградации накопителя; без завершённых чтений значение недоступно."
system.field.write_latency_ms.label: "Среднее время записи"
system.field.write_latency_ms.help: "Сколько миллисекунд в среднем занимает одна запись, включая ожидание в очереди устройства. Рост означает, что устройство не успевает за потоком записи; без завершённых записей значение недоступно."
system.field.device_busy.label: "Устройство занято"
system.field.device_busy.help: "Доля интервала с активным вводом-выводом на этом устройстве хоста; это не время одной операции."
system.field.average_queue.label: "Средняя очередь"
system.field.average_queue.help: "Сколько запросов в среднем одновременно ждали это устройство или выполнялись на нём. Устойчиво длинная очередь означает, что накопитель не успевает за нагрузкой и каждая операция ждёт дольше."
system.field.cgroup_path.label: "Cgroup"
system.field.cgroup_used_cores.label: "Использовано CPU, ядра"
system.field.cgroup_used_cores.help: "Процессорное время, полученное контрольной группой, в которой работает коллектор, в пересчёте на ядра: 1 — одно полностью занятое ядро. Значение вплотную к квоте означает, что ядро начнёт притормаживать группу."
system.field.cgroup_user_cores.label: "Пользовательский CPU, ядра"
system.field.cgroup_user_cores.help: "Часть процессорного времени группы коллектора, проведённая в собственном коде программ, в пересчёте на ядра. Обычно это основная составляющая: вычисления и обработка данных."
system.field.cgroup_system_cores.label: "Системный CPU, ядра"
system.field.cgroup_system_cores.help: "Часть процессорного времени группы коллектора, проведённая внутри ядра Linux — в системных вызовах и обслуживании ввода-вывода. Большая системная часть при скромной пользовательской означает, что время уходит на обращения к ядру, а не на полезную работу."
system.field.cgroup_other_cores.label: "Прочий CPU, ядра"
system.field.cgroup_other_cores.help: "Остаток процессорного времени группы коллектора, не отнесённый ни к коду программ, ни к ядру Linux. Обычно близок к нулю; заметная величина — особенность учёта в этой версии ядра."
system.field.cgroup_capacity.label: "Доступно CPU, ядра"
system.field.cgroup_capacity.help: "Самая строгая конечная квота процессоров во всей точной иерархии контрольных групп коллектора, ограниченная действующим набором доступных процессоров. Для неизвестной иерархии или неограниченной иерархии без конечного набора показано тире."
system.field.cgroup_quota.label: "Локальная квота CPU, ядра"
system.field.cgroup_quota.help: "Предел процессорного времени, записанный непосредственно в группе, где числится коллектор, в пересчёте на ядра. Это настройка самого листа — действующий лимит может быть строже из-за родительских групп; неограниченная или недоступная квота показана тире."
system.field.cpuset_cpus.label: "Эффективный cpuset"
system.field.cpuset_cpus.help: "Число логических процессоров в действующем наборе доступных процессоров контрольной группы коллектора."
system.field.current.label: "Использовано памяти"
system.field.current.help: "Текущая память, учтённая в контрольной группе коллектора, в байтах."
system.field.effective_memory_max.label: "Эффективный лимит памяти"
system.field.effective_memory_max.help: "Самый строгий конечный лимит памяти во всей точной иерархии контрольных групп коллектора, в байтах; для неограниченной или недоступной для чтения иерархии показано тире."
system.field.max.label: "Локальный лимит памяти"
system.field.max.help: "Конечный лимит памяти, записанный в точной группе членства коллектора. Это фактическая настройка листа, которая может быть выше действующего лимита предка; для неограниченного или недоступного лимита показано тире."
system.field.anon.label: "Анонимная память"
system.field.anon.help: "Анонимная память, учтённая в контрольной группе коллектора, в байтах."
system.field.file.label: "Файловая память"
system.field.file.help: "Файловая память, учтённая в контрольной группе коллектора, в байтах."
system.field.slab.label: "Память slab"
system.field.slab.help: "Кэши служебных структур ядра внутри общей памяти ядра в контрольной группе коллектора, в байтах."
system.field.kernel_other.label: "Прочая память ядра"
system.field.kernel_other.help: "Память ядра в контрольной группе коллектора без кэшей служебных структур, в байтах."
system.field.memory_unclassified.label: "Прочая учтённая память"
system.field.memory_unclassified.help: "Текущая память контрольной группы коллектора без анонимной, файловой памяти и памяти ядра, в байтах."
system.field.rbytes.label: "Скорость чтения"
system.field.rbytes.help: "Сколько байт в секунду группа коллектора прочитала с этого устройства. Считается физический ввод-вывод: чтение, обслуженное кэшем в памяти, сюда не попадает."
system.field.wbytes.label: "Скорость записи"
system.field.wbytes.help: "Сколько байт в секунду группа коллектора записала на это устройство. Отложенная ядром запись доходит до устройства позже, чем работала программа, поэтому пики могут запаздывать."
system.field.rios.label: "Операции чтения"
system.field.rios.help: "Сколько операций чтения с этого устройства группа коллектора выполняет за секунду. Сравнение со скоростью чтения даёт размер средней операции: поток мелких чтений нагружает устройство сильнее, чем тот же объём крупными."
system.field.wios.label: "Операции записи"
system.field.wios.help: "Сколько операций записи на это устройство группа коллектора выполняет за секунду. Вместе со скоростью записи показывает размер средней операции: много мелких записей — самая тяжёлая нагрузка для накопителя."
system.field.mount_point.label: "Точка монтирования"
system.field.fstype.label: "Файловая система"
system.field.source.label: "Источник"
system.field.total_bytes.label: "Всего байтов"
system.field.total_bytes.help: "Полный объём файловой системы у курсора, в байтах."
system.field.free_bytes.label: "Свободно байтов"
system.field.free_bytes.help: "Объём файловой системы, доступный непривилегированным процессам для записи у курсора, в байтах."
system.field.is_k8s_infra.label: "Служебная точка Kubernetes"
system.field.is_k8s_infra.help: "Показывает, отнесена ли точка монтирования к служебной инфраструктуре Kubernetes у курсора."
system.field.iface.label: "Интерфейс"
system.field.rx_bytes.label: "Получено байтов"
system.field.rx_bytes.help: "Входящий поток через интерфейс, в байтах за секунду. Значения у потолка скорости подключения означают, что канал стал узким местом."
system.field.rx_packets.label: "Получено пакетов"
system.field.rx_packets.help: "Сколько пакетов в секунду приходит на интерфейс. Плотный поток мелких пакетов нагружает процессор обработкой даже при скромном объёме в байтах."
system.field.rx_errs.label: "Ошибки приёма"
system.field.rx_errs.help: "Пакеты, пришедшие повреждёнными — обычно из-за кабеля, помех или несогласованных настроек канала. В исправной сети их нет; устойчивый поток означает неполадки на физическом уровне."
system.field.rx_drop.label: "Потери при приёме"
system.field.rx_drop.help: "Входящие пакеты, которые ядро выбросило, не обработав — обычно из-за переполненных буферов. Устойчивые потери означают, что система не успевает разбирать входящий поток и данные пересылаются повторно."
system.field.tx_bytes.label: "Передано байтов"
system.field.tx_bytes.help: "Исходящий поток через интерфейс, в байтах за секунду. Значения у потолка скорости подключения означают, что отправка упирается в канал."
system.field.tx_packets.label: "Передано пакетов"
system.field.tx_packets.help: "Сколько пакетов в секунду интерфейс отправляет. Плотный поток мелких пакетов — заметная работа для процессора независимо от объёма в байтах."
system.field.tx_errs.label: "Ошибки передачи"
system.field.tx_errs.help: "Сбои при отправке пакетов на стороне интерфейса или драйвера. В исправной сети их нет; появление — признак проблем с оборудованием или драйвером."
system.field.tx_drop.label: "Потери при передаче"
system.field.tx_drop.help: "Исходящие пакеты, выброшенные до отправки — обычно из-за переполненной очереди интерфейса. Появляются, когда поток превышает возможности канала; соединения отвечают повторными передачами и задержками."
system.field.speed_mbit.label: "Скорость подключения"
system.field.speed_mbit.help: "Номинальная скорость подключения интерфейса у курсора, в Мбит/с."
system.field.duplex.label: "Дуплексный режим"
system.field.duplex.help: "Дуплексный режим интерфейса по данным выбранного снимка."
system.field.cpu_id.label: "ID CPU"
system.field.model_name.label: "Модель CPU"
system.field.mhz_max.label: "Максимальная частота"
system.field.mhz_max.help: "Максимальная частота логического процессора по данным выбранного снимка, в МГц."
system.field.core_id.label: "ID ядра"
system.field.core_id.help: "Идентификатор физического ядра процессора у курсора; -1 означает, что значение недоступно."
system.field.socket_id.label: "ID сокета"
system.field.socket_id.help: "Идентификатор процессорного сокета у курсора; -1 означает, что значение недоступно."
system.field.numa_node.label: "Узел NUMA"
system.field.numa_node.help: "Идентификатор узла памяти для логического процессора у курсора; -1 означает, что значение недоступно."
lane.health.label: "Состояние"
lane.health.help: "Общее состояние, ОС и PostgreSQL показаны отдельными линиями от 0 до 100."
lane.health.overall_health: "Общее"
lane.health.os_health: "ОС"
lane.health.postgres_health: "PostgreSQL"
lane.memory.label: "Память"
lane.memory.help: "Доля памяти, занятая тем, что нельзя вернуть без подкачки или убийства процесса; страничный кэш не в счёт."
locator.known_bad: "Высокое значение"
locator.known_bad.help: "Точное значение достигло рабочего порога."
locator.spike: "Резкий рост"
locator.event: "Журнал PostgreSQL"
locator.event.help: "Конкретная запись журнала PostgreSQL в указанное время."
