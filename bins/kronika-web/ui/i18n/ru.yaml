process.summary.title: "Итоги по процессам"
process.summary.loading: "Загрузка итогов по процессам…"
process.summary.error: "Не удалось загрузить итоги по процессам"
process.summary.processes: "Processes"
process.summary.processes.help: "Число процессов Linux в полном снимке на выбранный момент."
process.summary.threads: "Threads"
process.summary.threads.help: "Общее число потоков Linux у всех процессов в полном снимке."
process.summary.running: "Runnable"
process.summary.running.help: "Число процессов в состоянии готовности к выполнению в полном снимке."
process.summary.postgresql: "Backends PostgreSQL"
process.summary.postgresql.help: "Число процессов, идентификаторы которых также есть в активности PostgreSQL на выбранный момент."
process.summary.user_time: "User CPU, cores"
process.summary.user_time.help: "Сколько процессорного времени все процессы вместе провели в собственном коде программ, в пересчёте на ядра. Значение около числа доступных ядер означает, что процессорам больше нечего отдать."
process.summary.system_time: "System CPU, cores"
process.summary.system_time.help: "Сколько процессорного времени все процессы вместе провели внутри ядра Linux — в системных вызовах и обслуживании ввода-вывода. Заметная доля на фоне пользовательской означает, что время уходит на обращения к ядру, а не на саму работу."
process.summary.run_delay: "Run queue wait"
process.summary.run_delay.help: "Суммарное время, которое готовые к работе процессы простояли в очереди за свободным процессором, за каждую секунду. Рост означает нехватку процессорных ядер: задачи готовы, но им не достаётся времени."
process.summary.context_switches: "Context switches"
process.summary.context_switches.help: "Как часто процессы уступают процессор друг другу, суммарно за секунду. Очень высокая частота означает избыток активных потоков или обилие мелких обменов; сами переключения тоже стоят процессорного времени."
process.summary.resident: "RSS"
process.summary.resident.help: "Сумма физической памяти всех процессов снимка — сколько оперативки занято работающими программами."
process.summary.virtual: "VSZ"
process.summary.virtual.help: "Сумма зарезервированного адресного пространства всех процессов; величина справочная и обычно многократно превышает реально занятую память."
process.summary.swap: "Swap"
process.summary.swap.help: "Пространство подкачки, занятое всеми процессами в полном снимке."
process.summary.major_faults: "Major page faults"
process.summary.major_faults.help: "Обращения к памяти, ради которых пришлось читать с диска, суммарно у всех процессов за секунду. Устойчивый поток — признак нехватки памяти: система вытесняет страницы и тут же читает их обратно."
process.summary.read: "Read from storage"
process.summary.read.help: "Сколько байт все процессы вместе физически прочитали с накопителей за секунду. Чтение, обслуженное кэшем в памяти, сюда не входит."
process.summary.written: "Written to storage"
process.summary.written.help: "Сколько байт все процессы вместе отправили на накопители за секунду. Пики могут отставать от работы программ: ядро копит запись в памяти и сбрасывает её позже."
process.summary.read_calls: "Read syscalls"
process.summary.read_calls.help: "Сумма запросов на чтение от всех процессов снимка — общий поток обращений к ядру за данными."
process.summary.write_calls: "Write syscalls"
process.summary.write_calls.help: "Сумма запросов на запись от всех процессов снимка — общий поток обращений к ядру на сохранение данных."
