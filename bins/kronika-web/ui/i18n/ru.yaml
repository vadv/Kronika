pg.overview.field.buffers_alloc: "Buffers allocated"
pg.overview.field.buffers_alloc.help: "Сколько раз процессам понадобился буфер под новую страницу данных. Высокий темп означает активное чтение данных, которых нет в буферах: рабочее множество больше отведённой памяти."
pg.overview.field.buffers_backend: "Buffers written by backends"
pg.overview.field.buffers_backend.help: "Страницы, которые обслуживающие запросы процессы записали на диск сами, не дождавшись фоновых механизмов. Заметная доля означает, что фоновая запись не успевает и сброс страниц тормозит сами запросы."
pg.overview.field.buffers_backend_fsync: "Backend fsyncs"
pg.overview.field.buffers_backend_fsync.help: "Случаи, когда обслуживающему запросы процессу пришлось самому дожидаться сброса файлов на диск. В норме это работа фоновых процессов; ненулевые значения — признак серьёзной перегрузки записью."
pg.overview.field.buffers_checkpoint: "Checkpoint buffers"
pg.overview.field.buffers_checkpoint.help: "Страницы, записанные на диск в ходе контрольных точек. Это основной штатный путь записи изменённых данных; всплески совпадают с контрольными точками и могут давить на диски."
pg.overview.field.buffers_clean: "Bgwriter buffers"
pg.overview.field.buffers_clean.help: "Страницы, записанные фоновым процессом заранее, чтобы к моменту нужды буферы были чистыми. Здоровый признак: запись уходит фоном и не тормозит запросы."
pg.overview.field.checkpoint_sync_time: "Checkpoint sync time"
pg.overview.field.checkpoint_sync_time.help: "Время, которое контрольные точки провели в ожидании, пока записанное действительно осядет на диск. Рост означает, что диски не успевают за потоком записи."
pg.overview.field.checkpoint_write_time: "Checkpoint write time"
pg.overview.field.checkpoint_write_time.help: "Время, потраченное контрольными точками на запись изменённых страниц; оно намеренно растянуто, чтобы не забивать диски разом. Рост отражает растущий объём изменений между точками."
pg.overview.field.checkpoints_req: "Requested checkpoints"
pg.overview.field.checkpoints_req.help: "Контрольные точки, запущенные досрочно — журнал предзаписи дорос до лимита или точку попросили вручную. Их преобладание над плановыми означает, что запись обгоняет расписание: интенсивные изменения или тесные настройки журнала."
pg.overview.field.checkpoints_timed: "Timed checkpoints"
pg.overview.field.checkpoints_timed.help: "Контрольные точки, запущенные по расписанию. В здоровой системе их большинство: запись изменений идёт ровным ритмом, без авральных сбросов."
pg.overview.field.maxwritten_clean: "Bgwriter maxwritten stops"
pg.overview.field.maxwritten_clean.help: "Случаи, когда фоновая запись обрывала проход, упёршись в лимит страниц за раз. Частые остановки означают, что изменений больше, чем ей разрешено сбрасывать, и лимит стал узким местом."
pg.overview.field.stats_reset: "Stats reset"
pg.overview.field.stats_reset.help: "Момент последнего сброса статистики в этом представлении PostgreSQL."
pg.overview.field.buffers_written: "Buffers written"
pg.overview.field.buffers_written.help: "Страницы, записанные на диск выполненными контрольными точками. Показывает, какой объём изменённых данных каждая точка должна протолкнуть на диск."
pg.overview.field.num_done: "Checkpoints done"
pg.overview.field.num_done.help: "Сколько контрольных точек дошло до конца. Каждая фиксирует изменения на диске и сокращает объём журнала, который придётся проигрывать при восстановлении после сбоя."
pg.overview.field.num_requested: "Requested checkpoints"
pg.overview.field.num_requested.help: "Контрольные точки, запущенные досрочно — по росту журнала предзаписи или вручную. Их преобладание над плановыми означает, что точки идут чаще задуманного: запись обгоняет расписание."
pg.overview.field.num_timed: "Timed checkpoints"
pg.overview.field.num_timed.help: "Контрольные точки, запущенные по расписанию. Когда их большинство, изменения сбрасываются ровным ритмом без внеплановых пиков."
pg.overview.field.restartpoints_done: "Restartpoints done"
pg.overview.field.restartpoints_done.help: "Сколько точек перезапуска реплика довела до конца, проигрывая журнал. Они играют роль контрольных точек на реплике: ограничивают объём, который придётся повторять после её перезапуска."
pg.overview.field.restartpoints_req: "Requested restartpoints"
pg.overview.field.restartpoints_req.help: "Точки перезапуска, запрошенные на реплике досрочно — обычно из-за объёма проигранного журнала. Частые запросы означают плотный поток изменений с главного сервера."
pg.overview.field.restartpoints_timed: "Timed restartpoints"
pg.overview.field.restartpoints_timed.help: "Точки перезапуска, запущенные на реплике по расписанию. Пока они идут по расписанию, реплика успевает применять поток изменений."
pg.overview.field.slru_written: "SLRU buffers written"
pg.overview.field.slru_written.help: "Служебные буферы — статусы транзакций и похожий системный учёт, — записанные при контрольных точках и точках перезапуска. Обычно капля на фоне страниц данных."
pg.overview.field.sync_time: "Sync time"
pg.overview.field.sync_time.help: "Время, которое контрольные точки провели в ожидании, пока записанные файлы действительно осядут на диск. Рост при прежней нагрузке — признак, что диски перестали успевать."
pg.overview.field.write_time: "Write time"
pg.overview.field.write_time.help: "Время, потраченное контрольными точками на запись изменённых страниц; оно нарочно растянуто, чтобы не забивать диски разом. Рост отражает объём изменений, накапливающийся между точками."
pg.overview.field.backend_type: "Backend type"
pg.overview.field.backend_type.help: "Класс процесса PostgreSQL, к которому относится эта строка ввода-вывода."
pg.overview.field.context: "I/O context"
pg.overview.field.context.help: "Контекст ввода-вывода PostgreSQL в этой строке, например normal, bulk read или vacuum."
pg.overview.field.evictions: "Evictions"
pg.overview.field.evictions.help: "Сколько раз в этой области приходилось выталкивать чужую страницу из буфера, чтобы освободить место под свою. Постоянный поток означает, что данные не умещаются в буферах и конкурируют за место."
pg.overview.field.extend_bytes: "Extend bytes"
pg.overview.field.extend_bytes.help: "На сколько байт выросли файлы данных при дозаписи в этой области. Показывает темп физического роста таблиц и индексов."
pg.overview.field.extend_time: "Extend time"
pg.overview.field.extend_time.help: "Время, потраченное в этой области на увеличение файлов данных. Заметные значения означают, что рост файлов упирается в файловую систему или диск."
pg.overview.field.extends: "Extends"
pg.overview.field.extends.help: "Сколько раз файлам данных в этой области дорезали место под новые страницы. Идут при вставках и любом росте объектов."
pg.overview.field.fsync_time: "fsync time"
pg.overview.field.fsync_time.help: "Время, проведённое этой областью в ожидании, пока файлы действительно лягут на диск. Рост означает, что накопитель не поспевает за потоком записи."
pg.overview.field.fsyncs: "fsyncs"
pg.overview.field.fsyncs.help: "Принудительные сбросы файлов этой области на диск — гарантия, что записанное переживёт сбой. Каждый сброс дожидается физической записи, поэтому при перегруженных дисках именно здесь копится время."
pg.overview.field.hits: "Buffer hits"
pg.overview.field.hits.help: "Обращения этой области к данным, которые нашлись уже в буферах PostgreSQL. Чем больше их доля на фоне чтений, тем реже приходится ходить за данными наружу."
pg.overview.field.object: "I/O object"
pg.overview.field.object.help: "Класс объекта PostgreSQL в этой строке ввода-вывода, например relation или temp relation."
pg.overview.field.op_bytes: "Bytes per op"
pg.overview.field.op_bytes.help: "Заданный или наблюдаемый размер одной операции ввода-вывода в этой области."
pg.overview.field.read_bytes: "Bytes read"
pg.overview.field.read_bytes.help: "Объём данных, прочитанных этой областью из-за пределов буферов PostgreSQL. Это не обязательно диск: часть чтений обслуживает кэш операционной системы."
pg.overview.field.read_time: "Read time"
pg.overview.field.read_time.help: "Время, проведённое этой областью в ожидании чтения данных; учитывается при включённом track_io_timing. Рост при прежнем объёме чтения — признак замедлившихся дисков."
pg.overview.field.reads: "Reads"
pg.overview.field.reads.help: "Сколько раз эта область читала данные из-за пределов буферов PostgreSQL. Промах по буферам не обязательно означает диск: часто выручает кэш операционной системы."
pg.overview.field.reuses: "Reuses"
pg.overview.field.reuses.help: "Сколько раз область пускала по кругу буферы своего рабочего кольца — так массовые операции вроде bulk read не вымывают общие буферы. Обычный спутник больших последовательных проходов."
pg.overview.field.write_bytes: "Bytes written"
pg.overview.field.write_bytes.help: "Объём данных, записанных этой областью из буферов PostgreSQL наружу. Запись уходит в кэш операционной системы, а на диск попадает позже, при сбросе."
pg.overview.field.writeback_time: "Writeback time"
pg.overview.field.writeback_time.help: "Время, потраченное на просьбы к ядру начать выталкивать уже записанное на диск. Рост означает, что ядро придерживает поток записи: диски заняты."
pg.overview.field.writebacks: "Writebacks"
pg.overview.field.writebacks.help: "Просьбы к ядру начать выталкивать на диск уже записанные страницы, не дожидаясь общего сброса. Так объём записи размазывается во времени вместо резких пиков."
pg.overview.field.writes: "Writes"
pg.overview.field.writes.help: "Сколько раз эта область записывала страницы из буферов PostgreSQL наружу. Сама запись оседает в кэше операционной системы и доходит до диска позже, при сбросе."
pg.overview.field.datname: "Database"
pg.overview.field.datname.help: "База данных, с которой связаны подготовленные транзакции в этой строке."
pg.overview.field.max_age_us: "Oldest xact age"
pg.overview.field.max_age_us.help: "Возраст старейшей подготовленной транзакции на записанный момент."
pg.overview.field.max_xid_age_tx: "Max XID age"
pg.overview.field.max_xid_age_tx.help: "Наибольший возраст идентификатора среди подготовленных транзакций на записанный момент."
pg.overview.field.prepared_count: "Prepared xacts"
pg.overview.field.prepared_count.help: "Число подготовленных транзакций на записанный момент."
pg.overview.field.dealloc: "Statement evictions"
pg.overview.field.dealloc.help: "Записи о запросах, выброшенные из статистики, когда её хранилище переполнилось. Постоянные вытеснения означают, что разных запросов больше, чем оно вмещает, и часть истории теряется."
pg.detail.pid: "PostgreSQL PID {pid}"
pg.detail.query: "ID запроса {id}"
pg.detail.plan: "ID плана {id}"
pg.wal_storage.label: "Размер файлов в pg_wal"
pg.wal_storage.history: "Размер файлов в pg_wal за час"
pg.wal_storage.help: "Суммарный размер обычных файлов, видимых в pg_wal у курсора."
pg.plan.label: "Plan"
pg.pid.label: "PID PostgreSQL"
pg.pid.help: "Идентификатор процесса PostgreSQL у курсора."
pg.leader_pid.label: "Leader PID"
pg.leader_pid.help: "Идентификатор ведущего процесса группы параллельных рабочих процессов; недоступен, если процесс не является параллельным рабочим."
pg.datname.label: "Database"
pg.datname.help: "База данных, связанная с процессом у курсора."
pg.usename.label: "Role"
pg.usename.help: "Роль PostgreSQL, связанная с процессом у курсора."
pg.application_name.label: "Application"
pg.application_name.help: "Имя приложения, переданное подключённым клиентом, у курсора."
pg.client_addr.label: "Client address"
pg.client_addr.help: "IP-адрес клиента у курсора; у локального соединения адреса нет."
pg.backend_type.label: "Backend type"
pg.backend_type.help: "Тип процесса PostgreSQL у курсора, например client backend или autovacuum worker."
pg.activity.system: "System"
pg.activity.idle: "Idle"
pg.state.label: "State"
pg.state.help: "Состояние процесса PostgreSQL у курсора."
pg.wait_event_type.label: "Wait event type"
pg.wait_event_type.help: "Класс события ожидания у курсора; пустое значение означает, что событие ожидания не зарегистрировано."
pg.wait_event.label: "Wait event"
pg.wait_event.help: "Событие ожидания у курсора; пустое значение означает, что процесс не сообщает об ожидании."
pg.query.label: "Query"
pg.query.help: "Текущий запрос активного процесса у курсора или последний запрос неактивного процесса."
pg.query_id.label: "Query ID"
pg.query_id.help: "Идентификатор запроса PostgreSQL у курсора, если включено его вычисление; иначе значение недоступно."
pg.vacuum.pid.label: "PID"
pg.vacuum.datname.label: "Database"
pg.vacuum.datname.help: "База данных, содержащая очищаемую таблицу, у курсора."
pg.vacuum.is_autovacuum.label: "Autovacuum"
pg.vacuum.is_autovacuum.help: "Показывает, запущена ли эта очистка автоматически, а не вручную, у курсора."
pg.vacuum.heap_blks_scanned.label: "Heap blocks scanned"
pg.vacuum.heap_blks_scanned.help: "Число блоков таблицы, просканированных этой очисткой к выбранному снимку."
pg.vacuum.heap_blks_total.label: "Heap blocks total"
pg.vacuum.heap_blks_total.help: "Число блоков таблицы на момент начала сканирования этой очисткой."
pg.vacuum.heap_blks_vacuumed.label: "Heap blocks vacuumed"
pg.vacuum.heap_blks_vacuumed.help: "Число блоков таблицы, обработанных этой очисткой к выбранному снимку."
pg.vacuum.index_vacuum_count.label: "Index vacuum cycles"
pg.vacuum.index_vacuum_count.help: "Число завершённых циклов очистки индексов этой операцией к выбранному снимку."
pg.vacuum.indexes_processed.label: "Indexes processed"
pg.vacuum.indexes_processed.help: "Число индексов, обработанных в текущем цикле к выбранному снимку; поле доступно начиная с PostgreSQL 17."
pg.vacuum.indexes_total.label: "Indexes total"
pg.vacuum.indexes_total.help: "Число индексов, подлежащих обработке в текущем цикле, у курсора; поле доступно начиная с PostgreSQL 17."
pg.vacuum.num_dead_tuples.label: "Dead tuples collected"
pg.vacuum.num_dead_tuples.help: "Число мёртвых строк, собранных в текущем цикле к выбранному снимку; поле используется в PostgreSQL 10–16."
pg.vacuum.max_dead_tuples.label: "Dead tuple capacity"
pg.vacuum.max_dead_tuples.help: "Вместимость хранилища мёртвых строк текущего цикла у курсора; поле используется в PostgreSQL 10–16."
pg.vacuum.num_dead_item_ids.label: "Dead item IDs"
pg.vacuum.num_dead_item_ids.help: "Число идентификаторов мёртвых элементов, собранных в текущем цикле к выбранному снимку; поле доступно начиная с PostgreSQL 17."
pg.vacuum.dead_tuple_bytes.label: "Dead item memory"
pg.vacuum.dead_tuple_bytes.help: "Память, занятая хранилищем идентификаторов мёртвых элементов у курсора, в байтах; поле доступно начиная с PostgreSQL 17."
pg.vacuum.max_dead_tuple_bytes.label: "Dead item memory capacity"
pg.vacuum.max_dead_tuple_bytes.help: "Вместимость хранилища идентификаторов мёртвых элементов у курсора, в байтах; поле доступно начиная с PostgreSQL 17."
pg.vacuum.delay_time.label: "Cost delay"
pg.vacuum.delay_time.help: "Время сна этой очистки в точках задержки по стоимости, в миллисекундах; поле доступно начиная с PostgreSQL 18."
pg.vacuum.phase.label: "Phase"
pg.vacuum.phase.help: "Текущая фаза очистки по данным выбранного снимка."
pg.backend_xid_age.label: "XID age"
pg.backend_xid_age.help: "Возраст текущего идентификатора транзакции процесса у курсора, в транзакциях; недоступен, пока идентификатор не назначен."
pg.backend_xmin_age.label: "xmin age"
pg.backend_xmin_age.help: "Возраст горизонта xmin процесса у курсора, в транзакциях; недоступен без горизонта xmin."
pg.backend_start.label: "Backend started"
pg.backend_start.help: "Время запуска процесса PostgreSQL."
pg.xact_start.label: "Xact started"
pg.xact_start.help: "Время начала текущей транзакции процесса; недоступно вне транзакции."
pg.query_start.label: "Query started"
pg.query_start.help: "Время начала текущего запроса или последнего запроса неактивного процесса."
pg.state_change.label: "State changed"
pg.state_change.help: "Время последнего изменения состояния процесса."
pg.field.queryid.label: "Query ID"
pg.field.queryid.help: "Идентификатор запроса, сохранённый для этой физической записи запроса или плана; vadv использует собственный идентификатор расширения."
pg.field.planid.label: "Plan ID"
pg.field.planid.help: "Идентификатор, присвоенный этой физической записи плана расширением pg_store_plans на сервере PostgreSQL."
pg.field.toplevel.label: "Top level"
pg.field.toplevel.help: "Показывает, относится ли физическая запись к выполнению верхнего уровня, а не к выполнению внутри другого запроса."
pg.field.datname.label: "Database"
pg.field.statement_database.help: "База данных, связанная с этой физической записью запроса."
pg.field.plan_database.help: "База данных, связанная с этой физической записью плана."
pg.field.usename.label: "Role"
pg.field.usename.help: "Роль PostgreSQL, связанная с этой физической записью запроса или плана."
pg.field.query.label: "Query"
pg.field.query.help: "Текст запроса, записанный для этой физической записи pg_stat_statements."
pg.field.plan.label: "Plan"
pg.field.plan.help: "Текст плана, записанный для этой физической записи pg_store_plans."
pg.field.calls.label: "Calls"
pg.field.calls.help: "Выполнения запроса или плана; в таблице показана точная интервальная скорость."
pg.field.calls_per_second.label: "Calls/s"
pg.field.calls_per_second.help: "Сколько раз в секунду выполнялся этот запрос. Вместе со средним временем показывает, что даёт нагрузку: частота вызовов или тяжесть каждого."
pg.field.execution_ms_per_second.label: "Exec time, ms/s"
pg.field.execution_ms_per_second.help: "Суммарные миллисекунды исполнения за интервал на секунду реального времени. Значение может превышать 1000 мс/с из-за параллельного исполнения запросов."
pg.field.mean_exec_ms_per_call.label: "Mean, ms/call"
pg.field.mean_exec_ms_per_call.help: "Сколько миллисекунд в среднем занимало одно выполнение в этом интервале; без вызовов значение недоступно. Рост при прежней частоте означает, что запрос стал тяжелее: сменился план, выросли данные или появилась конкуренция."
pg.table.cursor: "Курсор: {time}"
pg.table.interval: "Интервал расчёта: {from} → {to}"
pg.table.interval_unavailable: "Интервал расчёта: нет данных"
pg.table.filter: "Фильтр: {pattern}"
pg.table.no_filter: "Фильтр: нет"
pg.table.order: "Сортировка на сервере: {semantic} ({physical}), {direction}"
pg.table.order_default: "Сортировка на сервере: не задана"
pg.table.desc: "по убыванию"
pg.table.asc: "по возрастанию"
pg.table.shown: "Загружено {returned} из {eligible}"
pg.table.focus_loading: "Точный результат в фокусе; отфильтрованная страница загружается"
pg.table.focus_outside: "Точный результат в фокусе вне текущей страницы"
pg.table.focus_exact: "Точный результат в фокусе"
pg.field.rows_per_call.label: "Rows/call"
pg.field.rows_per_call.help: "Сколько строк в среднем возвращает или меняет одно выполнение; без вызовов значение недоступно. Резкий рост означает, что запрос стал приносить больше данных, чем раньше, — изменились условия или сами данные."
pg.field.blocks_per_call.label: "Blocks/call"
pg.field.blocks_per_call.help: "Сколько страниц данных в среднем трогает одно выполнение — найденных в буферах и прочитанных извне вместе; без вызовов значение недоступно. Рост при прежнем результате означает, что план стал перебирать больше данных."
pg.field.hit_pct.label: "Cache hit ratio"
pg.field.hit_pct.help: "Доля обращений к страницам, обслуженных из буферов PostgreSQL. Остальное читалось извне — не обязательно с диска, часто из кэша операционной системы."
pg.field.wal_per_call.label: "WAL/call"
pg.field.wal_per_call.help: "Сколько байт журнала предзаписи порождает одно выполнение; без вызовов значение недоступно. Большие значения означают объёмные изменения данных — у запросов на чтение журнал почти не растёт."
pg.field.plan_time_pct.label: "Plan time, %"
pg.field.plan_time_pct.help: "Какая часть всего времени запроса ушла на построение плана, а не на исполнение. Высокая доля у быстрых частых запросов — довод за подготовленные выражения, чтобы не планировать каждый раз заново."
pg.field.cv.label: "CV"
pg.field.cv.help: "Насколько время исполнения гуляет вокруг среднего: ноль — выполнения одинаковые, около единицы и выше — разброс сравним со средним; при нулевом среднем значение недоступно. Большой разброс означает, что запрос ведёт себя по-разному: разные параметры, планы или конкуренция."
pg.field.min_exec_time_ms.label: "Min, ms"
pg.field.min_exec_time_ms.help: "Минимальное время исполнения, записанное за период статистики, в миллисекундах."
pg.field.max_exec_time_ms.label: "Max, ms"
pg.field.max_exec_time_ms.help: "Максимальное время исполнения, записанное за период статистики, в миллисекундах."
pg.field.mean_exec_time_ms.label: "Mean, ms"
pg.field.mean_exec_time_ms.help: "Среднее время исполнения, записанное за период статистики, в миллисекундах."
pg.field.stddev_exec_time_ms.label: "Stddev, ms"
pg.field.stddev_exec_time_ms.help: "Стандартное отклонение времени исполнения, записанное за период статистики, в миллисекундах."
pg.field.first_call.label: "First call"
pg.field.first_call.help: "Время первого вызова плана, записанное расширением."
pg.field.last_call.label: "Last call"
pg.field.last_call.help: "Время последнего вызова плана, записанное расширением."
pg.field.rows_per_second.label: "Rows/s"
pg.field.rows_per_second.help: "Сколько строк в секунду запрос возвращает или меняет — что именно, зависит от его типа. Показывает вес запроса в общем потоке данных."
pg.field.planning_ms_per_second.label: "Planning, ms/s"
pg.field.planning_ms_per_second.help: "Сколько миллисекунд каждую секунду уходит на построение планов этого запроса. Заметные значения при высокой частоте вызовов — довод за подготовленные выражения."
pg.field.shared_blk_read_ms_per_second.label: "Shared read, ms/s"
pg.field.shared_blk_read_ms_per_second.help: "Миллисекунды чтения общих блоков в секунду либо всех блоков, если раскладка не разделяет время."
pg.field.shared_blk_write_ms_per_second.label: "Shared write, ms/s"
pg.field.shared_blk_write_ms_per_second.help: "Миллисекунды записи общих блоков в секунду либо всех блоков, если раскладка не разделяет время."
pg.field.local_blk_read_ms_per_second.label: "Local read, ms/s"
pg.field.local_blk_read_ms_per_second.help: "Миллисекунды чтения локальных блоков в секунду, если они есть в физической раскладке."
pg.field.local_blk_write_ms_per_second.label: "Local write, ms/s"
pg.field.local_blk_write_ms_per_second.help: "Миллисекунды записи локальных блоков в секунду, если они есть в физической раскладке."
pg.field.temp_blk_read_ms_per_second.label: "Temp read, ms/s"
pg.field.temp_blk_read_ms_per_second.help: "Миллисекунды чтения временных блоков в секунду, если они есть в физической раскладке."
pg.field.temp_blk_write_ms_per_second.label: "Temp write, ms/s"
pg.field.temp_blk_write_ms_per_second.help: "Миллисекунды записи временных блоков в секунду, если они есть в физической раскладке."
pg.field.total_exec_time.label: "Total exec time"
pg.field.total_exec_time.help: "Общее время выполнения запроса."
pg.field.mean_exec_time.label: "Mean exec time"
pg.field.mean_exec_time.help: "Среднее время одного выполнения запроса."
pg.field.max_exec_time.label: "Max exec time"
pg.field.max_exec_time.help: "Наибольшее время одного выполнения запроса."
pg.field.rows.label: "Rows"
pg.field.rows.help: "Строки, полученные или изменённые запросом либо планом; в таблице показана точная интервальная скорость."
pg.field.shared_blks_hit.label: "Shared block hits"
pg.field.shared_blks_hit.help: "Страницы общих данных, которые запрос нашёл уже в буферах PostgreSQL, за секунду. Чем выше на фоне чтений, тем меньше запрос зависит от дисков."
pg.field.shared_blks_read.label: "Shared blocks read"
pg.field.shared_blks_read.help: "Страницы общих данных, которых не оказалось в буферах PostgreSQL и пришлось читать извне, за секунду. Не обязательно диск — часть отдаёт кэш операционной системы; устойчивый поток означает, что данные запроса не живут в буферах."
pg.field.shared_blks_written.label: "Shared blocks written"
pg.field.shared_blks_written.help: "Страницы общих данных, записанные на диск силами самого запроса, за секунду. В норме записью занимаются фоновые процессы; заметные значения означают, что запросу приходится сбрасывать изменённые страницы самому."
pg.field.shared_blks_dirtied.label: "Shared blocks dirtied"
pg.field.shared_blks_dirtied.help: "Страницы общих данных, которые запрос пометил изменёнными, за секунду. Каждая такая страница рано или поздно поедет на диск; много изменённых страниц у читающего запроса — обычно попутные пометки о видимости строк."
pg.field.local_blks_hit.label: "Local block hits"
pg.field.local_blks_hit.help: "Локальные буферные блоки, найденные в кэше для запроса или плана."
pg.field.local_blks_read.label: "Local blocks read"
pg.field.local_blks_read.help: "Страницы временных таблиц, которых не было в буферах процесса и пришлось читать, за секунду. Появляются только у запросов с временными таблицами, переросшими свои буферы."
pg.field.local_blks_dirtied.label: "Local blocks dirtied"
pg.field.local_blks_dirtied.help: "Локальные буферные блоки, изменённые запросом или планом."
pg.field.local_blks_written.label: "Local blocks written"
pg.field.local_blks_written.help: "Локальные буферные блоки, записанные запросом или планом."
pg.field.temp_blks_read.label: "Temp blocks read"
pg.field.temp_blks_read.help: "Страницы рабочих файлов, которые запрос перечитывает с диска, за секунду — так живут сортировки и соединения, не поместившиеся в память. Устойчивый поток — довод дать операциям больше памяти или упростить запрос."
pg.field.temp_blks_written.label: "Temp blocks written"
pg.field.temp_blks_written.help: "Страницы, сброшенные запросом в рабочие файлы на диске, за секунду: сортировкам и соединениям не хватило отведённой памяти. Такой запрос гоняет промежуточные данные через диск и давит на него."
pg.field.wal_bytes.label: "WAL bytes"
pg.field.wal_bytes.help: "Сколько байт журнала предзаписи порождает этот запрос за секунду. Это главная цена изменений: поток журнала пишется на диск, уходит на реплики и определяет объём восстановления."
pg.field.wal_records.label: "WAL records"
pg.field.wal_records.help: "Число записей журнала предзаписи, созданных запросом."
pg.field.wal_fpi.label: "WAL FPI"
pg.field.wal_fpi.help: "Полные образы страниц, записанные запросом в журнал предзаписи."
pg.field.wal_buffers_full.label: "WAL buffers full"
pg.field.wal_buffers_full.help: "Число заполнений буферов журнала предзаписи при работе запроса."
pg.field.plans.label: "Plans"
pg.field.plans.help: "Число построений плана запроса."
pg.field.total_plan_time.label: "Total plan time"
pg.field.total_plan_time.help: "Общее время планирования запроса."
pg.field.stats_since.label: "Stats since"
pg.field.stats_since.help: "Время начала накопления этой статистики запросов."
pg.field.queryid_stat_statements.label: "Last query ID"
pg.field.queryid_stat_statements.help: "Доступный только в vadv идентификатор последнего запроса pg_stat_statements, связанного с планом. Это не точный ключ соединения."
pg.field.slow_log_calls.label: "Slow calls"
pg.field.slow_log_calls.help: "Выполнения, записанные через порог медленных запросов vadv."
pg.field.cmd_type.label: "Command type"
pg.field.cmd_type.help: "Тип команды SQL, записанный для этой физической записи плана Datasentinel."
pg.field.dealloc.label: "Plan evictions"
pg.field.dealloc.help: "Наименее выполняемые планы, вытесненные после заполнения хранилища."
pg.field.stats_reset.label: "Stats reset"
pg.field.stats_reset.help: "Время последнего сброса всей статистики планов."
pg.field.pid.label: "PID"
pg.field.backend_age_ms.label: "Backend age"
pg.field.backend_age_ms.help: "Время от backend_start до выбранного снимка."
pg.field.query_duration_ms.label: "Query time"
pg.field.query_duration_ms.help: "Время от query_start до выбранного снимка. Показано только в состоянии active."
pg.field.transaction_duration_ms.label: "Xact time"
pg.field.transaction_duration_ms.help: "Время от xact_start до выбранного снимка. Показано только при открытой транзакции."
pg.field.state_duration_ms.label: "Time in state"
pg.field.state_duration_ms.help: "Время от state_change до выбранного снимка."
pg.field.application_name.label: "Application"
pg.field.application_name.help: "Имя приложения, переданное подключённым клиентом, у курсора."
pg.field.state.label: "State"
pg.field.state.help: "Текущее состояние процесса PostgreSQL у курсора."
pg.field.wait_event_type.label: "Wait event type"
pg.field.wait_event_type.help: "Класс события ожидания у курсора; недоступен, если событие ожидания не зарегистрировано."
pg.field.wait_event.label: "Wait event"
pg.field.wait_event.help: "Событие ожидания у курсора; недоступно, если процесс не сообщает об ожидании."
pg.field.blocked_by.label: "Blocked by"
pg.field.blocked_by.help: "Идентификаторы процессов, блокирующих этот процесс у курсора."
pg.field.lock_locktype.label: "Lock type"
pg.field.lock_locktype.help: "Тип блокируемого объекта, представленного этой строкой блокировки."
pg.field.lock_mode.label: "Lock mode"
pg.field.lock_mode.help: "Режим блокировки PostgreSQL, удерживаемой или ожидаемой процессом у курсора."
pg.field.lock_target.label: "Lock target"
pg.field.lock_target.help: "Текстовое представление объекта или транзакции, на которую установлена блокировка."
pg.field.lock_relname.label: "Relation"
pg.field.lock_relname.help: "Имя отношения, на которое установлена блокировка; недоступно для блокировок других объектов."
pg.field.waitstart.label: "Wait started"
pg.field.waitstart.help: "Время, с которого процесс ожидает блокировку; недоступно, если процесс не ожидает."
pg.field.numbackends.label: "Backends"
pg.field.numbackends.help: "Число процессов, подключённых к базе данных у курсора."
pg.field.xact_commit.label: "Commits/s"
pg.field.xact_commit.help: "Сколько транзакций в секунду успешно завершается в базе. Резкое падение при прежнем числе подключений означает, что транзакции стоят, а не закончились."
pg.field.xact_rollback.label: "Rollbacks/s"
pg.field.xact_rollback.help: "Сколько транзакций в секунду откатывается. Отдельные откаты нормальны; постоянная заметная доля на фоне успешных — признак ошибок приложения, конфликтов или тайм-аутов."
pg.field.blks_hit.label: "Block hits"
pg.field.blks_hit.help: "Обращения к страницам данных, обслуженные из буферов PostgreSQL, за секунду. Чем выше на фоне чтений, тем реже базе приходится ходить за данными наружу."
pg.field.blks_read.label: "Blocks read"
pg.field.blks_read.help: "Страницы данных, которых не оказалось в буферах PostgreSQL, за секунду. Часть таких чтений обслуживает кэш операционной системы, так что это не обязательно диск; устойчивый рост означает, что данные перестали умещаться в буферах."
pg.field.tup_returned.label: "Tuples returned"
pg.field.tup_returned.help: "Сколько строк и записей индексов в секунду база перебирает, выполняя запросы. Это прочитанное, а не отданное клиентам: огромные значения при скромных результатах означают, что запросы перелопачивают лишнее."
pg.field.tup_fetched.label: "Tuples fetched"
pg.field.tup_fetched.help: "Живые строки таблиц, добытые через индексные обращения, за секунду. Большой разрыв с числом перебранных строк означает широкие проходы ради немногих нужных строк."
pg.field.tup_inserted.label: "Tuples inserted"
pg.field.tup_inserted.help: "Сколько строк в секунду добавляется в таблицы базы. Устойчиво высокий темп — это рост объёма и постоянная работа для очистки и контрольных точек."
pg.field.tup_updated.label: "Tuples updated"
pg.field.tup_updated.help: "Сколько строк в секунду меняется в таблицах базы. Каждое обновление оставляет старую версию строки: высокий темп кормит очистку, а когда она не успевает — раздувает таблицы."
pg.field.tup_deleted.label: "Tuples deleted"
pg.field.tup_deleted.help: "Сколько строк в секунду удаляется из таблиц базы. Удалённые версии остаются лежать до очистки: массовые удаления сами по себе места не освобождают."
pg.field.deadlocks.label: "Deadlocks"
pg.field.deadlocks.help: "Как часто транзакции запирают друг друга намертво и PostgreSQL обрывает одну из них. Каждый случай — оборванная транзакция и повтор работы; постоянный поток означает, что транзакции берут одни и те же строки в разном порядке."
pg.field.conflicts.label: "Recovery conflicts"
pg.field.conflicts.help: "Запросы на реплике, оборванные из-за столкновения с проигрыванием изменений с главного сервера. Растут, когда долгие чтения на реплике держат данные, которые главный уже изменил или вычистил."
pg.field.temp_files.label: "Temp files"
pg.field.temp_files.help: "Сколько рабочих файлов в секунду создают запросы, которым не хватило памяти на сортировки и соединения. Постоянный поток — признак тесной памяти на операцию или тяжёлых запросов, гоняющих данные через диск."
pg.field.temp_bytes.label: "Temp bytes"
pg.field.temp_bytes.help: "Объём, который запросы сбрасывают в рабочие файлы за секунду, не уместив промежуточные данные в памяти. Высокий поток давит на диски и означает, что памяти на операции системно не хватает."
pg.field.blk_read_time.label: "Block read time"
pg.field.blk_read_time.help: "Суммарные миллисекунды чтения блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.blk_write_time.label: "Block write time"
pg.field.blk_write_time.help: "Суммарные миллисекунды записи блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.sessions.label: "Sessions"
pg.field.sessions.help: "Сколько новых подключений к базе появляется за секунду. Высокий темп — признак работы без пула соединений: каждое подключение стоит запуска отдельного процесса."
pg.field.frozen_xid_age.label: "Frozen XID age"
pg.field.frozen_xid_age.help: "Возраст datfrozenxid базы данных у курсора, в транзакциях."
