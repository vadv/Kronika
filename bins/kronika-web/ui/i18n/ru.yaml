activity.plans.title: "Plans Activity"
activity.plans.title.help: "Ранжирование Plans за час. Ячейки показывают скорость за интервал; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор, выбор строки фильтрует Plans."
