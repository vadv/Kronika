activity.cut.cg_cpu: "CPU time"
activity.cut.cg_cpu.help: "Время CPU cgroup на секунду реального времени. Одна секунда в секунду равна одному занятому ядру. Итог за час — накопленное время CPU."
activity.cut.cg_throttled: "Throttled time"
