system.metric.health.label: "Состояние ОС"
system.metric.health.help: "Оценка от 0 до 100 по данным PSI CPU, памяти и I/O; чем она выше, тем меньше времени задачи ждали ресурсов. Сопоставьте её с использованием CPU, нагрузкой, доступной памятью и PSI."
system.metric.cpu_busy.label: "Использование CPU"
system.metric.cpu_busy.help: "Доля суммарного процессорного времени вне простоя и ожидания I/O. Сопоставьте значение с процессами, готовыми к выполнению, нагрузкой и PSI CPU."
system.metric.process_count.label: "Процессы"
system.metric.process_count.help: "Процессы в выбранный момент. Сопоставьте с числом готовых к выполнению, числом в непрерываемом ожидании и общим числом потоков."
system.metric.process_running.label: "Процессы, готовые к выполнению"
system.metric.process_running.help: "Процессы, готовые к выполнению, по данным Linux. Сопоставьте с использованием CPU, нагрузкой и ожиданием очереди."
system.metric.process_blocked.label: "Процессы в непрерываемом ожидании"
system.metric.process_blocked.help: "Процессы в непрерываемом ожидании — состояние D. Проверьте PSI I/O, задержку блочного I/O и работу устройств."
system.metric.process_threads.label: "Потоки процессов"
system.metric.process_threads.help: "Потоки наблюдаемых процессов. Сопоставьте с числом процессов, нагрузкой и переключениями контекста."
system.metric.process_context_switches.label: "Переключения контекста процессов"
system.metric.process_context_switches.help: "Добровольные и принудительные переключения контекста наблюдаемых процессов. Проверьте ожидание очереди, состояние и PSI CPU."
system.metric.process_run_delay.label: "Ожидание очереди на CPU"
system.metric.process_run_delay.help: "Время ожидания наблюдаемых процессов в очереди выполнения. Сопоставьте с числом готовых к выполнению процессов и PSI CPU."
system.metric.procs_running.label: "Процессы, готовые к выполнению"
system.metric.procs_running.help: "Число процессов, готовых к выполнению. Сопоставьте значение с использованием CPU, нагрузкой, процессами, готовыми к выполнению, и PSI CPU."
system.metric.procs_blocked.label: "Процессы в ожидании I/O"
system.metric.procs_blocked.help: "Число процессов, заблокированных в ожидании I/O. Проверьте PSI I/O, задержку процессов и работу устройств."
system.metric.context_switches.label: "Переключения контекста"
system.metric.context_switches.help: "Общее число переключений контекста с запуска системы. Сопоставьте значение с использованием CPU, нагрузкой, процессами, готовыми к выполнению, и PSI CPU."
system.metric.load1.label: "Нагрузка 1 мин"
system.metric.load1.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за одну минуту. Сопоставьте значение с другими интервалами нагрузки, числом готовых процессов и использованием CPU."
system.metric.load5.label: "Нагрузка 5 мин"
system.metric.load5.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пять минут. Сопоставьте значение с интервалами в одну и пятнадцать минут."
system.metric.load15.label: "Нагрузка 15 мин"
system.metric.load15.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пятнадцать минут. Сопоставьте значение с более короткими интервалами."
system.metric.runnable.label: "Задачи, готовые к выполнению"
system.metric.runnable.help: "Число задач, готовых к выполнению в текущий момент. Сопоставьте значение с другими интервалами нагрузки, числом готовых процессов и использованием CPU."
system.metric.tasks.label: "Всего задач"
system.metric.tasks.help: "Общее число задач, известных планировщику ядра. Сопоставьте значение с другими интервалами нагрузки, числом готовых процессов и использованием CPU."
system.metric.mem_available_percent.label: "Доступно памяти"
system.metric.mem_available_percent.help: "Оценка ядра для объёма памяти, доступного новым задачам, в процентах от общей памяти. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.mem_available.label: "Доступная память"
system.metric.mem_available.help: "Оценка ядра для объёма памяти, доступного новым задачам без подкачки. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.mem_total.label: "Всего памяти"
system.metric.mem_total.help: "Общий объём физической памяти, доступной системе. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.cached.label: "Страничный кэш"
system.metric.cached.help: "Память, занятая страничным кэшем файлов. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.swap_free.label: "Свободная подкачка"
system.metric.swap_free.help: "Свободное пространство подкачки. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.swap_total.label: "Объём подкачки"
system.metric.swap_total.help: "Общий настроенный объём пространства подкачки. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.process_resident.label: "RSS процессов"
system.metric.process_resident.help: "Резидентная память наблюдаемых процессов. Сопоставьте с доступной и виртуальной памятью процессов и PSI памяти."
system.metric.process_virtual.label: "Виртуальная память процессов"
system.metric.process_virtual.help: "Виртуальная память наблюдаемых процессов. Сопоставьте с RSS и подкачкой процессов."
system.metric.process_swap.label: "Подкачка процессов"
system.metric.process_swap.help: "Подкачка, занятая наблюдаемыми процессами. Сопоставьте со свободной подкачкой, RSS процессов и PSI памяти."
system.metric.process_minor_faults.label: "Minor faults процессов"
system.metric.process_minor_faults.help: "Minor faults наблюдаемых процессов. Сопоставьте с RSS процессов и счётчиком major faults."
system.metric.process_major_faults.label: "Major faults процессов"
system.metric.process_major_faults.help: "Major faults наблюдаемых процессов. Сопоставьте с RSS, чтением устройств и PSI памяти."
system.metric.oom_kill.label: "Завершения при нехватке памяти"
system.metric.oom_kill.help: "Общее число процессов, которые ядро завершило из-за нехватки памяти с момента запуска системы. Сопоставьте значение с доступной памятью, подкачкой, счётчиком major faults и PSI памяти."
system.metric.cpu_pressure.label: "PSI CPU 10 с"
system.metric.cpu_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала CPU. Сопоставьте значение с использованием CPU, числом готовых процессов и ожиданием очереди."
system.metric.memory_pressure.label: "PSI памяти 10 с"
system.metric.memory_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала доступа к памяти. Сопоставьте значение с доступной памятью, подкачкой и счётчиком major faults."
system.metric.io_pressure.label: "PSI I/O 10 с"
system.metric.io_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала I/O. Сопоставьте значение с числом процессов в непрерываемом ожидании, I/O процессов и работой устройств."
system.metric.filesystem_free_min.label: "Минимум свободного места"
system.metric.filesystem_free_min.help: "Наименьшая доля свободного места среди наблюдаемых локальных файловых систем. Проверьте свободное место, I/O процессов, работу устройств и PSI I/O вместе."
system.metric.process_read.label: "Чтение процессов"
system.metric.process_read.help: "Байты, прочитанные наблюдаемыми процессами с накопителей. Сопоставьте с задержкой I/O, PSI I/O и чтением устройств."
system.metric.process_write.label: "Запись процессов"
system.metric.process_write.help: "Байты, записанные наблюдаемыми процессами на накопители. Сопоставьте с задержкой I/O, PSI I/O и записью устройств."
system.metric.process_block_delay.label: "Задержка I/O процессов"
system.metric.process_block_delay.help: "Задержка блочного I/O наблюдаемых процессов. Сопоставьте с чтением и записью процессов, PSI I/O и активными операциями устройств."
system.metric.device_count.label: "Блочные устройства"
system.metric.device_count.help: "Блочные устройства в выбранный момент. Проверьте активные операции I/O и таблицу устройств."
system.metric.device_active_io.label: "Активные операции устройств"
system.metric.device_active_io.help: "Операции I/O, которые сейчас выполняют блочные устройства. Проверьте чтение, запись и PSI I/O."
system.metric.filesystem_count.label: "Файловые системы"
system.metric.filesystem_count.help: "Смонтированные файловые системы в выбранный момент. Проверьте минимум свободного места и таблицу точек монтирования."
system.metric.interface_count.label: "Интерфейсы"
system.metric.interface_count.help: "Сетевые интерфейсы в выбранный момент. Проверьте приём, передачу, ошибки и отброшенные пакеты."
system.metric.network_rx.label: "Получено"
system.metric.network_rx.help: "Байты, полученные сетевыми интерфейсами. Сопоставьте с переданными байтами, ошибками и отброшенными пакетами."
system.metric.network_tx.label: "Передано"
system.metric.network_tx.help: "Байты, переданные сетевыми интерфейсами. Сопоставьте с полученными байтами, ошибками и отброшенными пакетами."
system.metric.network_errors.label: "Ошибки сети"
system.metric.network_errors.help: "Ошибки приёма и передачи сетевых интерфейсов. Проверьте трафик и отброшенные пакеты по интерфейсам."
system.metric.network_drops.label: "Отброшенные пакеты"
system.metric.network_drops.help: "Входящие и исходящие пакеты, отброшенные интерфейсами. Проверьте трафик, ошибки и таблицу интерфейсов."
