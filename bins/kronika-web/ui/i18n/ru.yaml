activity.plans.totals.help: "Сумма за каждый интервал и весь час по всем Plans, включая строки вне ранжирования."
activity.tables.title: "Tables Activity"
activity.tables.title.help: "Ранжирование Tables за час с 12 пятиминутными ячейками. Ячейки показывают скорость или последнее значение; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор, выбор строки фильтрует Tables."
