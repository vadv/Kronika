col.pid.label: "PID"
col.pid.help: "Идентификатор процесса Linux у курсора."
col.command.label: "Команда"
col.command.help: "Полная командная строка процесса с аргументами у курсора."
col.state.label: "Состояние"
col.state.help: "Состояние процесса Linux у курсора, например R, S, D или Z."
col.ppid.label: "PPID"
col.ppid.help: "Идентификатор родительского процесса у курсора."
col.uid.label: "UID"
col.uid.help: "Идентификатор реального пользователя процесса у курсора."
col.euid.label: "EUID"
col.euid.help: "Идентификатор эффективного пользователя для проверки прав у курсора."
col.gid.label: "GID"
col.gid.help: "Идентификатор реальной группы процесса у курсора."
col.egid.label: "EGID"
col.egid.help: "Идентификатор эффективной группы для проверки прав у курсора."
col.threads.label: "Потоки"
col.threads.help: "Число потоков процесса у курсора."
col.tty.label: "TTY"
col.tty.help: "Идентификатор управляющего терминала процесса у курсора."
col.nice.label: "Nice"
col.nice.help: "Поправка к обычному приоритету планировщика у курсора; положительные значения понижают приоритет процесса, отрицательные повышают."
col.prio.label: "Приоритет"
col.prio.help: "Приоритет процесса в планировщике Linux у курсора."
col.rtprio.label: "RT-приоритет"
col.rtprio.help: "Приоритет процесса для планирования реального времени у курсора."
col.policy.label: "Политика"
col.policy.help: "Числовой код политики планировщика Linux у курсора."
col.curcpu.label: "CPU"
col.curcpu.help: "Логический процессор, на котором процесс выполнялся последним или выполняется у курсора."
col.utime.label: "Время CPU в пользовательском режиме"
col.utime.help: "Среднее потребление процессора в пользовательском режиме за интервал, в ядрах; 1 означает одно полностью занятое ядро."
col.stime.label: "Время CPU в режиме ядра"
col.stime.help: "Среднее потребление процессора в режиме ядра за интервал, в ядрах; 1 означает одно полностью занятое ядро."
col.rundelay.label: "Задержка выполнения"
col.rundelay.help: "Прирост времени ожидания в очереди выполнения с учётом сброса, делённый на длительность интервала, в мс/с."
col.blkdelay.label: "Задержка блочного I/O"
col.blkdelay.help: "Прирост задержки блочного ввода-вывода с учётом сброса, делённый на длительность интервала, в тиках/с."
col.nvcsw.label: "Добровольные переключения контекста"
col.nvcsw.help: "Прирост числа добровольных переключений контекста с учётом сброса, делённый на длительность интервала, в переключениях/с."
col.nivcsw.label: "Принудительные переключения контекста"
col.nivcsw.help: "Прирост числа принудительных переключений контекста с учётом сброса, делённый на длительность интервала, в переключениях/с."
col.minflt.label: "Minor page faults"
col.minflt.help: "Прирост числа ошибок страниц, устранённых без обращения к накопителю, с учётом сброса, делённый на длительность интервала, в ошибках/с."
col.majflt.label: "Major page faults"
col.majflt.help: "Прирост числа ошибок страниц, потребовавших чтения с накопителя, с учётом сброса, делённый на длительность интервала, в ошибках/с."
col.vmem.label: "Виртуальная память"
col.vmem.help: "Размер виртуального адресного пространства процесса у курсора, отображаемый в байтах."
col.rmem.label: "Резидентная память"
col.rmem.help: "Объём физической памяти, занятый процессом у курсора, отображаемый в байтах."
col.vswap.label: "Swap"
col.vswap.help: "Объём пространства подкачки, занятый процессом у курсора, отображаемый в байтах."
col.syscr.label: "Вызовы чтения"
col.syscr.help: "Прирост числа системных вызовов чтения с учётом сброса, делённый на длительность интервала, в вызовах/с."
col.syscw.label: "Вызовы записи"
col.syscw.help: "Прирост числа системных вызовов записи с учётом сброса, делённый на длительность интервала, в вызовах/с."
col.rchar.label: "Прочитано с кэшем"
col.rchar.help: "Прирост числа байтов в вызовах чтения, включая попадания в страничный кэш с учётом сброса, делённый на длительность интервала, в байтах/с."
col.wchar.label: "Записано с кэшем"
col.wchar.help: "Прирост числа байтов в вызовах записи, включая запись в страничный кэш с учётом сброса, делённый на длительность интервала, в байтах/с."
col.read_bytes.label: "Прочитано с диска"
col.read_bytes.help: "Прирост числа байтов, прочитанных с накопителя с учётом сброса, делённый на длительность интервала, в байтах/с."
col.write_bytes.label: "Записано на диск"
col.write_bytes.help: "Прирост числа байтов, записанных на накопитель с учётом сброса, делённый на длительность интервала, в байтах/с."
col.cancelled_write.label: "Отменённая запись"
col.cancelled_write.help: "Прирост числа байтов, ожидавших записи и отменённых за интервал с учётом сброса, делённый на длительность интервала, в байтах/с."
col.exit_signal.label: "Сигнал выхода"
col.exit_signal.help: "Сигнал, настроенный для отправки родительскому процессу при завершении процесса, у курсора."
