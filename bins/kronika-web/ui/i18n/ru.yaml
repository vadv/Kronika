pg.field.tup_returned.label: "Tuples returned"
pg.field.tup_returned.help: "Сколько строк и записей индексов в секунду база перебирает, выполняя запросы. Это прочитанное, а не отданное клиентам: огромные значения при скромных результатах означают, что запросы перелопачивают лишнее."
pg.field.tup_fetched.label: "Tuples fetched"
pg.field.tup_fetched.help: "Живые строки таблиц, добытые через индексные обращения, за секунду. Большой разрыв с числом перебранных строк означает широкие проходы ради немногих нужных строк."
pg.field.tup_inserted.label: "Tuples inserted"
pg.field.tup_inserted.help: "Сколько строк в секунду добавляется в таблицы базы. Устойчиво высокий темп — это рост объёма и постоянная работа для очистки и контрольных точек."
pg.field.tup_updated.label: "Tuples updated"
pg.field.tup_updated.help: "Сколько строк в секунду меняется в таблицах базы. Каждое обновление оставляет старую версию строки: высокий темп кормит очистку, а когда она не успевает — раздувает таблицы."
pg.field.tup_deleted.label: "Tuples deleted"
pg.field.tup_deleted.help: "Сколько строк в секунду удаляется из таблиц базы. Удалённые версии остаются лежать до очистки: массовые удаления сами по себе места не освобождают."
pg.field.deadlocks.label: "Deadlocks"
pg.field.deadlocks.help: "Как часто транзакции запирают друг друга намертво и PostgreSQL обрывает одну из них. Каждый случай — оборванная транзакция и повтор работы; постоянный поток означает, что транзакции берут одни и те же строки в разном порядке."
pg.field.conflicts.label: "Recovery conflicts"
pg.field.conflicts.help: "Запросы на реплике, оборванные из-за столкновения с проигрыванием изменений с главного сервера. Растут, когда долгие чтения на реплике держат данные, которые главный уже изменил или вычистил."
pg.field.temp_files.label: "Temp files"
pg.field.temp_files.help: "Сколько рабочих файлов в секунду создают запросы, которым не хватило памяти на сортировки и соединения. Постоянный поток — признак тесной памяти на операцию или тяжёлых запросов, гоняющих данные через диск."
pg.field.temp_bytes.label: "Temp bytes"
pg.field.temp_bytes.help: "Объём, который запросы сбрасывают в рабочие файлы за секунду, не уместив промежуточные данные в памяти. Высокий поток давит на диски и означает, что памяти на операции системно не хватает."
pg.field.blk_read_time.label: "Block read time"
pg.field.blk_read_time.help: "Суммарные миллисекунды чтения блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.blk_write_time.label: "Block write time"
pg.field.blk_write_time.help: "Суммарные миллисекунды записи блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.sessions.label: "Sessions"
pg.field.sessions.help: "Сколько новых подключений к базе появляется за секунду. Высокий темп — признак работы без пула соединений: каждое подключение стоит запуска отдельного процесса."
pg.field.frozen_xid_age.label: "Frozen XID age"
pg.field.frozen_xid_age.help: "Возраст datfrozenxid базы данных у курсора, в транзакциях."
