system.metric.health.label: "Состояние ОС"
system.metric.health.help: "Оценка от 0 до 100 по времени ожидания процессора, памяти и ввода-вывода: чем она выше, тем меньше задачи ждали ресурсов."
system.metric.cpu_used_cores.label: "Использовано CPU хоста"
system.metric.cpu_used_cores.help: "Средняя занятость процессоров хоста между снимками в эквивалентных ядрах; простой и ожидание ввода-вывода не учитываются."
system.metric.cpu_capacity.label: "Логические CPU хоста"
system.metric.cpu_capacity.help: "Число активных логических процессоров хоста у курсора; это не квота контейнера."
system.metric.cpu_user.label: "Пользовательский CPU хоста"
system.metric.cpu_user.help: "Доля времени процессоров хоста в пользовательском режиме, включая задачи с пониженным приоритетом, между снимками."
system.metric.cpu_system.label: "Системный CPU хоста"
system.metric.cpu_system.help: "Доля времени процессоров хоста в системном режиме ядра между снимками."
system.metric.cpu_irq.label: "Прерывания CPU хоста"
system.metric.cpu_irq.help: "Доля времени процессоров хоста на обработку аппаратных и программных прерываний между снимками."
system.metric.cpu_iowait.label: "Ожидание I/O на хосте"
system.metric.cpu_iowait.help: "Доля времени процессоров хоста, которую ядро отнесло к ожиданию ввода-вывода; она показана отдельно и не считается работой процессора."
system.metric.cpu_steal.label: "Отнято гипервизором"
system.metric.cpu_steal.help: "Доля времени процессоров хоста, которую гипервизор отдал другой виртуальной машине между снимками."
system.metric.cpu_idle.label: "Простой CPU хоста"
system.metric.cpu_idle.help: "Доля времени простоя процессоров хоста между снимками."
system.metric.procs_running.label: "Процессы, готовые к выполнению"
system.metric.procs_running.help: "Число процессов, готовых к выполнению."
system.metric.procs_blocked.label: "Процессы в ожидании I/O"
system.metric.procs_blocked.help: "Число процессов, заблокированных в ожидании ввода-вывода."
system.metric.context_switches.label: "Переключения контекста"
system.metric.context_switches.help: "Общее число переключений контекста с запуска системы."
system.metric.load1.label: "Нагрузка 1 мин"
system.metric.load1.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за одну минуту."
system.metric.load5.label: "Нагрузка 5 мин"
system.metric.load5.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пять минут."
system.metric.load15.label: "Нагрузка 15 мин"
system.metric.load15.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пятнадцать минут."
system.metric.runnable.label: "Задачи, готовые к выполнению"
system.metric.runnable.help: "Число задач, готовых к выполнению в текущий момент."
system.metric.tasks.label: "Всего задач"
system.metric.tasks.help: "Общее число задач, известных планировщику ядра."
system.metric.mem_available.label: "Доступно памяти хоста"
system.metric.mem_available.help: "Оценка ядра для памяти хоста, доступной новым задачам без подкачки; она пересекается с освобождаемыми категориями и не складывается с ними."
system.metric.mem_total.label: "Ёмкость памяти хоста"
system.metric.mem_total.help: "Полный объём доступной физической памяти хоста; это не лимит контейнера."
system.metric.mem_anon.label: "Анонимная память"
system.metric.mem_anon.help: "Память хоста с анонимными страницами, включая кучи и стеки приложений."
system.metric.mem_file_cache.label: "Файловый кэш"
system.metric.mem_file_cache.help: "Файловый кэш хоста вместе с буферами блочных устройств; кэши служебных структур ядра сюда не входят."
system.metric.mem_s_reclaimable.label: "Slab reclaimable"
system.metric.mem_s_reclaimable.help: "Кэши служебных структур ядра, которые оно может освободить при нехватке памяти."
system.metric.mem_s_unreclaim.label: "Slab unreclaimable"
system.metric.mem_s_unreclaim.help: "Кэши служебных структур ядра, которые сейчас нельзя освободить."
system.metric.mem_free.label: "Свободная память"
system.metric.mem_free.help: "Полностью неиспользуемая физическая память хоста."
system.metric.mem_other.label: "Прочая память хоста"
system.metric.mem_other.help: "Остаток общей памяти хоста после вычета анонимной памяти, файлового кэша с буферами, кэшей служебных структур ядра и свободной памяти."
system.metric.swap_free.label: "Swap free"
system.metric.swap_free.help: "Свободное пространство подкачки."
system.metric.swap_total.label: "Swap total"
system.metric.swap_total.help: "Общий настроенный объём пространства подкачки."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Общее число процессов, которые ядро завершило из-за нехватки памяти с момента запуска системы."
system.metric.cpu_pressure.label: "PSI CPU, 10 с"
system.metric.cpu_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала процессора."
system.metric.memory_pressure.label: "PSI памяти, 10 с"
system.metric.memory_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала доступа к памяти."
system.metric.io_pressure.label: "PSI I/O, 10 с"
system.metric.io_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача хоста ждала ввода-вывода; это не задержка устройства."
system.metric.filesystem_free_min.label: "Минимум свободного места"
system.metric.filesystem_free_min.help: "Наименьшая доля свободного места среди наблюдаемых локальных файловых систем."
system.metric.device_count.label: "Блочные устройства"
system.metric.device_count.help: "Блочные устройства в выбранный момент."
system.metric.device_active_io.label: "Активные операции устройств"
system.metric.device_active_io.help: "Операции ввода-вывода, которые сейчас выполняют блочные устройства."
system.metric.filesystem_count.label: "Файловые системы"
system.metric.filesystem_count.help: "Смонтированные файловые системы в выбранный момент."
system.metric.interface_count.label: "Интерфейсы"
system.metric.interface_count.help: "Сетевые интерфейсы в выбранный момент."
system.metric.network_rx.label: "Получено"
system.metric.network_rx.help: "Байты, полученные сетевыми интерфейсами."
system.metric.network_tx.label: "Передано"
system.metric.network_tx.help: "Байты, переданные сетевыми интерфейсами."
system.metric.network_errors.label: "Ошибки сети"
system.metric.network_errors.help: "Ошибки приёма и передачи сетевых интерфейсов."
system.metric.network_drops.label: "Отброшенные пакеты"
system.metric.network_drops.help: "Входящие и исходящие пакеты, отброшенные интерфейсами."
