pg.help.relation.scan_rate: "Прирост числа сканирований между снимками с учётом сброса, делённый на длительность интервала, в сканированиях/с."
pg.help.relation.index_entries_rate: "Прирост числа записей индекса, возвращённых сканированиями, между снимками с учётом сброса, делённый на длительность интервала, в записях/с; это не строки таблицы."
pg.help.relation.rows_fetched_rate: "Прирост числа живых строк таблицы, полученных простыми индексными сканированиями, между снимками с учётом сброса, делённый на длительность интервала, в строках/с."
pg.help.relation.maintenance_rate: "Прирост числа операций между снимками с учётом сброса, делённый на длительность интервала, в операциях/с."
pg.help.relation.per_scan: "Прирост строк или записей / прирост сканирований, в элементах на сканирование; без сканирований недоступно."
pg.help.relation.dml_share: "Прирост числа указанных операций, делённый на сумму приростов вставок, обновлений и удалений за интервал, в процентах."
pg.help.relation.row_estimate: "Оценка PostgreSQL для числа строк с указанным условием после обслуживания у курсора."
pg.help.relation.maintenance_mean: "Прирост времени обслуживания / прирост операций, в мс/операцию; PostgreSQL 18+, без операций недоступно."
pg.help.relation.buffer_hit: "Прирост попаданий / сумму приростов попаданий и чтений, в процентах; для групп суммируются исходные величины. Чтения — промахи в буферах PostgreSQL, не обязательно физический I/O."
pg.help.relation.last_scan: "Время последнего соответствующего сканирования, известное у курсора. Поле доступно начиная с PostgreSQL 16."
pg.help.relation.last_maintenance: "Время последней указанной операции обслуживания, известное у курсора."
pg.help.relation.oldest_timestamp: "Самая ранняя непустая отметка времени среди объектов группы у курсора."
pg.help.relation.latest_timestamp: "Самая поздняя непустая отметка времени среди объектов группы у курсора."
pg.help.relation.never_count: "Число применимых объектов без записанной отметки времени указанной операции у курсора."
pg.help.relation.toast_never_count: "Число таблиц с отношением TOAST, для которого у курсора не записано время автоочистки TOAST."
pg.help.relation.index_state_count: "Число индексов группы, для которых указанное состояние pg_index истинно у курсора."
pg.help.relation.tuple_throughput: "Прирост последовательно прочитанных и полученных по индексу строк / длительность интервала, в строках/с."
pg.help.relation.sequential_share: "Прирост последовательных сканирований / общий прирост сканирований, в процентах; для групп суммируются исходные величины. Без сканирований недоступно."
pg.help.relation.dml_total: "Сумма приростов вставок, обновлений и удалений с учётом сброса счётчиков, делённая на длительность интервала, в строках/с."
pg.help.relation.hot_share: "Прирост числа HOT-обновлений, делённый на прирост всех обновлений за интервал, в процентах. Значение недоступно без обновлений."
pg.help.relation.new_page_share: "Прирост обновлений с новой версией строки на другой странице / прирост обновлений, в процентах; PostgreSQL 16+."
pg.help.relation.dead_share: "Оценка числа мёртвых строк PostgreSQL, делённая на сумму оценок живых и мёртвых строк у курсора, в процентах; для групп суммируются исходные оценки."
pg.help.relation.displayed_storage: "Сумма размера основного слоя таблицы и полного размера отношения TOAST у курсора. Обычные индексы и другие слои таблицы не входят."
pg.help.relation.table_data: "Размер основного слоя таблицы по данным pg_relation_size у курсора, в байтах."
pg.help.relation.index_data: "Размер основного слоя индекса по данным pg_relation_size у курсора, в байтах."
pg.help.relation.toast_share: "Размер TOAST, делённый на сумму размеров основного слоя таблицы и TOAST у курсора, в процентах."
pg.help.relation.reltuples: "Оценка планировщика pg_class.reltuples у курсора, в строках; -1 означает отсутствие оценки."
pg.help.relation.toast_dead_share: "Оценка числа мёртвых строк TOAST, делённая на сумму оценок живых и мёртвых строк TOAST у курсора, в процентах."
pg.help.relation.xid_age: "Возраст relfrozenxid у курсора, в транзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.mxid_age: "Возраст relminmxid у курсора, в мультитранзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.no_scans: "Показывает, равен ли нулю точный прирост числа индексных сканирований за интервал. Недоступный интервал не считается нулевым."
pg.help.relation.no_scan_count: "Число индексов группы с точным нулевым приростом сканирований за интервал."
pg.help.relation.known_scan_count: "Число индексов группы с ненулевым приростом сканирований за интервал."
pg.help.relation.indisvalid: "Показывает, помечен ли индекс в pg_index как пригодный для запросов у курсора."
pg.help.relation.indisready: "Показывает, помечен ли индекс в pg_index как готовый принимать новые вставки у курсора."
pg.help.relation.indisprimary: "Показывает, обеспечивает ли индекс ограничение первичного ключа по данным pg_index у курсора."
pg.help.relation.indisunique: "Показывает, обеспечивает ли индекс уникальность по данным pg_index у курсора."
pg.help.relation.indisexclusion: "Показывает, обеспечивает ли индекс ограничение-исключение по данным pg_index у курсора."
