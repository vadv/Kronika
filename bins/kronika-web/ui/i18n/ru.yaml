pg.leader_pid.label: "PID ведущего процесса"
pg.leader_pid.help: "Идентификатор ведущего процесса группы параллельных рабочих процессов. Проверьте тип, состояние, событие ожидания и запрос процесса с тем же PID."
pg.datname.label: "База данных"
pg.datname.help: "База данных процесса. Проверьте роль, состояние, ожидание и запрос."
pg.usename.label: "Роль"
pg.usename.help: "Роль PostgreSQL. Проверьте базу данных, приложение и запрос."
pg.application_name.label: "Приложение"
pg.application_name.help: "Имя приложения от клиента. Проверьте роль, адрес и запрос."
pg.client_addr.label: "Адрес клиента"
pg.client_addr.help: "IP-адрес клиента; у локального соединения его нет. Проверьте приложение и роль."
pg.backend_type.label: "Тип процесса"
pg.backend_type.help: "Тип процесса PostgreSQL: клиентский, autovacuum и другие. Проверьте состояние и ожидание."
pg.activity.system: "Системные"
pg.activity.idle: "Простой"
pg.state.label: "Состояние"
pg.state.help: "Состояние процесса. Проверьте время транзакции, запроса и ожидание."
pg.wait_event_type.label: "Класс ожидания"
pg.wait_event_type.help: "Класс ожидания. Проверьте событие, состояние и запрос."
pg.wait_event.label: "Событие ожидания"
pg.wait_event.help: "Текущее ожидание. Проверьте его класс, состояние и запрос."
pg.query.label: "Запрос"
pg.query.help: "Текущий запрос активного процесса или последний запрос неактивного. Проверьте состояние и время выполнения."
pg.query_id.label: "ID запроса"
pg.query_id.help: "ID запроса PostgreSQL, если включено его вычисление. Проверьте текст запроса."
pg.backend_xid_age.label: "Возраст XID"
pg.backend_xid_age.help: "Возраст XID процесса, в транзакциях. Проверьте время транзакции и состояние."
pg.backend_xmin_age.label: "Возраст xmin"
pg.backend_xmin_age.help: "Возраст горизонта xmin, в транзакциях. Проверьте долгие транзакции и vacuum."
pg.backend_start.label: "Процесс запущен"
pg.backend_start.help: "Время запуска процесса PostgreSQL. Проверьте состояние и начало транзакции."
pg.xact_start.label: "Транзакция начата"
pg.xact_start.help: "Время начала текущей транзакции. Проверьте состояние, запрос и возраст xmin."
pg.query_start.label: "Запрос начат"
pg.query_start.help: "Начало текущего запроса или последнего запроса неактивного процесса. Проверьте состояние и время выполнения."
pg.state_change.label: "Состояние изменено"
pg.state_change.help: "Время последнего изменения состояния процесса. Проверьте текущее состояние и ожидание."
pg.field.queryid.label: "ID запроса"
pg.field.queryid.help: "ID запроса, записанный для этого плана. В vadv это собственный идентификатор расширения. Проверьте его вместе с ID и текстом плана."
pg.field.planid.label: "ID плана"
pg.field.planid.help: "ID плана, присвоенный pg_store_plans на этом сервере PostgreSQL. Проверьте его вместе с ID запроса, базой, ролью и текстом плана."
pg.field.dbid.label: "ID базы данных"
pg.field.dbid.help: "OID базы данных, в которой выполнялся запрос или план. Проверьте вызовы, время исполнения и строки той же сущности."
pg.field.userid.label: "ID роли"
pg.field.userid.help: "OID роли, от имени которой выполнялся запрос или план. Проверьте вызовы, время исполнения и строки той же сущности."
pg.field.toplevel.label: "Верхний уровень"
pg.field.toplevel.help: "Выполнялся ли запрос на верхнем уровне, а не внутри другого запроса. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.datname.label: "База данных"
pg.field.datname.help: "База данных запроса или плана. Проверьте её ID, вызовы, время исполнения и строки."
pg.field.usename.label: "Роль"
pg.field.usename.help: "Роль PostgreSQL для запроса или плана. Проверьте её ID, вызовы, время исполнения и строки."
pg.field.query.label: "Запрос"
pg.field.query.help: "Текст запроса, записанный PostgreSQL. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.plan.label: "План"
pg.field.plan.help: "Текст плана из pg_store_plans. Проверьте его вместе с ID плана и запроса, вызовами и временем исполнения."
pg.field.calls.label: "Вызовы"
pg.field.calls.help: "Выполнения запроса или плана; в таблице показана точная интервальная скорость. Сопоставьте вызовы со временем исполнения и строками."
pg.field.calls_per_second.label: "Вызовы/с"
pg.field.calls_per_second.help: "Точный прирост вызовов, делённый на секунды интервала. Сопоставьте со временем исполнения и строками/с; прочерк означает, что интервал не вычислен."
pg.field.execution_ms_per_second.label: "Время исполнения, мс/с"
pg.field.execution_ms_per_second.help: "Суммарное время исполнения запросов PostgreSQL за секунду реального времени, а не время CPU. Сопоставьте с вызовами/с и средним временем вызова."
pg.field.mean_exec_ms_per_call.label: "Среднее, мс/вызов"
pg.field.mean_exec_ms_per_call.help: "Среднее время исполнения одного вызова за выбранный интервал. Сопоставьте с вызовами/с и временем исполнения, мс/с."
pg.table.cursor: "Курсор: {time}"
pg.table.interval: "Интервал расчёта: {from} → {to}"
pg.table.intervals: "Интервалы расчёта: {intervals}"
pg.table.interval_unavailable: "Интервал расчёта: нет данных"
pg.table.filter: "Фильтр: {pattern}"
pg.table.no_filter: "Фильтр: нет"
pg.table.order: "Сортировка на сервере: {semantic} ({physical}), {direction}"
pg.table.order_default: "Сортировка на сервере: не задана"
pg.table.desc: "по убыванию"
pg.table.shown: "Показано {returned} из {eligible}; лимит — {limit}"
pg.table.first_limit: "Первые {returned}; лимит выборки — {limit}"
pg.field.rows_per_call.label: "Строки/вызов"
pg.field.rows_per_call.help: "Интервальные строки/с, делённые на вызовы/с. Сопоставьте со временем выполнения и текстом запроса."
pg.field.blocks_per_call.label: "Блоки/вызов"
pg.field.blocks_per_call.help: "Попадания и чтения общих и локальных буферов на один вызов. Проверьте рядом долю попаданий и время чтения."
pg.field.hit_pct.label: "Попадания в кэш"
pg.field.hit_pct.help: "Доля обращений к общим буферам без чтения. Проверьте попадания, чтения и время чтения."
pg.field.wal_per_call.label: "WAL/вызов"
pg.field.wal_per_call.help: "Интервальные байты WAL, делённые на вызовы/с. Проверьте вместе байты, записи WAL и вызовы."
pg.field.plan_time_pct.label: "Доля планирования"
pg.field.plan_time_pct.help: "Доля планирования в сумме времени планирования и выполнения. Проверьте рядом планирование, выполнение и вызовы."
pg.field.cv.label: "CV"
pg.field.cv.help: "Стандартное отклонение времени выполнения, делённое на среднее. Проверьте рядом минимум, максимум и число вызовов."
pg.field.min_exec_time_ms.label: "Минимум, мс"
pg.field.min_exec_time_ms.help: "Наименьшее время выполнения за этот период статистики. Сопоставьте со средним, максимумом и числом вызовов."
pg.field.max_exec_time_ms.label: "Максимум, мс"
pg.field.max_exec_time_ms.help: "Наибольшее время выполнения за этот период статистики. Сопоставьте со средним, минимумом и числом вызовов."
pg.field.mean_exec_time_ms.label: "Среднее, мс"
pg.field.mean_exec_time_ms.help: "Среднее время выполнения за этот период статистики. Сопоставьте с интервальным средним, диапазоном и вызовами."
pg.field.stddev_exec_time_ms.label: "Отклонение, мс"
pg.field.stddev_exec_time_ms.help: "Стандартное отклонение времени выполнения за этот период статистики. Сопоставьте со средним, диапазоном и вызовами."
pg.field.first_call.label: "Первый вызов"
pg.field.first_call.help: "Время первого вызова плана, записанное расширением. Сопоставьте с последним вызовом и выбранным часом."
pg.field.last_call.label: "Последний вызов"
pg.field.last_call.help: "Время последнего вызова плана, записанное расширением. Сопоставьте с первым вызовом и выбранным часом."
pg.field.rows_per_second.label: "Строки/с"
pg.field.rows_per_second.help: "Точный прирост строк, делённый на секунды интервала. Сопоставьте с вызовами/с и нагрузкой выполнения; прочерк означает, что интервал не вычислен."
pg.field.planning_ms_per_second.label: "Планирование, мс/с"
pg.field.planning_ms_per_second.help: "Точный прирост миллисекунд планирования, делённый на секунды интервала. Сопоставьте с нагрузкой выполнения, вызовами/с и числом планирований."
pg.field.shared_blk_read_ms_per_second.label: "Чтение общих, мс/с"
pg.field.shared_blk_read_ms_per_second.help: "Миллисекунды чтения общих блоков в секунду либо всех блоков, если раскладка не разделяет время. Сопоставьте с прочитанными блоками и вызовами/с."
pg.field.shared_blk_write_ms_per_second.label: "Запись общих, мс/с"
pg.field.shared_blk_write_ms_per_second.help: "Миллисекунды записи общих блоков в секунду либо всех блоков, если раскладка не разделяет время. Сопоставьте с записанными блоками и вызовами/с."
pg.field.local_blk_read_ms_per_second.label: "Чтение локальных, мс/с"
pg.field.local_blk_read_ms_per_second.help: "Миллисекунды чтения локальных блоков в секунду, если они есть в физической раскладке. Сопоставьте с локальными блоками и вызовами/с."
pg.field.local_blk_write_ms_per_second.label: "Запись локальных, мс/с"
pg.field.local_blk_write_ms_per_second.help: "Миллисекунды записи локальных блоков в секунду, если они есть в физической раскладке. Сопоставьте с локальными блоками и вызовами/с."
pg.field.temp_blk_read_ms_per_second.label: "Чтение временных, мс/с"
pg.field.temp_blk_read_ms_per_second.help: "Миллисекунды чтения временных блоков в секунду, если они есть в физической раскладке. Сопоставьте с временными блоками и вызовами/с."
pg.field.temp_blk_write_ms_per_second.label: "Запись временных, мс/с"
pg.field.temp_blk_write_ms_per_second.help: "Миллисекунды записи временных блоков в секунду, если они есть в физической раскладке. Сопоставьте с временными блоками и вызовами/с."
pg.field.total_exec_time.label: "Общее время выполнения"
pg.field.total_exec_time.help: "Общее время выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.mean_exec_time.label: "Среднее время выполнения"
pg.field.mean_exec_time.help: "Среднее время одного выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.max_exec_time.label: "Максимальное время выполнения"
pg.field.max_exec_time.help: "Наибольшее время одного выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.rows.label: "Строки"
pg.field.rows.help: "Строки, полученные или изменённые запросом либо планом; в таблице показана точная интервальная скорость. Сопоставьте строки с вызовами и нагрузкой выполнения."
pg.field.shared_blks_hit.label: "Попадания общих блоков"
pg.field.shared_blks_hit.help: "Общие буферные блоки, найденные в кэше для запроса или плана. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.shared_blks_read.label: "Прочитано общих блоков"
pg.field.shared_blks_read.help: "Общие буферные блоки, прочитанные для запроса или плана. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.shared_blks_written.label: "Записано общих блоков"
pg.field.shared_blks_written.help: "Общие буферные блоки, записанные запросом или планом. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.shared_blks_dirtied.label: "Изменено общих блоков"
pg.field.shared_blks_dirtied.help: "Общие буферные блоки, изменённые запросом или планом. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.local_blks_hit.label: "Попадания локальных блоков"
pg.field.local_blks_hit.help: "Локальные буферные блоки, найденные в кэше для запроса или плана. Сопоставьте соседние счётчики общих, локальных и временных блоков."
pg.field.local_blks_read.label: "Прочитано локальных блоков"
pg.field.local_blks_read.help: "Локальные буферные блоки, прочитанные для запроса или плана. Сопоставьте соседние счётчики общих, локальных и временных блоков."
pg.field.local_blks_dirtied.label: "Изменено локальных блоков"
pg.field.local_blks_dirtied.help: "Локальные буферные блоки, изменённые запросом или планом. Сопоставьте соседние счётчики общих, локальных и временных блоков."
pg.field.local_blks_written.label: "Записано локальных блоков"
pg.field.local_blks_written.help: "Локальные буферные блоки, записанные запросом или планом. Сопоставьте соседние счётчики общих, локальных и временных блоков."
pg.field.temp_blks_read.label: "Прочитано временных блоков"
pg.field.temp_blks_read.help: "Блоки временных файлов, прочитанные запросом или планом. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.temp_blks_written.label: "Записано временных блоков"
pg.field.temp_blks_written.help: "Блоки временных файлов, записанные запросом или планом. Сопоставьте соседние счётчики общих, локальных, временных блоков и WAL."
pg.field.wal_bytes.label: "Байты WAL"
pg.field.wal_bytes.help: "Объём WAL, созданный запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.wal_records.label: "Записи WAL"
pg.field.wal_records.help: "Число записей WAL, созданных запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.wal_fpi.label: "Полные образы страниц WAL"
pg.field.wal_fpi.help: "Полные образы страниц WAL, созданные запросом. Сопоставьте соседние счётчики объёма WAL, записей и буферов."
pg.field.wal_buffers_full.label: "Заполнения буферов WAL"
pg.field.wal_buffers_full.help: "Число заполнений буферов при создании WAL запросом. Сопоставьте эту интервальную скорость с байтами, записями и полными образами WAL."
pg.field.plans.label: "Планы"
pg.field.plans.help: "Число построений плана запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.total_plan_time.label: "Общее время планирования"
pg.field.total_plan_time.help: "Общее время планирования запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.stats_since.label: "Статистика с"
pg.field.stats_since.help: "Время начала накопления этой статистики запросов. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.queryid_stat_statements.label: "ID последнего запроса"
pg.field.queryid_stat_statements.help: "Доступный только в vadv ID последнего связанного с планом запроса pg_stat_statements; это не точный ключ соединения. Проверьте идентификаторы плана и интервал."
pg.field.slow_log_calls.label: "Медленные вызовы"
pg.field.slow_log_calls.help: "Выполнения, записанные через порог медленных запросов vadv. Сопоставьте эту интервальную скорость со всеми вызовами плана и нагрузкой выполнения."
pg.field.relids.label: "ID отношений"
pg.field.relids.help: "OID отношений этого плана Datasentinel в текстовом формате массива PostgreSQL. Проверьте их вместе с типом команды, текстом плана и устойчивыми ID."
pg.field.cmd_type.label: "Тип команды"
pg.field.cmd_type.help: "Тип команды, указанный для этого плана Datasentinel. Проверьте его вместе с ID отношений, текстом плана, вызовами и нагрузкой выполнения."
pg.field.dealloc.label: "Вытеснения планов"
pg.field.dealloc.help: "Наименее выполняемые планы, вытесненные после заполнения хранилища. Сопоставьте интервальную скорость с вызовами и временем сброса статистики."
pg.field.stats_reset.label: "Сброс статистики"
pg.field.stats_reset.help: "Время последнего сброса всей статистики планов. Сопоставьте его с выбранным часом и первым доступным интервалом."
pg.field.pid.label: "PID"
pg.field.pid.help: "PID процесса PostgreSQL. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.query_duration_ms.label: "Время запроса"
pg.field.query_duration_ms.help: "Время активного запроса. Проверьте состояние и ожидание."
pg.field.transaction_duration_ms.label: "Время транзакции"
pg.field.transaction_duration_ms.help: "Возраст текущей транзакции в момент снимка. Проверьте состояние, запрос и xmin."
pg.field.application_name.label: "Приложение"
pg.field.application_name.help: "Имя приложения, переданное подключённым клиентом. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.state.label: "Состояние"
pg.field.state.help: "Текущее состояние процесса PostgreSQL. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.wait_event_type.label: "Класс ожидания"
pg.field.wait_event_type.help: "Класс события, которого ждёт процесс. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.wait_event.label: "Событие ожидания"
pg.field.wait_event.help: "Событие, которого ждёт процесс. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.blocked_by.label: "Кем заблокирован"
pg.field.blocked_by.help: "PID процессов, которые сейчас блокируют этот процесс. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_locktype.label: "Тип блокировки"
pg.field.lock_locktype.help: "Тип блокируемого объекта. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_mode.label: "Режим блокировки"
pg.field.lock_mode.help: "Режим блокировки PostgreSQL, удерживаемой или ожидаемой процессом. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_target.label: "Цель блокировки"
pg.field.lock_target.help: "Текстовое представление цели блокировки. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_relname.label: "Отношение"
pg.field.lock_relname.help: "Имя отношения, на которое установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_relation.label: "ID отношения"
pg.field.lock_relation.help: "OID отношения, на которое установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_transactionid.label: "ID транзакции"
pg.field.lock_transactionid.help: "ID транзакции, на которую установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.waitstart.label: "Ожидание началось"
pg.field.waitstart.help: "Время, с которого процесс ожидает блокировку. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.datid.label: "ID базы данных"
pg.field.datid.help: "OID базы данных. Проверьте имя базы и остальные счётчики в этой строке."
pg.field.numbackends.label: "Процессы"
pg.field.numbackends.help: "Число процессов, подключённых к базе данных в текущий момент. Сопоставьте значение с сеансами, транзакциями и текущей активностью процессов."
pg.field.xact_commit.label: "Коммиты/с"
pg.field.xact_commit.help: "Число коммитов в секунду за выбранный интервал. Сопоставьте с ролбэками, сеансами и конфликтами."
pg.field.xact_rollback.label: "Ролбэки/с"
pg.field.xact_rollback.help: "Число ролбэков в секунду за выбранный интервал. Сопоставьте с коммитами, сеансами и конфликтами."
pg.field.blks_hit.label: "Попадания блоков"
pg.field.blks_hit.help: "Общее число запросов блоков, обслуженных из буферов PostgreSQL. Сопоставьте попадания, чтение блоков и время I/O."
pg.field.blks_read.label: "Прочитано блоков"
pg.field.blks_read.help: "Общее число блоков базы данных, прочитанных с накопителей. Сопоставьте попадания, чтение блоков и время I/O."
pg.field.tup_returned.label: "Возвращено строк"
pg.field.tup_returned.help: "Строки, возвращённые последовательным сканированием, и записи индекса, возвращённые индексным сканированием. Сопоставьте соседние счётчики строк."
pg.field.tup_fetched.label: "Получено строк"
pg.field.tup_fetched.help: "Общее число строк, полученных индексным сканированием. Сопоставьте соседние счётчики строк."
pg.field.tup_inserted.label: "Добавлено строк"
pg.field.tup_inserted.help: "Общее число строк, добавленных в базу данных. Сопоставьте соседние счётчики строк."
pg.field.tup_updated.label: "Обновлено строк"
pg.field.tup_updated.help: "Общее число строк, обновлённых в базе данных. Сопоставьте соседние счётчики строк."
pg.field.tup_deleted.label: "Удалено строк"
pg.field.tup_deleted.help: "Общее число строк, удалённых из базы данных. Сопоставьте соседние счётчики строк."
pg.field.deadlocks.label: "Взаимные блокировки"
pg.field.deadlocks.help: "Общее число взаимных блокировок, обнаруженных в базе данных. Проверьте блокировки, транзакции и активные процессы в тот же момент."
pg.field.conflicts.label: "Конфликты восстановления"
pg.field.conflicts.help: "Общее число запросов, отменённых из-за конфликтов восстановления. Проверьте блокировки, транзакции и активные процессы в тот же момент."
pg.field.temp_files.label: "Временные файлы"
pg.field.temp_files.help: "Общее число временных файлов, созданных запросами в базе данных. Сопоставьте временные файлы, их объём и активность запросов."
pg.field.temp_bytes.label: "Байты временных файлов"
pg.field.temp_bytes.help: "Общий объём данных, записанных запросами во временные файлы. Сопоставьте временные файлы, их объём и активность запросов."
pg.field.blk_read_time.label: "Время чтения блоков"
pg.field.blk_read_time.help: "Общее время чтения блоков базы данных при включённом учёте времени I/O. Сопоставьте время чтения и записи с попаданиями и чтением блоков."
pg.field.blk_write_time.label: "Время записи блоков"
pg.field.blk_write_time.help: "Общее время записи блоков базы данных при включённом учёте времени I/O. Сопоставьте время чтения и записи с попаданиями и чтением блоков."
pg.field.sessions.label: "Сеансы"
pg.field.sessions.help: "Общее число сеансов, установленных с базой данных. Сопоставьте значение с сеансами, транзакциями и текущей активностью процессов."
pg.field.frozen_xid_age.label: "Возраст замороженного XID"
pg.field.frozen_xid_age.help: "Возраст замороженного ID транзакции базы, в транзакциях. Сопоставьте значение с транзакциями и активными процессами."
