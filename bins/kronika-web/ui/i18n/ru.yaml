lane.cpu_busy.label: "CPU"
lane.cpu_stall.label: "ОЖИДАНИЕ CPU"
lane.io_stall.label: "ОЖИДАНИЕ ДИСКА"
lane.backends.label: "БЭКЕНДЫ"
lane.oldest_xact.label: "ВОЗРАСТ ТРАНЗАКЦИИ"
lane.cpu_busy.help: "Доля процессорного времени, ушедшего на работу, а не на простой. Считается от процессоров, доступных здесь. Сравните с ожиданием CPU ниже."
lane.cpu_stall.help: "Доля времени, в течение которого хотя бы одна задача ждала процессор. Сравните с занятостью CPU выше: рост при неполной занятости означает узкую квоту."
lane.io_stall.help: "Доля времени, в течение которого хотя бы одна задача ждала диск. Проверьте таблицу процессов в разрезе диска."
lane.backends.help: "Клиентские бэкенды PostgreSQL: работающие и ждущие. Сопоставьте с рядами машины выше: рост ожидающих при ровных рядах означает, что работа стоит внутри базы."
lane.oldest_xact.help: "Возраст самой старой открытой транзакции. Ровный наклон означает, что транзакция висит открытой и удерживает горизонт очистки. Откройте таблицу активности PostgreSQL."
