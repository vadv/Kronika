pg.field.shared_blks_hit.label: "Попадания общих блоков"
pg.field.shared_blks_hit.help: "Прирост числа общих блоков, найденных в буферах PostgreSQL, с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.shared_blks_read.label: "Прочитано общих блоков"
pg.field.shared_blks_read.help: "Прирост числа промахов в общих буферах с учётом сброса, делённый на длительность интервала, в блоках/с; промах не обязательно означает физическое чтение с диска."
pg.field.shared_blks_written.label: "Записано общих блоков"
pg.field.shared_blks_written.help: "Прирост числа общих блоков, записанных этим запросом или планом, с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.shared_blks_dirtied.label: "Изменено общих блоков"
pg.field.shared_blks_dirtied.help: "Прирост числа общих блоков, изменённых этим запросом или планом, с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.local_blks_hit.label: "Попадания локальных блоков"
pg.field.local_blks_hit.help: "Локальные буферные блоки, найденные в кэше для запроса или плана."
pg.field.local_blks_read.label: "Прочитано локальных блоков"
pg.field.local_blks_read.help: "Прирост числа чтений локальных буферных блоков с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.local_blks_dirtied.label: "Изменено локальных блоков"
pg.field.local_blks_dirtied.help: "Локальные буферные блоки, изменённые запросом или планом."
pg.field.local_blks_written.label: "Записано локальных блоков"
pg.field.local_blks_written.help: "Локальные буферные блоки, записанные запросом или планом."
pg.field.temp_blks_read.label: "Прочитано временных блоков"
pg.field.temp_blks_read.help: "Прирост числа прочитанных блоков временных файлов с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.temp_blks_written.label: "Записано временных блоков"
pg.field.temp_blks_written.help: "Прирост числа записанных блоков временных файлов с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.wal_bytes.label: "Байты WAL"
pg.field.wal_bytes.help: "Прирост числа байтов журнала предзаписи, созданных запросом, с учётом сброса, делённый на длительность интервала, в байтах/с."
pg.field.wal_records.label: "Записи WAL"
pg.field.wal_records.help: "Число записей журнала предзаписи, созданных запросом."
pg.field.wal_fpi.label: "Полные образы страниц WAL"
pg.field.wal_fpi.help: "Полные образы страниц, записанные запросом в журнал предзаписи."
pg.field.wal_buffers_full.label: "Заполнения буферов WAL"
pg.field.wal_buffers_full.help: "Число заполнений буферов журнала предзаписи при работе запроса."
pg.field.plans.label: "Планы"
pg.field.plans.help: "Число построений плана запроса."
pg.field.total_plan_time.label: "Общее время планирования"
pg.field.total_plan_time.help: "Общее время планирования запроса."
pg.field.stats_since.label: "Статистика с"
pg.field.stats_since.help: "Время начала накопления этой статистики запросов."
pg.field.queryid_stat_statements.label: "ID последнего запроса"
pg.field.queryid_stat_statements.help: "Доступный только в vadv идентификатор последнего запроса pg_stat_statements, связанного с планом. Это не точный ключ соединения."
pg.field.slow_log_calls.label: "Медленные вызовы"
pg.field.slow_log_calls.help: "Выполнения, записанные через порог медленных запросов vadv."
pg.field.cmd_type.label: "Тип команды"
pg.field.cmd_type.help: "Тип команды SQL, записанный для этой физической записи плана Datasentinel."
pg.field.dealloc.label: "Вытеснения планов"
pg.field.dealloc.help: "Наименее выполняемые планы, вытесненные после заполнения хранилища."
pg.field.stats_reset.label: "Сброс статистики"
pg.field.stats_reset.help: "Время последнего сброса всей статистики планов."
pg.field.pid.label: "PID"
pg.field.backend_age_ms.label: "Возраст процесса PostgreSQL"
pg.field.backend_age_ms.help: "Время от backend_start до выбранного снимка."
pg.field.query_duration_ms.label: "Время активного запроса"
pg.field.query_duration_ms.help: "Время от query_start до выбранного снимка. Показано только в состоянии active."
pg.field.transaction_duration_ms.label: "Время транзакции"
pg.field.transaction_duration_ms.help: "Время от xact_start до выбранного снимка. Показано только при открытой транзакции."
pg.field.state_duration_ms.label: "Время в текущем состоянии"
pg.field.state_duration_ms.help: "Время от state_change до выбранного снимка."
pg.field.application_name.label: "Приложение"
pg.field.application_name.help: "Имя приложения, переданное подключённым клиентом, у курсора."
pg.field.state.label: "Состояние"
pg.field.state.help: "Текущее состояние процесса PostgreSQL у курсора."
pg.field.wait_event_type.label: "Класс ожидания"
pg.field.wait_event_type.help: "Класс события ожидания у курсора; недоступен, если событие ожидания не зарегистрировано."
pg.field.wait_event.label: "Событие ожидания"
pg.field.wait_event.help: "Событие ожидания у курсора; недоступно, если процесс не сообщает об ожидании."
pg.field.blocked_by.label: "Кем заблокирован"
pg.field.blocked_by.help: "Идентификаторы процессов, блокирующих этот процесс у курсора."
pg.field.lock_locktype.label: "Тип блокировки"
pg.field.lock_locktype.help: "Тип блокируемого объекта, представленного этой строкой блокировки."
pg.field.lock_mode.label: "Режим блокировки"
pg.field.lock_mode.help: "Режим блокировки PostgreSQL, удерживаемой или ожидаемой процессом у курсора."
pg.field.lock_target.label: "Цель блокировки"
pg.field.lock_target.help: "Текстовое представление объекта или транзакции, на которую установлена блокировка."
pg.field.lock_relname.label: "Отношение"
pg.field.lock_relname.help: "Имя отношения, на которое установлена блокировка; недоступно для блокировок других объектов."
pg.field.waitstart.label: "Ожидание началось"
pg.field.waitstart.help: "Время, с которого процесс ожидает блокировку; недоступно, если процесс не ожидает."
pg.field.numbackends.label: "Процессы"
pg.field.numbackends.help: "Число процессов, подключённых к базе данных у курсора."
pg.field.xact_commit.label: "Коммиты/с"
pg.field.xact_commit.help: "Прирост числа зафиксированных транзакций между снимками с учётом сброса, делённый на длительность интервала, в коммитах/с."
pg.field.xact_rollback.label: "Ролбэки/с"
pg.field.xact_rollback.help: "Прирост числа отменённых транзакций между снимками с учётом сброса, делённый на длительность интервала, в ролбэках/с."
pg.field.blks_hit.label: "Попадания блоков"
pg.field.blks_hit.help: "Прирост числа запросов блоков базы данных, обслуженных из буферов PostgreSQL, с учётом сброса, делённый на длительность интервала, в блоках/с."
pg.field.blks_read.label: "Прочитано блоков"
pg.field.blks_read.help: "Прирост числа чтений блоков базы данных с учётом сброса, делённый на длительность интервала, в блоках/с; чтение может обслуживаться кэшем ОС."
pg.field.tup_returned.label: "Tuples returned"
pg.field.tup_returned.help: "Прирост суммы строк последовательных сканирований и записей индекса, возвращённых индексными сканированиями, с учётом сброса, делённый на длительность интервала, в строках/с."
pg.field.tup_fetched.label: "Tuples fetched"
pg.field.tup_fetched.help: "Прирост числа живых строк, полученных индексными сканированиями, с учётом сброса, делённый на длительность интервала, в строках/с."
pg.field.tup_inserted.label: "Tuples inserted"
pg.field.tup_inserted.help: "Прирост числа вставленных строк с учётом сброса, делённый на длительность интервала, в строках/с."
pg.field.tup_updated.label: "Tuples updated"
pg.field.tup_updated.help: "Прирост числа обновлённых строк с учётом сброса, делённый на длительность интервала, в строках/с."
pg.field.tup_deleted.label: "Tuples deleted"
pg.field.tup_deleted.help: "Прирост числа удалённых строк с учётом сброса, делённый на длительность интервала, в строках/с."
pg.field.deadlocks.label: "Взаимные блокировки"
pg.field.deadlocks.help: "Прирост числа взаимных блокировок в базе данных с учётом сброса, делённый на длительность интервала, во взаимоблокировках/с."
pg.field.conflicts.label: "Конфликты восстановления"
pg.field.conflicts.help: "Прирост числа запросов, отменённых из-за конфликтов восстановления, с учётом сброса, делённый на длительность интервала, в конфликтах/с."
pg.field.temp_files.label: "Временные файлы"
pg.field.temp_files.help: "Прирост числа временных файлов, созданных запросами, с учётом сброса, делённый на длительность интервала, в файлах/с."
pg.field.temp_bytes.label: "Байты временных файлов"
pg.field.temp_bytes.help: "Прирост числа байтов, записанных запросами во временные файлы, с учётом сброса, делённый на длительность интервала, в байтах/с."
pg.field.blk_read_time.label: "Время чтения блоков"
pg.field.blk_read_time.help: "Суммарные миллисекунды чтения блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.blk_write_time.label: "Время записи блоков"
pg.field.blk_write_time.help: "Суммарные миллисекунды записи блоков базы данных на секунду реального времени за интервал при включённом track_io_timing, в мс/с. Значение может превышать 1000 из-за параллельной работы процессов."
pg.field.sessions.label: "Сеансы"
pg.field.sessions.help: "Прирост числа сеансов, установленных с базой данных, с учётом сброса, делённый на длительность интервала, в сеансах/с."
pg.field.frozen_xid_age.label: "Возраст замороженного XID"
pg.field.frozen_xid_age.help: "Возраст datfrozenxid базы данных у курсора, в транзакциях."
