col.pid.label: "PID"
col.pid.help: "Идентификатор процесса Linux у курсора."
col.command.label: "Command"
col.command.help: "Полная командная строка процесса с аргументами у курсора."
col.state.label: "State"
col.state.help: "Состояние процесса Linux у курсора, например R, S, D или Z."
col.ppid.label: "PPID"
col.ppid.help: "Идентификатор родительского процесса у курсора."
col.uid.label: "UID"
col.uid.help: "Идентификатор реального пользователя процесса у курсора."
col.euid.label: "EUID"
col.euid.help: "Идентификатор эффективного пользователя для проверки прав у курсора."
col.gid.label: "GID"
col.gid.help: "Идентификатор реальной группы процесса у курсора."
col.egid.label: "EGID"
col.egid.help: "Идентификатор эффективной группы для проверки прав у курсора."
col.threads.label: "Threads"
col.threads.help: "Число потоков процесса у курсора."
col.tty.label: "TTY"
col.tty.help: "Идентификатор управляющего терминала процесса у курсора."
col.nice.label: "Nice"
col.nice.help: "Поправка к обычному приоритету планировщика у курсора; положительные значения понижают приоритет процесса, отрицательные повышают."
col.prio.label: "Priority"
col.prio.help: "Приоритет процесса в планировщике Linux у курсора."
col.rtprio.label: "RT priority"
col.rtprio.help: "Приоритет процесса для планирования реального времени у курсора."
col.policy.label: "Policy"
col.policy.help: "Числовой код политики планировщика Linux у курсора."
col.curcpu.label: "CPU"
col.curcpu.help: "Логический процессор, на котором процесс выполнялся последним или выполняется у курсора."
col.utime.label: "User CPU time, cores"
col.utime.help: "Среднее потребление процессора в пользовательском режиме за интервал, в ядрах; 1 означает одно полностью занятое ядро."
col.stime.label: "System CPU time, cores"
col.stime.help: "Среднее потребление процессора в режиме ядра за интервал, в ядрах; 1 означает одно полностью занятое ядро."
col.rundelay.label: "Run delay"
col.rundelay.help: "Сколько миллисекунд за каждую секунду процесс простоял в очереди готовым к работе, пока процессоры были заняты другими. Рост означает конкуренцию за процессор: задача хочет работать, но ей не достаётся ядра."
col.blkdelay.label: "Block I/O delay"
col.blkdelay.help: "Время, которое процесс провёл в ожидании дискового ввода-вывода, в тиках ядра за секунду. Постоянно высокое значение означает, что процесс упирается в диск, а не в процессор."
col.nvcsw.label: "Voluntary ctx switches"
col.nvcsw.help: "Как часто процесс сам отдаёт процессор, уходя в ожидание — данных, блокировки или таймера. Высокая частота типична для задач, живущих короткими обменами: сеть, диски, каналы между процессами."
col.nivcsw.label: "Involuntary ctx switches"
col.nivcsw.help: "Как часто планировщик снимает процесс с процессора, не дожидаясь его согласия — квант истёк или пришла более приоритетная задача. Высокая частота — признак борьбы за процессор: активных потоков больше, чем ядер."
col.minflt.label: "Minor page faults"
col.minflt.help: "Обращения к памяти, которые ядро закрыло без диска — страница уже была в памяти, не хватало только записи в таблице страниц. Идут постоянно у любого работающего процесса и сами по себе безобидны."
col.majflt.label: "Major page faults"
col.majflt.help: "Обращения к памяти, которым пришлось ждать чтения с диска: нужной страницы не оказалось в оперативной памяти. Растут при нехватке памяти и вытеснении в подкачку; каждое такое обращение стоит дисковой операции, поэтому устойчивый рост означает, что процесс простаивает на диске."
col.vmem.label: "VSZ"
col.vmem.help: "Всё адресное пространство, которое процесс зарезервировал, включая никогда не тронутые страницы и отображённые файлы. Обычно во много раз больше занятой памяти и само по себе ни о чём плохом не говорит."
col.rmem.label: "RSS"
col.rmem.help: "Физическая память, реально занятая процессом: страницы, которые лежат в оперативке прямо сейчас. Это то, что процесс отнимает у остальных; при нехватке памяти ядро начинает вытеснять именно её."
col.vswap.label: "Swap"
col.vswap.help: "Объём пространства подкачки, занятый процессом у курсора, отображаемый в байтах."
col.syscr.label: "Read syscalls"
col.syscr.help: "Сколько раз в секунду процесс просил ядро что-нибудь прочитать. Много мелких обращений вместо редких крупных — признак неэффективного чтения: каждый вызов стоит перехода в ядро, даже когда данные уже в памяти."
col.syscw.label: "Write syscalls"
col.syscw.help: "Сколько раз в секунду процесс просил ядро что-нибудь записать. Частые мелкие записи нагружают ядро сильнее, чем редкие крупные, даже если суммарный объём тот же."
col.rchar.label: "Read incl. cache"
col.rchar.help: "Сколько байт процесс прочитал через системные вызовы, считая и то, что пришло из кэша памяти, а не с диска. Разрыв с чтением с накопителя показывает, какая часть чтения обошлась без диска."
col.wchar.label: "Written incl. cache"
col.wchar.help: "Сколько байт процесс записал через системные вызовы — большинство сначала оседает в кэше памяти, а не на диске. Разрыв с записью на накопитель показывает, что данные остались в кэше или были перезаписаны до сброса."
col.read_bytes.label: "Read from storage"
col.read_bytes.help: "Сколько байт процесс заставил физически прочитать с накопителя — то, чего не нашлось в кэше памяти. Устойчиво высокое значение означает, что рабочие данные процесса в кэш не помещаются и он ходит на диск."
col.write_bytes.label: "Written to storage"
col.write_bytes.help: "Сколько байт по вине процесса физически ушло на накопитель. Запись может дойти до диска позже самих вызовов: ядро копит её в кэше и сбрасывает фоном."
col.cancelled_write.label: "Cancelled write"
col.cancelled_write.help: "Байты, которые уже ждали сброса на диск, но так туда и не попали — например, файл удалили или укоротили раньше. Обычное дело для программ с временными файлами; это сэкономленная запись, а не потерянные данные."
col.exit_signal.label: "Exit signal"
col.exit_signal.help: "Сигнал, настроенный для отправки родительскому процессу при завершении процесса, у курсора."
