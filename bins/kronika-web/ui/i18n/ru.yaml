pg.detail.query: "ID запроса {id}"
pg.badge: "PG"
pg.pid.label: "PID PostgreSQL"
pg.pid.help: "Идентификатор процесса PostgreSQL. Проверьте тип, состояние, событие ожидания и запрос процесса с тем же PID."
pg.leader_pid.label: "PID ведущего процесса"
pg.leader_pid.help: "Идентификатор ведущего процесса группы параллельных рабочих процессов. Проверьте тип, состояние, событие ожидания и запрос процесса с тем же PID."
pg.datname.label: "База данных"
pg.datname.help: "База данных текущего соединения; у фоновых процессов её может не быть. Проверьте рядом PID, состояние, событие ожидания и запрос процесса."
pg.usename.label: "Роль"
pg.usename.help: "Роль PostgreSQL для текущего соединения; у фоновых процессов её может не быть. Проверьте рядом PID, состояние, событие ожидания и запрос процесса."
pg.application_name.label: "Приложение"
pg.application_name.help: "Имя приложения, которое передал подключённый клиент. Проверьте рядом PID, состояние, событие ожидания и запрос процесса."
pg.client_addr.label: "Адрес клиента"
pg.client_addr.help: "IP-адрес подключённого клиента; у локальных и фоновых процессов его может не быть. Проверьте рядом PID, состояние, событие ожидания и запрос процесса."
pg.backend_type.label: "Тип процесса"
pg.backend_type.help: "Тип процесса PostgreSQL, например клиентский процесс или процесс autovacuum. Проверьте рядом PID, состояние, событие ожидания и запрос процесса."
pg.state.label: "Состояние"
pg.state.help: "Текущее состояние процесса PostgreSQL. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.wait_event_type.label: "Класс ожидания"
pg.wait_event_type.help: "Класс события, которого сейчас ждёт процесс. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.wait_event.label: "Событие ожидания"
pg.wait_event.help: "Событие, которого сейчас ждёт процесс. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.query.label: "Запрос"
pg.query.help: "Текст текущего запроса для активного процесса или последнего запроса для неактивного. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.query_id.label: "ID запроса"
pg.query_id.help: "Идентификатор запроса процесса PostgreSQL. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.backend_xid_age.label: "Возраст XID"
pg.backend_xid_age.help: "Возраст идентификатора транзакции процесса PostgreSQL, в транзакциях. Сопоставьте значение с состоянием процесса, возрастом транзакции, ожиданием и запросом."
pg.backend_xmin_age.label: "Возраст xmin"
pg.backend_xmin_age.help: "Возраст горизонта xmin процесса PostgreSQL, в транзакциях. Сопоставьте значение с состоянием процесса, возрастом транзакции, ожиданием и запросом."
pg.backend_start.label: "Процесс запущен"
pg.backend_start.help: "Время запуска процесса PostgreSQL. Сопоставьте значение с состоянием процесса, возрастом транзакции, ожиданием и запросом."
pg.xact_start.label: "Транзакция начата"
pg.xact_start.help: "Время начала текущей транзакции процесса. Сопоставьте значение с состоянием процесса, возрастом транзакции, ожиданием и запросом."
pg.query_start.label: "Запрос начат"
pg.query_start.help: "Время начала текущего запроса или последнего запроса для неактивного процесса. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.state_change.label: "Состояние изменено"
pg.state_change.help: "Время последнего изменения состояния процесса. Проверьте вместе состояние, событие ожидания, запрос и время их начала."
pg.field.queryid.label: "ID запроса"
pg.field.queryid.help: "Идентификатор нормализованного запроса PostgreSQL. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.dbid.label: "ID базы данных"
pg.field.dbid.help: "OID базы данных, в которой выполнялся запрос. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.userid.label: "ID роли"
pg.field.userid.help: "OID роли, от имени которой выполнялся запрос. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.toplevel.label: "Верхний уровень"
pg.field.toplevel.help: "Выполнялся ли запрос на верхнем уровне, а не внутри другого запроса. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.datname.label: "База данных"
pg.field.datname.help: "База данных, к которой относится строка. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.usename.label: "Роль"
pg.field.usename.help: "Роль PostgreSQL, к которой относится строка. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.query.label: "Запрос"
pg.field.query.help: "Текст запроса, записанный PostgreSQL. Проверьте число вызовов, время выполнения и строки того же запроса."
pg.field.calls.label: "Вызовы"
pg.field.calls.help: "Число выполнений запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.total_exec_time.label: "Общее время выполнения"
pg.field.total_exec_time.help: "Общее время выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.mean_exec_time.label: "Среднее время выполнения"
pg.field.mean_exec_time.help: "Среднее время одного выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.max_exec_time.label: "Максимальное время выполнения"
pg.field.max_exec_time.help: "Наибольшее время одного выполнения запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.rows.label: "Строки"
pg.field.rows.help: "Общее число строк, полученных или изменённых запросом. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.shared_blks_hit.label: "Попадания общих блоков"
pg.field.shared_blks_hit.help: "Число блоков запроса, найденных в общих буферах. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.shared_blks_read.label: "Прочитано общих блоков"
pg.field.shared_blks_read.help: "Число общих буферных блоков, прочитанных для запроса. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.shared_blks_written.label: "Записано общих блоков"
pg.field.shared_blks_written.help: "Число общих буферных блоков, записанных запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.temp_blks_read.label: "Прочитано временных блоков"
pg.field.temp_blks_read.help: "Число блоков временных файлов, прочитанных запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.temp_blks_written.label: "Записано временных блоков"
pg.field.temp_blks_written.help: "Число блоков временных файлов, записанных запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.wal_bytes.label: "Байты WAL"
pg.field.wal_bytes.help: "Объём WAL, созданный запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.wal_records.label: "Записи WAL"
pg.field.wal_records.help: "Число записей WAL, созданных запросом. Сопоставьте соседние счётчики буферов, временных файлов и WAL."
pg.field.plans.label: "Планы"
pg.field.plans.help: "Число построений плана запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.total_plan_time.label: "Общее время планирования"
pg.field.total_plan_time.help: "Общее время планирования запроса. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.stats_since.label: "Статистика с"
pg.field.stats_since.help: "Время начала накопления этой статистики запросов. Сопоставьте вызовы, время выполнения, строки, планы и начало сбора статистики."
pg.field.pid.label: "PID"
pg.field.pid.help: "PID процесса PostgreSQL. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.application_name.label: "Приложение"
pg.field.application_name.help: "Имя приложения, переданное подключённым клиентом. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.state.label: "Состояние"
pg.field.state.help: "Текущее состояние процесса PostgreSQL. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.wait_event_type.label: "Класс ожидания"
pg.field.wait_event_type.help: "Класс события, которого ждёт процесс. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.wait_event.label: "Событие ожидания"
pg.field.wait_event.help: "Событие, которого ждёт процесс. Проверьте вместе PID, приложение, состояние, событие ожидания и блокирующий процесс."
pg.field.blocked_by.label: "Кем заблокирован"
pg.field.blocked_by.help: "PID процессов, которые сейчас блокируют этот процесс. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_locktype.label: "Тип блокировки"
pg.field.lock_locktype.help: "Тип блокируемого объекта. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_mode.label: "Режим блокировки"
pg.field.lock_mode.help: "Режим блокировки PostgreSQL, удерживаемой или ожидаемой процессом. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_target.label: "Цель блокировки"
pg.field.lock_target.help: "Текстовое представление цели блокировки. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_relname.label: "Отношение"
pg.field.lock_relname.help: "Имя отношения, на которое установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_relation.label: "ID отношения"
pg.field.lock_relation.help: "OID отношения, на которое установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.lock_transactionid.label: "ID транзакции"
pg.field.lock_transactionid.help: "ID транзакции, на которую установлена блокировка. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.waitstart.label: "Ожидание началось"
pg.field.waitstart.help: "Время, с которого процесс ожидает блокировку. Проверьте вместе PID, режим, цель и начало ожидания, а также блокирующий процесс."
pg.field.datid.label: "ID базы данных"
pg.field.datid.help: "OID базы данных. Проверьте имя базы и остальные счётчики в этой строке."
pg.field.numbackends.label: "Процессы"
pg.field.numbackends.help: "Число процессов, подключённых к базе данных в текущий момент. Сопоставьте значение с сеансами, транзакциями и текущей активностью процессов."
pg.field.xact_commit.label: "Фиксации"
pg.field.xact_commit.help: "Общее число зафиксированных транзакций в базе данных. Сопоставьте фиксации с откатами, сеансами и конфликтами."
pg.field.xact_rollback.label: "Откаты"
pg.field.xact_rollback.help: "Общее число отменённых транзакций в базе данных. Сопоставьте фиксации с откатами, сеансами и конфликтами."
pg.field.blks_hit.label: "Попадания блоков"
pg.field.blks_hit.help: "Общее число запросов блоков, обслуженных из буферов PostgreSQL. Сопоставьте попадания, чтение блоков и время I/O."
pg.field.blks_read.label: "Прочитано блоков"
pg.field.blks_read.help: "Общее число блоков базы данных, прочитанных с накопителей. Сопоставьте попадания, чтение блоков и время I/O."
pg.field.tup_returned.label: "Возвращено строк"
pg.field.tup_returned.help: "Строки, возвращённые последовательным сканированием, и записи индекса, возвращённые индексным сканированием. Сопоставьте соседние счётчики строк."
pg.field.tup_fetched.label: "Получено строк"
pg.field.tup_fetched.help: "Общее число строк, полученных индексным сканированием. Сопоставьте соседние счётчики строк."
pg.field.tup_inserted.label: "Добавлено строк"
pg.field.tup_inserted.help: "Общее число строк, добавленных в базу данных. Сопоставьте соседние счётчики строк."
pg.field.tup_updated.label: "Обновлено строк"
pg.field.tup_updated.help: "Общее число строк, обновлённых в базе данных. Сопоставьте соседние счётчики строк."
pg.field.tup_deleted.label: "Удалено строк"
pg.field.tup_deleted.help: "Общее число строк, удалённых из базы данных. Сопоставьте соседние счётчики строк."
pg.field.deadlocks.label: "Взаимные блокировки"
pg.field.deadlocks.help: "Общее число взаимных блокировок, обнаруженных в базе данных. Проверьте блокировки, транзакции и активные процессы в тот же момент."
pg.field.conflicts.label: "Конфликты восстановления"
pg.field.conflicts.help: "Общее число запросов, отменённых из-за конфликтов восстановления. Проверьте блокировки, транзакции и активные процессы в тот же момент."
pg.field.temp_files.label: "Временные файлы"
pg.field.temp_files.help: "Общее число временных файлов, созданных запросами в базе данных. Сопоставьте временные файлы, их объём и активность запросов."
pg.field.temp_bytes.label: "Байты временных файлов"
pg.field.temp_bytes.help: "Общий объём данных, записанных запросами во временные файлы. Сопоставьте временные файлы, их объём и активность запросов."
pg.field.blk_read_time.label: "Время чтения блоков"
pg.field.blk_read_time.help: "Общее время чтения блоков базы данных при включённом учёте времени I/O. Сопоставьте время чтения и записи с попаданиями и чтением блоков."
pg.field.blk_write_time.label: "Время записи блоков"
pg.field.blk_write_time.help: "Общее время записи блоков базы данных при включённом учёте времени I/O. Сопоставьте время чтения и записи с попаданиями и чтением блоков."
pg.field.sessions.label: "Сеансы"
pg.field.sessions.help: "Общее число сеансов, установленных с базой данных. Сопоставьте значение с сеансами, транзакциями и текущей активностью процессов."
pg.field.frozen_xid_age.label: "Возраст замороженного XID"
pg.field.frozen_xid_age.help: "Возраст замороженного ID транзакции базы, в транзакциях. Сопоставьте значение с транзакциями и активными процессами."
