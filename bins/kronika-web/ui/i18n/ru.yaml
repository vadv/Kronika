activity.cut.exec_time.help: "Суммарное время выполнения на секунду реального времени. Итог за час — суммарное время выполнения."
activity.cut.calls.help: "Число выполнений запроса в секунду. Итог за час — число выполнений."
activity.cut.rows.help: "Число возвращённых или изменённых строк в секунду. Итог за час — число строк."
activity.cut.shared_read.help: "Байты, прочитанные извне общих буферов PostgreSQL за секунду, по записанному размеру блока. Чтение может обслужить страничный кэш ОС."
activity.cut.shared_dirtied.help: "Байты, помеченные изменёнными в общих буферах PostgreSQL за секунду, по записанному размеру блока."
