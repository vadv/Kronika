activity.indexes.totals.help: "Сумма за каждый интервал и весь час по всем Indexes, включая строки вне ранжирования."
activity.cut.writes: "Rows changed"
activity.cut.writes.help: "Суммарное число вставленных, обновлённых и удалённых строк в секунду. Итог за час — сумма этих изменений."
activity.cut.seq_read: "Rows read by seq scans"
activity.cut.seq_read.help: "Строки, прочитанные seq scan, в секунду. Итог за час — число строк."
activity.cut.heap_read: "Heap buffer read bytes"
activity.cut.heap_read.help: "Байты основного файла таблицы, прочитанные за пределами общих буферов PostgreSQL за секунду, по записанному размеру блока. Учитывает чтение из кэша страниц ОС."
activity.cut.dead_tuples: "Dead tuples"
