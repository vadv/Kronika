pg.field.shared_blk_read_ms_per_second.label: "Чтение общих, мс/с"
pg.field.shared_blk_read_ms_per_second.help: "Миллисекунды чтения общих блоков в секунду либо всех блоков, если раскладка не разделяет время."
pg.field.shared_blk_write_ms_per_second.label: "Запись общих, мс/с"
pg.field.shared_blk_write_ms_per_second.help: "Миллисекунды записи общих блоков в секунду либо всех блоков, если раскладка не разделяет время."
pg.field.local_blk_read_ms_per_second.label: "Чтение локальных, мс/с"
pg.field.local_blk_read_ms_per_second.help: "Миллисекунды чтения локальных блоков в секунду, если они есть в физической раскладке."
pg.field.local_blk_write_ms_per_second.label: "Запись локальных, мс/с"
pg.field.local_blk_write_ms_per_second.help: "Миллисекунды записи локальных блоков в секунду, если они есть в физической раскладке."
pg.field.temp_blk_read_ms_per_second.label: "Чтение временных, мс/с"
