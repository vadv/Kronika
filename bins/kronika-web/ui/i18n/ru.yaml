process.summary.title: "Итоги по процессам"
process.summary.loading: "Загрузка итогов по процессам…"
process.summary.error: "Не удалось загрузить итоги по процессам"
process.summary.processes: "Processes"
process.summary.processes.help: "Число процессов Linux в полном снимке на выбранный момент."
process.summary.threads: "Threads"
process.summary.threads.help: "Общее число потоков Linux у всех процессов в полном снимке."
process.summary.running: "Runnable"
process.summary.running.help: "Число процессов в состоянии готовности к выполнению в полном снимке."
process.summary.postgresql: "Backends PostgreSQL"
process.summary.postgresql.help: "Число процессов, идентификаторы которых также есть в активности PostgreSQL на выбранный момент."
process.summary.user_time: "User CPU, cores"
process.summary.user_time.help: "Сколько процессорного времени все процессы вместе провели в собственном коде программ, в пересчёте на ядра. Значение около числа доступных ядер означает, что процессорам больше нечего отдать."
process.summary.system_time: "System CPU, cores"
process.summary.system_time.help: "Сколько процессорного времени все процессы вместе провели внутри ядра Linux — в системных вызовах и обслуживании ввода-вывода. Заметная доля на фоне пользовательской означает, что время уходит на обращения к ядру, а не на саму работу."
process.summary.run_delay: "Run queue wait"
process.summary.run_delay.help: "Суммарное время, которое готовые к работе процессы простояли в очереди за свободным процессором, за каждую секунду. Рост означает нехватку процессорных ядер: задачи готовы, но им не достаётся времени."
process.summary.context_switches: "Context switches"
process.summary.context_switches.help: "Как часто процессы уступают процессор друг другу, суммарно за секунду. Очень высокая частота означает избыток активных потоков или обилие мелких обменов; сами переключения тоже стоят процессорного времени."
process.summary.resident: "RSS"
process.summary.resident.help: "Сумма физической памяти всех процессов снимка — сколько оперативки занято работающими программами."
process.summary.virtual: "VSZ"
process.summary.virtual.help: "Сумма зарезервированного адресного пространства всех процессов; величина справочная и обычно многократно превышает реально занятую память."
process.summary.swap: "Swap"
process.summary.swap.help: "Пространство подкачки, занятое всеми процессами в полном снимке."
process.summary.major_faults: "Major page faults"
process.summary.major_faults.help: "Обращения к памяти, ради которых пришлось читать с диска, суммарно у всех процессов за секунду. Устойчивый поток — признак нехватки памяти: система вытесняет страницы и тут же читает их обратно."
process.summary.read: "Read from storage"
process.summary.read.help: "Сколько байт все процессы вместе физически прочитали с накопителей за секунду. Чтение, обслуженное кэшем в памяти, сюда не входит."
process.summary.written: "Written to storage"
process.summary.written.help: "Сколько байт все процессы вместе отправили на накопители за секунду. Пики могут отставать от работы программ: ядро копит запись в памяти и сбрасывает её позже."
process.summary.read_calls: "Read syscalls"
process.summary.read_calls.help: "Сумма запросов на чтение от всех процессов снимка — общий поток обращений к ядру за данными."
process.summary.write_calls: "Write syscalls"
process.summary.write_calls.help: "Сумма запросов на запись от всех процессов снимка — общий поток обращений к ядру на сохранение данных."
system.metric.health.label: "OS health"
system.metric.health.help: "OS Health = 100 × (1 − max(CPU PSI some, memory PSI some, I/O PSI some)). Для каждого ресурса доля PSI равна приросту счётчика total в строке some, делённому на время между соседними снимками. Чем ниже Health, тем больше времени задачи ждали ресурс с максимальной долей ожидания."
system.metric.cpu_busy.label: "CPU usage"
system.metric.cpu_busy.help: "Доля всей процессорной мощности хоста, занятая между снимками; простой и ожидание ввода-вывода занятостью не считаются."
system.metric.cpu_used_cores.label: "CPU used, cores"
system.metric.cpu_used_cores.help: "Средняя занятость процессоров хоста между снимками в эквивалентных ядрах; простой и ожидание ввода-вывода не учитываются."
system.metric.cpu_capacity.label: "CPU cores"
system.metric.cpu_capacity.help: "Число активных логических процессоров хоста у курсора; это не квота контейнера."
system.metric.cpu_actual_frequency.label: "Actual frequency"
system.metric.cpu_actual_frequency.help: "Аппаратная частота политик CPUFreq, взвешенная по числу активных логических процессоров. На графике каждая политика остаётся отдельной серией; без аппаратного источника значение недоступно."
system.metric.cpu_scaling_frequency.label: "Scaling frequency"
system.metric.cpu_scaling_frequency.help: "Значение CPUFreq scaling_cur_freq, взвешенное по активным процессорам: отдельно названная сообщённая или запрошенная рабочая точка, а не измеренная аппаратная частота."
system.metric.cpu_user.label: "User CPU"
system.metric.cpu_user.help: "Доля времени процессоров хоста в пользовательском режиме, включая задачи с пониженным приоритетом, между снимками."
system.metric.cpu_system.label: "System CPU"
system.metric.cpu_system.help: "Доля времени процессоров хоста в системном режиме ядра между снимками."
system.metric.cpu_irq.label: "IRQ"
system.metric.cpu_irq.help: "Доля времени процессоров хоста на обработку аппаратных и программных прерываний между снимками."
system.metric.cpu_iowait.label: "I/O wait"
system.metric.cpu_iowait.help: "Доля времени процессоров хоста, которую ядро отнесло к ожиданию ввода-вывода; она показана отдельно и не считается работой процессора."
system.metric.cpu_steal.label: "Steal"
system.metric.cpu_steal.help: "Доля времени процессоров хоста, которую гипервизор отдал другой виртуальной машине между снимками."
system.metric.cpu_idle.label: "Idle"
system.metric.cpu_idle.help: "Доля времени простоя процессоров хоста между снимками."
system.metric.procs_running.label: "Procs running"
system.metric.procs_running.help: "Число процессов, готовых к выполнению."
system.metric.procs_blocked.label: "Procs blocked"
system.metric.procs_blocked.help: "Число процессов, заблокированных в ожидании ввода-вывода."
system.metric.context_switches.label: "Context switches"
system.metric.context_switches.help: "Общее число переключений контекста с запуска системы."
system.metric.load1.label: "Load 1m"
system.metric.load1.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за одну минуту."
system.metric.load5.label: "Load 5m"
system.metric.load5.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пять минут."
system.metric.load15.label: "Load 15m"
system.metric.load15.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за пятнадцать минут."
system.metric.runnable.label: "Runnable tasks"
system.metric.runnable.help: "Число задач, готовых к выполнению в текущий момент."
system.metric.tasks.label: "Tasks"
system.metric.tasks.help: "Общее число задач, известных планировщику ядра."
system.metric.mem_available.label: "MemAvailable"
system.metric.mem_available.help: "Оценка ядра для памяти хоста, доступной новым задачам без подкачки; она пересекается с освобождаемыми категориями и не складывается с ними."
system.metric.mem_total.label: "MemTotal"
system.metric.mem_total.help: "Полный объём доступной физической памяти хоста; это не лимит контейнера."
system.metric.mem_anon.label: "AnonPages"
system.metric.mem_anon.help: "Память хоста с анонимными страницами, включая кучи и стеки приложений."
system.metric.mem_file_cache.label: "Page cache"
system.metric.mem_file_cache.help: "Файловый кэш хоста вместе с буферами блочных устройств; кэши служебных структур ядра сюда не входят."
system.metric.mem_s_reclaimable.label: "Slab reclaimable"
system.metric.mem_s_reclaimable.help: "Кэши служебных структур ядра, которые оно может освободить при нехватке памяти."
system.metric.mem_s_unreclaim.label: "Slab unreclaimable"
system.metric.mem_s_unreclaim.help: "Кэши служебных структур ядра, которые сейчас нельзя освободить."
system.metric.mem_free.label: "MemFree"
system.metric.mem_free.help: "Полностью неиспользуемая физическая память хоста."
system.metric.mem_other.label: "Other memory"
system.metric.mem_other.help: "Остаток общей памяти хоста после вычета анонимной памяти, файлового кэша с буферами, кэшей служебных структур ядра и свободной памяти."
system.metric.swap_free.label: "Swap free"
system.metric.swap_free.help: "Свободное пространство подкачки."
system.metric.swap_total.label: "Swap total"
system.metric.swap_total.help: "Общий настроенный объём пространства подкачки."
system.metric.oom_kill.label: "OOM kills"
system.metric.oom_kill.help: "Общее число процессов, которые ядро завершило из-за нехватки памяти с момента запуска системы."
system.metric.cpu_pressure.label: "PSI CPU, 10 с"
system.metric.cpu_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала процессора."
system.metric.memory_pressure.label: "PSI памяти, 10 с"
system.metric.memory_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача ждала доступа к памяти."
system.metric.io_pressure.label: "PSI I/O, 10 с"
system.metric.io_pressure.help: "Процент времени за последние десять секунд, когда хотя бы одна задача хоста ждала ввода-вывода; это не задержка устройства."
system.metric.device_busy.label: "Device busy"
system.metric.device_busy.help: "Наибольшая занятость среди блочных устройств: какую долю времени самый загруженный диск обслуживал запросы. Высокое значение означает, что это устройство — узкое место."
system.metric.device_average_queue.label: "Queue depth"
system.metric.device_average_queue.help: "Самая длинная очередь запросов среди блочных устройств. Очередь стабильно выше единицы означает, что запросы ждут, пока устройство их обслужит."
system.metric.filesystem_free_min.label: "Минимум свободного места"
system.metric.filesystem_free_min.help: "Наименьшая доля свободного места среди наблюдаемых локальных файловых систем."
system.metric.device_count.label: "Block devices"
system.metric.device_count.help: "Блочные устройства в выбранный момент."
system.metric.device_active_io.label: "Active I/O"
system.metric.device_active_io.help: "Операции ввода-вывода, которые сейчас выполняют блочные устройства."
system.metric.filesystem_count.label: "Filesystems"
system.metric.filesystem_count.help: "Смонтированные файловые системы в выбранный момент."
system.metric.interface_count.label: "Interfaces"
system.metric.interface_count.help: "Сетевые интерфейсы в выбранный момент."
system.metric.network_rx.label: "RX"
system.metric.network_rx.help: "Байты, полученные сетевыми интерфейсами."
system.metric.network_tx.label: "TX"
system.metric.network_tx.help: "Байты, переданные сетевыми интерфейсами."
system.metric.network_errors.label: "Net errors"
system.metric.network_errors.help: "Ошибки приёма и передачи сетевых интерфейсов."
system.metric.network_drops.label: "Drops"
system.metric.network_drops.help: "Входящие и исходящие пакеты, отброшенные интерфейсами."
system.history: "One-hour history"
