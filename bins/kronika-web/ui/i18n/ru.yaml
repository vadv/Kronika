activity.cut.autovacuum_time: "Autovacuum time"
activity.cut.autovacuum_time.help: "Время autovacuum на секунду реального времени. Итог за час — накопленное время."
activity.cut.idx_scan: "Index scans"
activity.cut.idx_scan.help: "Index scans в секунду. Итог за час — число сканирований."
activity.cut.idx_tup_read: "Index tuples read"
activity.cut.idx_tup_read.help: "Записи индекса, возвращённые сканированиями, в секунду. Итог за час — число записей."
activity.cut.idx_blks_read: "Index buffer read bytes"
activity.cut.idx_blks_read.help: "Байты файлов индекса, прочитанные за пределами общих буферов PostgreSQL за секунду, по записанному размеру блока. Учитывает чтение из кэша страниц ОС."
activity.processes.title: "Processes Activity"
activity.processes.title.help: "Ранжирование по командам за час. Строка объединяет разные записанные PID команды, включая завершившиеся процессы. Ячейки показывают скорость или последнее значение; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор, выбор строки фильтрует Processes по команде."
activity.processes.others: "Other Processes ({count})"
activity.processes.others_label: "Other Processes"
activity.processes.others.help: "Разность между Total и суммой показанных процессов."
activity.processes.totals.help: "Сумма за каждый интервал по всем Processes, включая строки вне ранжирования. Для gauge-метрик итог за час равен максимуму полосы."
activity.cut.cpu: "CPU time"
activity.cut.cpu.help: "Сумма времени CPU в режимах user и system на секунду реального времени. Одна секунда в секунду равна одному занятому ядру. Итог за час — накопленное время CPU; без частоты часов значения указаны в тиках."
activity.cut.rss: "RSS"
activity.cut.rss.help: "RSS на конец интервала. Значение за час — наибольшее показание."
activity.cut.io_read: "Disk read bytes"
activity.cut.io_read.help: "Байты, прочитанные с блочного уровня за секунду; чтение из кэша страниц не учитывается. Итог за час — прочитанные байты. При недоступном I/O процесса значение пустое."
activity.cut.io_write: "Disk write bytes"
activity.cut.io_write.help: "Байты, записанные на блочный уровень за секунду. Итог за час — записанные байты. При недоступном I/O процесса значение пустое."
activity.cut.majflt: "Major page faults"
activity.cut.majflt.help: "Major page faults в секунду. Итог за час — число событий."
activity.cut.run_delay: "Run delay"
activity.cut.run_delay.help: "Время готового к выполнению процесса в ожидании CPU, на секунду реального времени. Итог за час — накопленная задержка."
activity.members: "{count} PIDs"
