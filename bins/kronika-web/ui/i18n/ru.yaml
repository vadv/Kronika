pg.wait_event_type.label: "Класс ожидания"
pg.wait_event_type.help: "Класс события ожидания у курсора; пустое значение означает, что событие ожидания не зарегистрировано."
pg.wait_event.label: "Событие ожидания"
pg.wait_event.help: "Событие ожидания у курсора; пустое значение означает, что процесс не сообщает об ожидании."
