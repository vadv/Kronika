pg.vacuum.heap_size.help: "Просканированный heap против размера heap на старте, в байтах с учётом записанного размера блока."
pg.vacuum.heap_vacuumed.label: "Heap vacuumed"
pg.vacuum.heap_vacuumed.help: "Heap, где мёртвые указатели помечены переиспользуемыми после прохода по индексам; место операционной системе не возвращается."
pg.vacuum.cycles.label: "Index cycles"
pg.vacuum.cycles.help: "Завершённые циклы вакуума индексов. Больше одного — память под мёртвые записи заполнилась и все индексы сканируются заново."
pg.vacuum.cycles.repeat: "{count} циклов"
pg.vacuum.index_progress.label: "Index progress"
pg.vacuum.index_progress.help: "Обработанные индексы текущей индексной фазы; записывается с PostgreSQL 17 и показывается только в индексных фазах."
pg.vacuum.delay.label: "Cost delay"
pg.vacuum.delay.help: "Накопленный сон cost-based delay и прирост с прошлой пробы. Записывается с PostgreSQL 18; 0 обычно значит выключенный track_cost_delay_timing, а не работу без троттлинга."
pg.vacuum.no_movement.label: "No movement"
pg.vacuum.no_movement.help: "Подряд записанные пробы, чей счётчик фазы не менялся: счётчики heap в фазах heap, обработанные индексы в индексных фазах с PostgreSQL 17, сама фаза при truncating."
pg.vacuum.no_movement.value: "{count} проб · {span}"
pg.vacuum.workers.label: "Autovacuum workers"
pg.vacuum.workers.help: "Бэкенды autovacuum worker, записанные на курсоре, против записанной настройки autovacuum_max_workers."
pg.vacuum.cadence: "Прогресс записывается раз в {seconds} с."
pg.vacuum.empty: "Прогресс вакуума не записан"
pg.vacuum.episode: "{count} проб · {span}"
pg.vacuum.load.label: "OS process load"
pg.vacuum.load.help: "Что записанный OS-процесс реально сделал между первой и последней записанной пробой этого эпизода: подсказка о его цене, а не утверждение, что это сделал именно vacuum, — бэкенд ручного VACUUM мог заниматься и другим в тот же промежуток."
pg.vacuum.load.unavailable: "Метрики процесса за этот промежуток не записаны."
pg.vacuum.load.cpu.label: "CPU time"
pg.vacuum.load.cpu.help: "Пользовательское плюс системное время CPU, накопленное процессом за этот промежуток, и его доля от собственного астрономического времени промежутка."
pg.vacuum.load.read.label: "Прочитано с диска"
pg.vacuum.load.read.help: "Байты, реально прочитанные процессом с накопителя за этот промежуток, из /proc/PID/io; попадания в кэш страниц не учитываются."
pg.vacuum.load.read_share: "от {share}, которые просканировал PG"
pg.vacuum.load.write.label: "Записано на диск"
pg.vacuum.load.write.help: "Байты, реально записанные процессом на накопитель за этот промежуток, из /proc/PID/io."
pg.vacuum.load.block_wait.label: "Заблокирован на I/O"
pg.vacuum.load.block_wait.help: "Время, которое процесс провёл заблокированным в ожидании блочного I/O за этот промежуток."
pg.vacuum.load.major_faults.label: "Major page faults"
pg.vacuum.load.major_faults.help: "Page faults за этот промежуток, потребовавшие физического чтения, а не отданные из памяти."
pg.backend_xid_age.label: "XID age"
pg.backend_xid_age.help: "Возраст текущего идентификатора транзакции процесса у курсора, в транзакциях; недоступен, пока идентификатор не назначен."
pg.backend_xmin_age.label: "xmin age"
pg.backend_xmin_age.help: "Возраст горизонта xmin процесса у курсора, в транзакциях; недоступен без горизонта xmin."
pg.backend_start.label: "Backend started"
pg.backend_start.help: "Время запуска процесса PostgreSQL."
