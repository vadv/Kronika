pg.relation.scope.all: "All"
pg.help.relation.scan_rate: "Сколько раз в секунду запросы начинали проход по таблице или индексу. Частые полные проходы большой таблицы — признак пропавшего или неиспользуемого индекса; для индекса это мера его востребованности."
pg.help.relation.index_entries_rate: "Сколько записей в секунду запросы вычитывают из самого индекса; это позиции в индексе, а не строки таблицы. Если их сильно больше, чем полученных строк, индекс просматривается широко, а отбирает мало."
pg.help.relation.rows_fetched_rate: "Сколько живых строк таблицы в секунду принесли обычные индексные обращения. Заметно меньше, чем прочитано записей индекса, — значит проходы по индексу широкие, а нужных строк мало."
pg.help.relation.maintenance_rate: "Сколько раз в секунду над таблицей проходила эта операция обслуживания. Частые проходы бывают у таблиц с интенсивной записью; полное отсутствие на активной таблице означает, что автоматика до неё не добирается."
pg.help.relation.per_scan: "Сколько строк или записей в среднем приносит один проход; без проходов значение недоступно. Большие значения у индекса означают широкие выборки: проход перебирает много, отсекая мало."
pg.help.relation.dml_share: "Доля этой операции среди всех изменений строк таблицы — вставок, обновлений и удалений вместе. Показывает характер нагрузки: таблица в основном пополняется, правится или чистится."
pg.help.relation.row_estimate: "Оценка PostgreSQL для числа строк с указанным условием после обслуживания у курсора."
pg.help.relation.maintenance_mean: "Сколько миллисекунд в среднем длился один проход этого обслуживания; поле доступно с PostgreSQL 18, без операций недоступно. Затяжные проходы держат ресурсы и мешают обслуживанию успевать за изменениями."
pg.help.relation.buffer_hit: "Доля обращений к данным, которые нашлись в буферах PostgreSQL. Остальное читалось извне — не обязательно с диска, часто из кэша операционной системы; стабильно низкая доля у активно читаемой таблицы означает, что буферов не хватает."
pg.help.relation.buffer_bytes: "Байты буферов таблицы или индекса в секунду по записанному размеру блока PostgreSQL. Попадания — логическая активность; чтения извне не обязательно дисковые."
pg.help.relation.last_scan: "Время последнего соответствующего сканирования, известное у курсора. Поле доступно начиная с PostgreSQL 16."
pg.help.relation.last_maintenance: "Время последней указанной операции обслуживания, известное у курсора."
pg.help.relation.oldest_timestamp: "Самая ранняя непустая отметка времени среди объектов группы у курсора."
pg.help.relation.latest_timestamp: "Самая поздняя непустая отметка времени среди объектов группы у курсора."
pg.help.relation.never_count: "Число применимых объектов без записанной отметки времени указанной операции у курсора."
pg.help.relation.toast_never_count: "Число таблиц, у которых для служебного хранилища длинных значений у курсора не записано время автоочистки."
pg.help.relation.index_state_count: "Число индексов группы, для которых указанное состояние pg_index истинно у курсора."
pg.help.relation.tuple_throughput: "Сколько строк таблицы в секунду проходит через запросы — при полных проходах и через индексные обращения вместе. Рост при неизменном числе запросов означает, что на строку теперь приходится больше чтения."
pg.help.relation.sequential_share: "Доля полных проходов таблицы среди всех проходов по ней; без проходов значение недоступно. Высокая доля на большой таблице означает чтение целиком — обычно нет подходящего индекса; на маленьких таблицах это нормально."
pg.help.relation.dml_total: "Сколько строк в секунду меняется в таблице — вставки, обновления и удаления вместе. Отсюда берутся отжившие версии строк и работа для очистки."
pg.help.relation.hot_share: "Доля обновлений, при которых новая версия строки уместилась на той же странице и индексы трогать не пришлось; без обновлений значение недоступно. Чем выше, тем дешевле обновления — иначе каждое дописывает все индексы таблицы."
pg.help.relation.new_page_share: "Доля обновлений, при которых новая версия строки не поместилась на прежней странице и уехала на другую; поле доступно с PostgreSQL 16. Растёт, когда на страницах не остаётся свободного места; такие обновления дороже и дописывают все индексы."
pg.help.relation.dead_share: "Доля версий строк, которые уже никому не видны, но ещё занимают место в таблице. Копятся после обновлений и удалений, убираются очисткой; высокая доля раздувает таблицу и замедляет чтение."
pg.help.relation.displayed_storage: "Сумма размера основного слоя таблицы и полного размера служебного хранилища длинных значений у курсора. Обычные индексы и другие слои таблицы не входят."
pg.help.relation.table_data: "Размер основного слоя таблицы по данным pg_relation_size у курсора, в байтах."
pg.help.relation.index_data: "Размер основного слоя индекса по данным pg_relation_size у курсора, в байтах."
pg.help.relation.toast_share: "Какая часть занятого таблицей места приходится на вынесенные длинные значения — тексты, JSON и другие широкие поля, которые PostgreSQL хранит отдельно от строк. Высокая доля означает, что объём делают широкие поля, а не сами строки."
pg.help.relation.reltuples: "Оценка планировщика pg_class.reltuples у курсора, в строках; -1 означает отсутствие оценки."
pg.help.relation.toast_dead_share: "Доля отживших версий среди вынесенных длинных значений таблицы. Копится при обновлениях и удалениях строк с широкими полями; высокая доля раздувает это отдельное хранилище, пока его не пройдёт очистка."
pg.help.relation.xid_age: "Возраст relfrozenxid у курсора, в транзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.mxid_age: "Возраст relminmxid у курсора, в мультитранзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.no_scans: "Отмечает индексы, к которым за выбранный интервал точно не обратился ни один запрос. Недоступный интервал нулём не считается; долго не используемый индекс только замедляет записи и занимает место."
pg.help.relation.no_scan_count: "Сколько индексов группы за интервал точно остались без единого обращения. Постоянно ненулевое число — кандидаты на удаление: такие индексы только дорожают при записи."
pg.help.relation.known_scan_count: "Сколько индексов группы за интервал точно использовались запросами. Вместе с числом незадействованных показывает, какая часть индексов реально работает."
pg.help.relation.indisvalid: "Показывает, помечен ли индекс в pg_index как пригодный для запросов у курсора."
pg.help.relation.indisready: "Показывает, помечен ли индекс в pg_index как готовый принимать новые вставки у курсора."
pg.help.relation.indisprimary: "Показывает, обеспечивает ли индекс ограничение первичного ключа по данным pg_index у курсора."
pg.help.relation.indisunique: "Показывает, обеспечивает ли индекс уникальность по данным pg_index у курсора."
pg.help.relation.indisexclusion: "Показывает, обеспечивает ли индекс ограничение-исключение по данным pg_index у курсора."
