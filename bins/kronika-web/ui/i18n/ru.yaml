pg.field.max_exec_time_ms.label: "Максимум, мс"
pg.field.max_exec_time_ms.help: "Максимальное время исполнения, записанное за период статистики, в миллисекундах."
pg.field.mean_exec_time_ms.label: "Среднее, мс"
pg.field.mean_exec_time_ms.help: "Среднее время исполнения, записанное за период статистики, в миллисекундах."
pg.field.stddev_exec_time_ms.label: "Отклонение, мс"
