pg.pid.label: "PID PostgreSQL"
pg.pid.help: "PID процесса PostgreSQL. Он точно совпадает с выбранным PID Linux."
pg.leader_pid.label: "PID ведущего процесса"
pg.leader_pid.help: "PID ведущего процесса для группы параллельных работников. Проверьте тип процесса и запрос."
pg.datname.label: "База данных"
pg.datname.help: "Имя базы данных для процесса PostgreSQL. У фонового процесса базы может не быть."
pg.usename.label: "Роль"
pg.usename.help: "Роль PostgreSQL для этого процесса. У фонового процесса роли может не быть."
pg.application_name.label: "Приложение"
pg.application_name.help: "Точное значение application_name из PostgreSQL. Проверьте адрес клиента и тип процесса."
pg.client_addr.label: "Адрес клиента"
pg.client_addr.help: "Адрес клиента из PostgreSQL. Пустое значение означает локальное соединение."
pg.backend_type.label: "Тип процесса"
pg.backend_type.help: "Точное значение backend_type из PostgreSQL. Проверьте состояние и событие ожидания."
pg.state.label: "Состояние"
pg.state.help: "Текущее состояние процесса PostgreSQL. Рядом указаны ожидание и запрос."
pg.wait_event_type.label: "Класс ожидания"
pg.wait_event_type.help: "Класс события ожидания PostgreSQL. Проверьте событие ожидания и состояние."
pg.wait_event.label: "Событие ожидания"
pg.wait_event.help: "Событие, которого ждёт процесс PostgreSQL. Проверьте класс ожидания, состояние и запрос."
pg.query.label: "Запрос"
pg.query.help: "Точный текст запроса из pg_stat_activity. Проверьте состояние, ожидание и время начала запроса."
pg.query_id.label: "ID запроса"
pg.query_id.help: "Идентификатор запроса PostgreSQL без группировки цифр. Проверьте текст и время начала запроса."
pg.backend_xid_age.label: "Возраст XID"
pg.backend_xid_age.help: "Возраст ID транзакции процесса PostgreSQL, в транзакциях. Проверьте время начала транзакции и состояние."
pg.backend_xmin_age.label: "Возраст xmin"
pg.backend_xmin_age.help: "Возраст горизонта xmin процесса PostgreSQL, в транзакциях. Проверьте время начала транзакции и состояние."
pg.backend_start.label: "Процесс запущен"
pg.backend_start.help: "Время запуска процесса PostgreSQL в UTC. Проверьте время начала транзакции и запроса."
pg.xact_start.label: "Транзакция начата"
pg.xact_start.help: "Время начала текущей транзакции. Проверьте состояние, возраст XID и запрос."
pg.query_start.label: "Запрос начат"
pg.query_start.help: "Время начала текущего запроса. Проверьте состояние, ожидание и текст запроса."
pg.state_change.label: "Состояние изменено"
pg.state_change.help: "Время последнего изменения состояния процесса. Проверьте текущее состояние и время начала запроса."
