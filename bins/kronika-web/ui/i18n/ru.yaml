system.field.device.label: "Устройство"
system.field.device.help: "Имя блочного устройства в ядре. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.io_in_progress.label: "Выполняется операций I/O"
system.field.io_in_progress.help: "Число операций I/O, которые устройство выполняет сейчас. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.reads.label: "Чтения"
system.field.reads.help: "Общее число завершённых запросов чтения. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.writes.label: "Записи"
system.field.writes.help: "Общее число завершённых запросов записи. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.read_sectors.label: "Прочитано секторов"
system.field.read_sectors.help: "Общее число секторов, прочитанных с устройства. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.write_sectors.label: "Записано секторов"
system.field.write_sectors.help: "Общее число секторов, записанных на устройство. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.read_time_ms.label: "Время чтения"
system.field.read_time_ms.help: "Общее время выполнения запросов чтения. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.write_time_ms.label: "Время записи"
system.field.write_time_ms.help: "Общее время выполнения запросов записи. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.discards.label: "Операции discard"
system.field.discards.help: "Общее число завершённых операций discard. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.flushes.label: "Операции сброса"
system.field.flushes.help: "Общее число завершённых запросов сброса данных. Проверьте остальные счётчики устройства и PSI I/O в тот же момент."
system.field.mount_point.label: "Точка монтирования"
system.field.mount_point.help: "Путь, по которому смонтирована файловая система. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.fstype.label: "Файловая система"
system.field.fstype.help: "Тип файловой системы по данным ядра. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.source.label: "Источник"
system.field.source.help: "Устройство или другой источник точки монтирования. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.major.label: "Старший номер"
system.field.major.help: "Старшая часть идентификатора устройства Linux. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.minor.label: "Младший номер"
system.field.minor.help: "Младшая часть идентификатора устройства Linux. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.total_bytes.label: "Всего байтов"
system.field.total_bytes.help: "Полный объём файловой системы в байтах. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.free_bytes.label: "Свободно байтов"
system.field.free_bytes.help: "Свободный объём файловой системы в байтах. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.is_k8s_infra.label: "Служебная точка Kubernetes"
system.field.is_k8s_infra.help: "Признак служебной точки монтирования Kubernetes. Сопоставьте значение с источником, типом файловой системы и свободным местом."
system.field.iface.label: "Интерфейс"
system.field.iface.help: "Имя сетевого интерфейса в ядре. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.rx_bytes.label: "Получено байтов"
system.field.rx_bytes.help: "Общее число байтов, полученных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.rx_packets.label: "Получено пакетов"
system.field.rx_packets.help: "Общее число пакетов, полученных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.rx_errs.label: "Ошибки приёма"
system.field.rx_errs.help: "Общее число ошибок приёма на интерфейсе. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.rx_drop.label: "Потери при приёме"
system.field.rx_drop.help: "Общее число входящих пакетов, отброшенных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.tx_bytes.label: "Передано байтов"
system.field.tx_bytes.help: "Общее число байтов, переданных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.tx_packets.label: "Передано пакетов"
system.field.tx_packets.help: "Общее число пакетов, переданных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.tx_errs.label: "Ошибки передачи"
system.field.tx_errs.help: "Общее число ошибок передачи на интерфейсе. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.tx_drop.label: "Потери при передаче"
system.field.tx_drop.help: "Общее число исходящих пакетов, отброшенных интерфейсом. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.speed_mbit.label: "Скорость подключения"
system.field.speed_mbit.help: "Номинальная скорость подключения интерфейса в мегабитах в секунду. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.duplex.label: "Дуплексный режим"
system.field.duplex.help: "Режим обмена данными сетевого интерфейса. Проверьте приём, передачу, ошибки, отброшенные пакеты и параметры соединения вместе."
system.field.cpu_id.label: "ID CPU"
system.field.cpu_id.help: "Идентификатор логического CPU. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
system.field.model_name.label: "Модель CPU"
system.field.model_name.help: "Название модели процессора по данным ядра. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
system.field.mhz_max.label: "Максимальная частота"
system.field.mhz_max.help: "Максимальная частота логического CPU в мегагерцах. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
system.field.core_id.label: "ID ядра"
system.field.core_id.help: "Идентификатор физического ядра CPU. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
system.field.socket_id.label: "ID сокета"
system.field.socket_id.help: "Идентификатор процессорного сокета. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
system.field.numa_node.label: "Узел NUMA"
system.field.numa_node.help: "Идентификатор узла NUMA, содержащего логический CPU. Сопоставьте значение с соседними полями CPU, ядра, сокета и узла NUMA."
lane.health.label: "Состояние"
lane.health.help: "Оценка состояния ОС от 0 до 100 по данным PSI CPU, памяти и I/O. Сопоставьте изменения с линиями CPU, нагрузки, памяти и PSI."
lane.load.label: "Нагрузка"
lane.load.help: "Среднее число задач, готовых к выполнению или ждущих в непрерываемом ожидании, за минуту. Сопоставьте значение с использованием CPU, процессами, готовыми к выполнению, и PSI CPU у курсора."
lane.memory.label: "Память"
lane.memory.help: "Доля памяти, занятая тем, что нельзя вернуть без свопа или убийства процесса; страничный кэш не в счёт. Проверьте таблицу процессов в разрезе памяти."
lane.pressure.label: "PSI"
lane.pressure.help: "Доля времени за десять секунд, когда задачи ждали CPU, память или I/O. Сопоставьте каждую линию с соответствующими значениями ресурсов у курсора."
locator.known_bad: "Выход за порог"
locator.known_bad.help: "Значение пересекло настроенный порог. Проверьте соседние линии, затем откройте маркер с точной строкой."
locator.spike: "Всплеск"
locator.spike.help: "Значение превысило верхнюю границу Тьюки, рассчитанную по предыдущим значениям. Проверьте соседние линии, затем откройте маркер с точной строкой."
locator.event: "Событие журнала"
locator.event.help: "Событие определённого типа из журнала PostgreSQL. Проверьте соседние линии, затем откройте маркер с точной строкой."
table.processes: "Процессы на выбранный момент"
table.activate: "Выбрать процесс {pid}"
table.empty: "На выбранный момент нет данных о процессах"
table.no_rows: "На выбранный момент нет строк"
filter.label: "Фильтр строк по тексту"
filter.placeholder: "Фильтр: текст или шаблон с * и ?"
filter.hint: "Ищется в любом месте значения; * — любая последовательность символов, ? — один символ."
filter.kept: "{kept} из {total}"
filter.clear: "Очистить фильтр"
filter.none: "Под фильтр не подходит ни одна строка"
col.pid.label: "PID"
col.pid.help: "Идентификатор процесса Linux; время запуска позволяет распознать повторное использование PID. Сопоставьте его со временем запуска, командой и PID родителя."
col.command.label: "Команда"
col.command.help: "Полная командная строка процесса с аргументами. Сопоставьте её с PID, временем запуска и родительским процессом."
col.state.label: "Состояние"
col.state.help: "Состояние процесса Linux, например R, S, D или Z. Проверьте процесс, команду, состояние и значения выбранного раздела."
col.starttime.label: "Запущен"
col.starttime.help: "Время запуска процесса в UTC; вместе с PID оно определяет один жизненный цикл процесса. Сопоставьте его с командой и PID родителя."
col.ppid.label: "PPID"
col.ppid.help: "Идентификатор родительского процесса. Проверьте PID, время запуска, команду и PID родителя вместе."
col.uid.label: "UID"
col.uid.help: "Идентификатор реального пользователя процесса. Сопоставьте действительные и эффективные идентификаторы пользователя и группы."
col.euid.label: "EUID"
col.euid.help: "Идентификатор эффективного пользователя для проверки прав. Сопоставьте действительные и эффективные идентификаторы пользователя и группы."
col.gid.label: "GID"
col.gid.help: "Идентификатор реальной группы процесса. Сопоставьте действительные и эффективные идентификаторы пользователя и группы."
col.egid.label: "EGID"
col.egid.help: "Идентификатор эффективной группы для проверки прав. Сопоставьте действительные и эффективные идентификаторы пользователя и группы."
col.threads.label: "Потоки"
col.threads.help: "Число потоков процесса. Проверьте процесс, команду, состояние и значения выбранного раздела."
col.tty.label: "TTY"
col.tty.help: "Идентификатор управляющего терминала процесса. Проверьте процесс, команду, состояние и значения выбранного раздела."
col.nice.label: "Nice"
col.nice.help: "Значение nice, которое изменяет обычный приоритет планировщика Linux. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.prio.label: "Приоритет"
col.prio.help: "Текущий приоритет процесса в планировщике Linux. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.rtprio.label: "RT-приоритет"
col.rtprio.help: "Приоритет процесса для планирования реального времени. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.policy.label: "Политика"
col.policy.help: "Числовой идентификатор политики планировщика Linux. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.curcpu.label: "CPU"
col.curcpu.help: "Логический CPU, на котором процесс выполнялся последним или выполняется сейчас. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.utime.label: "Время CPU в пользовательском режиме"
col.utime.help: "Накопленное процессорное время в пользовательском режиме, в тактах системного таймера. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.stime.label: "Время CPU в режиме ядра"
col.stime.help: "Накопленное процессорное время в режиме ядра, в тактах системного таймера. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.rundelay.label: "Задержка выполнения"
col.rundelay.help: "Накопленное время ожидания в очереди выполнения, в наносекундах. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.blkdelay.label: "Задержка блочного I/O"
col.blkdelay.help: "Накопленная задержка блочного I/O, в тактах системного таймера. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.nvcsw.label: "Добровольные переключения контекста"
col.nvcsw.help: "Общее число переключений контекста, при которых процесс добровольно уступил CPU. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.nivcsw.label: "Принудительные переключения контекста"
col.nivcsw.help: "Общее число переключений контекста, при которых планировщик вытеснил процесс. Сопоставьте значение с состоянием, временем CPU, ожиданием очереди и полями планировщика."
col.minflt.label: "Minor faults"
col.minflt.help: "Общее число обращений к странице, которую не пришлось читать с накопителя. Сопоставьте значение с резидентной и виртуальной памятью, подкачкой и счётчиками faults."
col.majflt.label: "Major faults"
col.majflt.help: "Общее число обращений к странице, которую пришлось читать с накопителя. Сопоставьте значение с резидентной и виртуальной памятью, подкачкой и счётчиками faults."
col.vmem.label: "Виртуальная память"
col.vmem.help: "Размер виртуального адресного пространства процесса. Сопоставьте значение с резидентной и виртуальной памятью, подкачкой и счётчиками faults."
col.rmem.label: "Резидентная память"
col.rmem.help: "Объём физической памяти, занятый процессом. Сопоставьте значение с резидентной и виртуальной памятью, подкачкой и счётчиками faults."
col.vswap.label: "Подкачка"
col.vswap.help: "Объём пространства подкачки, занятый процессом. Сопоставьте значение с резидентной и виртуальной памятью, подкачкой и счётчиками faults."
col.syscr.label: "Вызовы чтения"
col.syscr.help: "Общее число системных вызовов чтения. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.syscw.label: "Вызовы записи"
col.syscw.help: "Общее число системных вызовов записи. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.rchar.label: "Прочитано с кэшем"
col.rchar.help: "Общее число байтов, переданных через вызовы чтения, включая попадания в страничный кэш. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.wchar.label: "Записано с кэшем"
col.wchar.help: "Общее число байтов, переданных через вызовы записи, включая запись в страничный кэш. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.read_bytes.label: "Прочитано с диска"
col.read_bytes.help: "Общее число байтов, фактически прочитанных с накопителя по запросу процесса. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.write_bytes.label: "Записано на диск"
col.write_bytes.help: "Общее число байтов, фактически записанных на накопитель по запросу процесса. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.cancelled_write.label: "Отменённая запись"
col.cancelled_write.help: "Общее число байтов, запись которых была отменена, например при усечении файла. Сопоставьте значение с соседними счётчиками чтения, записи и задержки I/O."
col.exit_signal.label: "Сигнал выхода"
col.exit_signal.help: "Сигнал, который получит родитель после завершения процесса. Проверьте процесс, команду, состояние и значения выбранного раздела."
detail.process.title: "Процесс"
detail.process.help: "PID и время запуска однозначно определяют процесс Linux. Проверьте командную строку и значения выбранного раздела."
detail.cmdline.label: "Командная строка"
detail.cmdline.help: "Полная командная строка процесса с аргументами. Проверьте её вместе с PID, временем запуска и PID родителя."
detail.pg.title: "PostgreSQL"
detail.pg_pid: "PostgreSQL PID {pid}"
detail.pg.help: "Процесс PostgreSQL с тем же PID в выборке активности, ближайшей к курсору. Проверьте состояние, событие ожидания, запрос и время."
detail.pg_snapshot.label: "Время активности"
detail.pg_snapshot.help: "Время выборки активности, по которой сопоставлен PID. Сопоставьте его с курсором и временем запуска процесса Linux."
pg.sections: "Разделы PostgreSQL"
pg.no_section_data: "Для этого раздела нет данных в выбранном часу"
