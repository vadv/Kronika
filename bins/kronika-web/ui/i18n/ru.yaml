filter.help.open: "Синтаксис и поля поиска"
filter.help.title: "Поиск в этой таблице"
filter.help.grammar: "Для ID и текста используйте field:value, для метрик — field>quantity или field<quantity. Соединяйте через AND и OR: первым выполняется AND, порядок меняют скобки. Ключевые слова сохраняются прописными. Без синтаксиса поля ввод остаётся текстовым поиском."
filter.help.rules: "Сравнение выполняется по точным значениям до сортировки и разбиения на страницы. MB — десятичная единица, MiB — двоичная; скорости задаются с /s, недоступное значение остаётся null. Регистр единиц и операторов важен. В сгруппированных Tables и Indexes оператор OR не может объединять текстовые условия с условиями по метрикам; соединяйте их через AND. NOT не поддерживается. Поиск применяется только при полностью корректном выражении."
filter.quantity.block_byte_rate.help: "Скорость прироста счётчика с учётом записанного размера блока PostgreSQL; единицы SI или IEC в byte/s."
filter.quantity.byte_rate.help: "Скорость прироста байтового счётчика; единицы SI или IEC в byte/s."
filter.quantity.count.help: "Точное целое значение у курсора, без единицы."
filter.quantity.count_rate.help: "Точная скорость прироста счётчика, в /s."
filter.quantity.cpu_cores.help: "Прирост счётчика CPU, поделённый на интервал и записанную тактовую частоту; десятичное число без единицы."
filter.quantity.duration_rate.help: "Точное накопленное время в секунду; ns/s, us/s, ms/s или s/s."
filter.quantity.gauge_bytes.help: "Точное значение у курсора; единица SI или IEC для байтов."
filter.quantity.interval_duration.help: "Среднее время выполнения за интервал: прирост времени, поделённый на Calls; ns, us, ms, s, min или h."
filter.quantity.per_call_bytes.help: "Байты за интервал, поделённые на Calls; единица SI или IEC."
filter.quantity.percentage.help: "Точный процент; от 0% до 100%."
filter.quantity.recorded_duration.help: "Записанное значение за период после сброса статистики; ns, us, ms, s, min или h."
filter.quantity.scalar.help: "Точное отношение; десятичное число без единицы."
filter.help.fields: "Поля этого раздела поиска"
filter.help.aliases: "псевдонимы: {aliases}"
filter.help.examples: "Примеры для копирования"
filter.help.copy: "Скопировать пример"
filter.error.empty_group: "Внутри скобок должно быть условие поиска."
filter.error.expression_too_long: "Поисковая строка слишком длинная."
filter.error.expected_boolean_operator: "Перед «{token}» ожидается AND или OR."
filter.error.expected_colon: "Укажите поле и поставьте после него двоеточие."
filter.error.group_too_deep: "Скобки можно вкладывать не более чем на 4 уровня."
filter.error.invalid_escape: "В кавычках разрешены только экранирования \\\" и \\\\."
filter.error.invalid_identifier: "ID должен быть точным десятичным текстом в допустимом диапазоне."
filter.error.invalid_number: "Используйте обычные десятичные цифры с необязательной точкой; экспонента, запятая, знак и разделители разрядов не поддерживаются."
filter.error.invalid_unit: "Единица «{token}» не подходит этому полю; регистр единиц важен."
filter.error.malformed_operator: "Оператор «{token}» записан неверно. Для величин доступны только > и <."
filter.error.missing_operand: "Добавьте условие поиска с обеих сторон AND или OR."
filter.error.missing_value: "После двоеточия нужно значение."
filter.error.mixed_phase_or: "В сгруппированном OR нельзя смешивать имена или текст с метриками; соедините эти части через AND."
filter.error.negative_not_allowed: "Порог сравнения не может быть отрицательным."
filter.error.non_integral_base_value: "Дробное значение не переводится точно в базовую единицу."
filter.error.operator_not_allowed: "Для ID и текста используйте :, а для величин — только > или <."
filter.error.out_of_range: "Точное значение выходит за допустимый диапазон."
filter.error.quoted_quantity: "Пишите величину без кавычек, например size>100MB."
filter.error.too_many_clauses: "В поиске может быть не больше 8 фильтров."
filter.error.too_many_tokens: "В поиске слишком много операторов или скобок."
filter.error.unbalanced_parenthesis: "Для каждой открывающей скобки нужна закрывающая."
filter.error.unit_required: "Добавьте единицу без пробела, например 100MB, 99.5% или 10/s."
filter.error.unknown_field: "В этой таблице нет поля «{token}»."
filter.error.unsupported_operator: "Оператор «{token}» не поддерживается. Сравнения выполняются строго через > или <."
filter.error.unsupported_syntax: "«{token}» зарезервировано для будущей версии поиска; NOT пока не поддерживается."
