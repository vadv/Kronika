pg.vacuum.heap_blks_total.label: "Всего блоков таблицы"
pg.vacuum.heap_blks_total.help: "Число блоков таблицы на момент начала сканирования этой операцией VACUUM."
pg.vacuum.heap_blks_vacuumed.label: "Очищено блоков таблицы"
pg.vacuum.heap_blks_vacuumed.help: "Число блоков таблицы, очищенных этой операцией VACUUM к выбранному снимку."
pg.vacuum.index_vacuum_count.label: "Циклы очистки индексов"
pg.vacuum.index_vacuum_count.help: "Число завершённых циклов очистки индексов этой операцией VACUUM к выбранному снимку."
pg.vacuum.indexes_processed.label: "Обработано индексов"
pg.vacuum.indexes_processed.help: "Число индексов, обработанных в текущем цикле к выбранному снимку; поле доступно начиная с PostgreSQL 17."
pg.vacuum.indexes_total.label: "Всего индексов"
pg.vacuum.indexes_total.help: "Число индексов, подлежащих обработке в текущем цикле, у курсора; поле доступно начиная с PostgreSQL 17."
pg.vacuum.num_dead_tuples.label: "Собрано мёртвых строк"
pg.vacuum.num_dead_tuples.help: "Число мёртвых строк, собранных в текущем цикле к выбранному снимку; поле используется в PostgreSQL 10–16."
pg.vacuum.max_dead_tuples.label: "Вместимость мёртвых строк"
pg.vacuum.max_dead_tuples.help: "Вместимость хранилища мёртвых строк текущего цикла у курсора; поле используется в PostgreSQL 10–16."
pg.vacuum.num_dead_item_ids.label: "ID мёртвых элементов"
pg.vacuum.num_dead_item_ids.help: "Число идентификаторов мёртвых элементов, собранных в текущем цикле к выбранному снимку; поле доступно начиная с PostgreSQL 17."
pg.vacuum.dead_tuple_bytes.label: "Память мёртвых элементов"
pg.vacuum.dead_tuple_bytes.help: "Память, занятая хранилищем идентификаторов мёртвых элементов у курсора, в байтах; поле доступно начиная с PostgreSQL 17."
pg.vacuum.max_dead_tuple_bytes.label: "Вместимость мёртвых элементов"
pg.vacuum.max_dead_tuple_bytes.help: "Вместимость хранилища идентификаторов мёртвых элементов у курсора, в байтах; поле доступно начиная с PostgreSQL 17."
pg.vacuum.delay_time.label: "Задержка по стоимости"
pg.vacuum.delay_time.help: "Время сна этой операции VACUUM в точках задержки по стоимости, в миллисекундах; поле доступно начиная с PostgreSQL 18."
pg.vacuum.phase.label: "Фаза"
pg.vacuum.phase.help: "Текущая фаза VACUUM по данным выбранного снимка."
pg.backend_xid_age.label: "Возраст XID"
pg.backend_xid_age.help: "Возраст текущего XID процесса у курсора, в транзакциях; недоступен без текущего XID."
pg.backend_xmin_age.label: "Возраст xmin"
pg.backend_xmin_age.help: "Возраст горизонта xmin процесса у курсора, в транзакциях; недоступен без горизонта xmin."
pg.backend_start.label: "Процесс запущен"
pg.backend_start.help: "Время запуска процесса PostgreSQL."
pg.xact_start.label: "Транзакция начата"
pg.xact_start.help: "Время начала текущей транзакции процесса; недоступно вне транзакции."
pg.query_start.label: "Запрос начат"
pg.query_start.help: "Время начала текущего запроса или последнего запроса неактивного процесса."
pg.state_change.label: "Состояние изменено"
pg.state_change.help: "Время последнего изменения состояния процесса."
pg.field.queryid.label: "ID запроса"
pg.field.queryid.help: "Идентификатор запроса, сохранённый для этой физической записи запроса или плана; vadv использует собственный идентификатор расширения."
pg.field.planid.label: "ID плана"
pg.field.planid.help: "Идентификатор, присвоенный этой физической записи плана расширением pg_store_plans на сервере PostgreSQL."
pg.field.toplevel.label: "Верхний уровень"
pg.field.toplevel.help: "Показывает, относится ли физическая запись к выполнению верхнего уровня, а не к выполнению внутри другого запроса."
pg.field.datname.label: "База данных"
