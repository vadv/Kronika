system.group.cpu: "CPU и планировщик"
system.group.cpu.help: "Использование CPU и работа планировщика в момент курсора. При росте числа готовых или заблокированных процессов проверьте нагрузку и PSI."
system.group.load: "Нагрузка"
system.group.load.help: "Число готовых к выполнению задач за одну, пять и пятнадцать минут. Сравните с использованием CPU и PSI CPU."
system.group.memory: "Память и swap"
system.group.memory.help: "Доступная память, кеш, swap и завершения OOM в момент курсора. Сравните эти значения с PSI памяти."
system.group.pressure: "PSI"
system.group.pressure.help: "Доля времени ожидания CPU, памяти и I/O за десять секунд. Сравните каждую линию с показателями соответствующего ресурса."
system.metric.health.label: "Состояние ОС"
system.metric.health.help: "Сводный показатель состояния ОС в момент курсора. Сравните его изменения с CPU, нагрузкой, памятью и PSI."
system.metric.cpu_busy.label: "CPU занят"
system.metric.cpu_busy.help: "Доля времени CPU вне idle. Сравните с числом готовых и заблокированных процессов и общей нагрузкой."
system.metric.procs_running.label: "Готовые процессы"
system.metric.procs_running.help: "Число процессов, готовых к выполнению, по данным /proc/stat. Сравните с использованием CPU и нагрузкой за минуту."
system.metric.procs_blocked.label: "Процессы в ожидании I/O"
system.metric.procs_blocked.help: "Число процессов, ожидающих I/O, по данным /proc/stat. Проверьте PSI I/O и работу устройств."
system.metric.context_switches.label: "Переключения контекста"
system.metric.context_switches.help: "Общее число переключений контекста с запуска системы. Проверьте скорость роста вместе с числом готовых процессов и использованием CPU."
system.metric.load1.label: "Нагрузка 1 мин"
system.metric.load1.help: "Средняя нагрузка за минуту. Сравните с числом готовых задач и использованием CPU рядом с курсором."
system.metric.load5.label: "Нагрузка 5 мин"
system.metric.load5.help: "Средняя нагрузка за пять минут. Сравните со значениями за одну и пятнадцать минут."
system.metric.load15.label: "Нагрузка 15 мин"
system.metric.load15.help: "Средняя нагрузка за пятнадцать минут. Сравните со значениями за более короткие интервалы."
system.metric.runnable.label: "Готовые задачи"
system.metric.runnable.help: "Число готовых к выполнению задач по данным /proc/loadavg. Проверьте общее число задач, использование CPU и PSI CPU."
system.metric.tasks.label: "Всего задач"
system.metric.tasks.help: "Общее число задач по данным /proc/loadavg. Сравните с числом готовых задач и таблицей процессов."
system.metric.mem_available_percent.label: "Доступно памяти"
system.metric.mem_available_percent.help: "Оценка ядра для памяти, доступной новым задачам, в процентах от общего объёма. Проверьте PSI памяти и swap."
system.metric.mem_available.label: "Доступная память"
system.metric.mem_available.help: "Оценка ядра для памяти, доступной новым задачам. Проверьте кеш, swap и PSI памяти."
system.metric.mem_total.label: "Всего памяти"
system.metric.mem_total.help: "Общий объём доступной системе памяти по данным ядра. Используйте как базу для оценки доступной памяти."
system.metric.cached.label: "Страничный кеш"
system.metric.cached.help: "Память, занятая страничным кешем ядра. Сравните с доступной памятью и работой устройств."
system.metric.swap_free.label: "Свободно swap"
system.metric.swap_free.help: "Свободное место в swap. Сравните с общим объёмом swap, доступной памятью и PSI памяти."
system.metric.swap_total.label: "Всего swap"
system.metric.swap_total.help: "Настроенный объём swap. Сравните со свободным swap и использованием swap процессами."
system.metric.oom_kill.label: "Завершения OOM"
system.metric.oom_kill.help: "Общее число процессов, завершённых OOM killer с запуска системы. При росте проверьте доступную память, swap и PSI памяти."
system.metric.cpu_pressure.label: "PSI CPU 10 с"
system.metric.cpu_pressure.help: "Средняя за десять секунд доля времени, когда хотя бы одна задача ждала CPU. Проверьте использование CPU и число готовых задач."
system.metric.memory_pressure.label: "PSI памяти 10 с"
system.metric.memory_pressure.help: "Средняя за десять секунд доля времени, когда хотя бы одна задача ждала память. Проверьте доступную память и swap."
system.metric.io_pressure.label: "PSI I/O 10 с"
system.metric.io_pressure.help: "Средняя за десять секунд доля времени, когда хотя бы одна задача ждала I/O. Проверьте показатели устройств и I/O процессов."
system.history: "История за час"
system.no_metrics: "В выбранном часу нет системных показателей"
system.entities.devices: "Блочные устройства"
system.entities.mounts: "Точки монтирования"
system.entities.network: "Сетевые интерфейсы"
system.entities.topology: "Топология CPU"
lane.health.label: "Состояние"
lane.health.help: "Сводный показатель состояния ОС за выбранный час. Интервалы без точек остаются пустыми."
lane.load.label: "Нагрузка"
lane.load.help: "Средняя нагрузка за минуту в течение выбранного часа. Вертикальный масштаб зависит от значений за этот час."
lane.memory.label: "Память"
lane.memory.help: "Доступная память в течение выбранного часа. Вертикальный масштаб зависит от значений за этот час."
lane.pressure.label: "PSI"
lane.pressure.help: "Ожидание CPU, памяти и I/O за десять секунд в течение выбранного часа. В момент курсора проверьте показатели соответствующего ресурса."
