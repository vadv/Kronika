col.pid.label: "PID"
col.pid.help: "PID процесса Linux. Время запуска помогает отличить повторно использованный PID."
col.command.label: "Команда"
col.command.help: "Полная строка /proc/PID/cmdline; если она пуста, Kronika показывает /proc/PID/comm. Рядом указаны PID и время запуска."
col.state.label: "Состояние"
col.state.help: "Состояние процесса Linux, например R, S, D или Z. Проверьте показатели CPU и I/O выбранного процесса."
col.starttime.label: "Запущен"
col.starttime.help: "Время запуска процесса в UTC. Вместе с PID оно однозначно определяет процесс Linux."
col.ppid.label: "PPID"
col.ppid.help: "PID родительского процесса. PID и команда показывают место процесса в иерархии."
col.uid.label: "UID"
col.uid.help: "Идентификатор реального пользователя. Сравните с EUID, чтобы проверить, кто запустил процесс."
col.euid.label: "EUID"
col.euid.help: "Идентификатор эффективного пользователя для проверки прав. Сравните с UID."
col.gid.label: "GID"
col.gid.help: "Идентификатор реальной группы. Сравните с EGID в данных процесса."
col.egid.label: "EGID"
col.egid.help: "Идентификатор эффективной группы для проверки прав. Сравните с GID."
col.threads.label: "Потоки"
col.threads.help: "Число потоков процесса. Проверьте историю за час и показатели CPU."
col.tty.label: "TTY"
col.tty.help: "Идентификатор управляющего терминала процесса. Команда и PPID дают дополнительный контекст."
col.nice.label: "Nice"
col.nice.help: "Значение nice, влияющее на обычный приоритет планировщика Linux. Рядом указаны приоритет и политика."
col.prio.label: "Приоритет"
col.prio.help: "Приоритет процесса по данным планировщика Linux. Сравните с Nice, RT-приоритетом и политикой."
col.rtprio.label: "RT-приоритет"
col.rtprio.help: "Приоритет процесса для планирования реального времени. Рядом указаны политика и обычный приоритет."
col.policy.label: "Политика"
col.policy.help: "Числовая политика планировщика Linux. Проверьте приоритеты и использование CPU."
col.curcpu.label: "CPU"
col.curcpu.help: "Последний или текущий логический CPU процесса. Проверьте топологию CPU и процессорное время процесса."
col.utime.label: "User jiffies"
col.utime.help: "Общее процессорное время в пользовательском режиме, в jiffies планировщика. Сравните рост за час с System jiffies."
col.stime.label: "System jiffies"
col.stime.help: "Общее процессорное время в режиме ядра, в jiffies планировщика. Сравните рост за час с User jiffies."
col.rundelay.label: "Задержка выполнения"
col.rundelay.help: "Общее время ожидания в очереди выполнения, в наносекундах. Проверьте PSI CPU и число готовых задач."
col.blkdelay.label: "Задержка блочного I/O"
col.blkdelay.help: "Общая задержка блочного I/O, в шагах планировщика. Проверьте чтение, запись и PSI I/O."
col.nvcsw.label: "Добровольные переключения"
col.nvcsw.help: "Общее число добровольных переключений контекста. Проверьте ожидания, I/O и состояние процесса."
col.nivcsw.label: "Вынужденные переключения"
col.nivcsw.help: "Общее число вынужденных переключений контекста. Проверьте PSI CPU, задержку выполнения и приоритет."
col.minflt.label: "Малые страничные отказы"
col.minflt.help: "Общее число страничных отказов без обращения к накопителю. Проверьте резидентную память и большие страничные отказы."
col.majflt.label: "Большие страничные отказы"
col.majflt.help: "Общее число страничных отказов с обращением к накопителю. Проверьте резидентную память и чтение процесса."
col.vmem.label: "Виртуальная память"
col.vmem.help: "Размер виртуального адресного пространства. Сравните с резидентной памятью и swap."
col.rmem.label: "Резидентная память"
col.rmem.help: "Объём физической памяти процесса. Проверьте историю за час, виртуальную память и swap."
col.vswap.label: "Swap"
col.vswap.help: "Объём swap, занятый процессом. Проверьте резидентную и доступную память, а также PSI памяти."
col.syscr.label: "Вызовы чтения"
col.syscr.help: "Общее число системных вызовов чтения. Прочерк означает, что значения нет; ноль показан как 0."
col.syscw.label: "Вызовы записи"
col.syscw.help: "Общее число системных вызовов записи. Прочерк означает, что значения нет; ноль показан как 0."
col.rchar.label: "Прочитано символов"
col.rchar.help: "Общее число символов, переданных через вызовы чтения, включая попадания в страничный кеш. Рядом указано число прочитанных байтов."
col.wchar.label: "Записано символов"
col.wchar.help: "Общее число символов, переданных через вызовы записи, включая запись в страничный кеш. Рядом указано число записанных байтов."
col.read_bytes.label: "Прочитано байтов"
col.read_bytes.help: "Общее число байтов, полученных с уровня накопителя. Проверьте вызовы чтения и PSI I/O."
col.write_bytes.label: "Записано байтов"
col.write_bytes.help: "Общее число байтов, переданных на уровень накопителя. Проверьте вызовы записи и PSI I/O."
col.cancelled_write.label: "Отменённая запись"
col.cancelled_write.help: "Общее число байтов записи, отменённых до передачи накопителю. Проверьте записанные байты и состояние процесса."
col.exit_signal.label: "Сигнал выхода"
col.exit_signal.help: "Сигнал, который получит родитель после завершения процесса. Проверьте PPID и состояние процесса."
col.scope.label: "Область сбора"
col.scope.help: "Числовая область сбора ОС для строки процесса. Рядом указаны идентификаторы процесса."
detail.process.title: "Процесс"
detail.process.help: "PID и время запуска однозначно определяют процесс Linux. Проверьте командную строку и показатели выбранного режима."
detail.cmdline.label: "Командная строка"
detail.cmdline.help: "Точный текст /proc/PID/cmdline; если он пуст, Kronika показывает /proc/PID/comm."
detail.pg.title: "PostgreSQL"
