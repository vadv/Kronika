activity.indexes.title: "Indexes Activity"
activity.indexes.title.help: "Ранжирование Indexes за час с 12 пятиминутными ячейками. Ячейки показывают скорость за интервал; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор, выбор строки фильтрует Indexes."
