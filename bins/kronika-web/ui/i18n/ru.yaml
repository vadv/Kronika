activity.cgroup_cpu.title: "Cgroup CPU Activity"
activity.cgroup_cpu.title.help: "Ранжирование cgroups за час по метрике CPU. Ячейки показывают скорость за интервал; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор."
activity.cgroup_io.title: "Cgroup I/O Activity"
activity.cgroup_io.title.help: "Ранжирование cgroups и блочных устройств за час по метрике I/O. Ячейки показывают скорость за интервал; пустая означает отсутствие значения, самая светлая — ноль. Справа указаны итог за час и значение под курсором. Выбор ячейки перемещает курсор."
