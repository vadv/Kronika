name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Release binaries are musl (.cargo/config.toml); runners have no musl std,
  # so lint and test build for host gnu instead.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Rust toolchain
        run: rustc --version | grep -F "rustc 1.96.0 "
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: bins/kronika-web/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: make ui-install ui-check
      - run: git diff --exit-code -- bins/kronika-web/ui/kronika-ui.html.gz
      - run: make fmt-check lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Rust toolchain
        run: rustc --version | grep -F "rustc 1.96.0 "
      - uses: Swatinem/rust-cache@v2
      - run: make test

  bdd:
    name: bdd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Report the dependency-layer cache key
        run: |
          echo "BDD dependency key: $(./scripts/bdd-image.sh deps-key)"
      - run: ./scripts/bdd-image.sh run
