name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Release binaries are musl (.cargo/config.toml); runners have no musl std,
  # so lint and test build for host gnu instead.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  bdd:
    name: bdd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Report the dependency-layer cache key
        run: echo "BDD dependency key: $(./scripts/bdd-image.sh deps-key)"
      - run: ./scripts/bdd-image.sh run
