[package]
name = "kronika-reader"
description = "Reading a Kronika data directory back into rows"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kronika-format = { path = "../kronika-format" }
kronika-registry = { path = "../kronika-registry" }
kronika-store = { path = "../kronika-store" }
arrow-array = "55"
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"] }

[lints]
workspace = true
