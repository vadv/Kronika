[package]
name = "kronika-query"
description = "Storage-neutral execution of recorded-data queries"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
kronika-format = { path = "../kronika-format" }
kronika-index = { path = "../kronika-index" }
kronika-reader = { path = "../kronika-reader" }
kronika-registry = { path = "../kronika-registry" }
kronika-store = { path = "../kronika-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kronika-layout = { path = "../kronika-layout" }
kronika-writer = { path = "../kronika-writer" }
tempfile = "3"

[lints]
workspace = true
